<!DOCTYPE html>
<html lang="nb" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoseMaker – Global Onsite · slangeproduksjon (PMOTION-modul, prototype)</title>
<style>
:root{
  --bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f0f4ff;--muted:#8892a4;--accent:#3b82f6;--accent2:#60a5fa;
  --good:#34d399;--warn:#fbbf24;--bad:#f87171;--info:#67e8f9;
  --good-bg:rgba(52,211,153,.12);--warn-bg:rgba(251,191,36,.12);--bad-bg:rgba(248,113,113,.12);--info-bg:rgba(103,232,249,.10);
  --radius:12px;--font:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'DM Mono','Cascadia Mono',Consolas,monospace;
  --head:Syne,Inter,-apple-system,sans-serif;
}
[data-theme="light"]{
  --bg:#f0f4ff;--surface:#ffffff;--surface2:#f8faff;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --text:#111827;--muted:#6b7280;--accent:#2563eb;--accent2:#1d4ed8;
  --good:#047857;--warn:#b45309;--bad:#b91c1c;--info:#0e7490;
  --good-bg:rgba(4,120,87,.10);--warn-bg:rgba(180,83,9,.10);--bad-bg:rgba(185,28,28,.08);--info-bg:rgba(14,116,144,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
button{font-family:var(--font)}
.shell{display:flex;flex-direction:column;height:100vh}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar .logo{font-family:var(--head);font-weight:700;font-size:17px;letter-spacing:.4px;white-space:nowrap}
.topbar .logo span{color:var(--accent2)}
.verbadge{font-family:var(--mono);font-size:11px;color:var(--muted);border:1px solid var(--border2);border-radius:20px;padding:2px 9px;white-space:nowrap}
.fsbar .fsver{font-family:var(--mono);font-size:12px;color:var(--muted);background:var(--surface);border:1px solid var(--border2);border-radius:99px;padding:8px 14px;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.badge-proto{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:20px;padding:2px 12px;font-size:11.5px;font-weight:600;white-space:nowrap}
.topbar .spacer{flex:1}
.userbox{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.userbox select{background:var(--surface2);color:var(--text);border:1px solid var(--border2);border-radius:8px;padding:4px 8px;font-size:12.5px}
.iconbtn{background:none;border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:14px}
.iconbtn:hover{background:var(--surface2)}

/* ---------- layout ---------- */
.main{display:flex;flex:1;min-height:0}
.sidebar{width:222px;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;border:none;background:none;width:100%;text-align:left;font-size:13.5px}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-sep{margin:10px 6px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.content{flex:1;overflow-y:auto;padding:22px 26px}
h1{font-family:var(--head);font-size:21px;margin-bottom:4px}
h2{font-family:var(--head);font-size:16px;margin:18px 0 10px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}

/* ---------- cards & tiles ---------- */
.cardrow{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;min-width:150px;flex:1}
.tile .t-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.tile .t-value{font-family:var(--head);font-size:26px;font-weight:700}
.tile .t-note{font-size:12px;color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}

/* ---------- folder cards ---------- */
.pmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.pmcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .15s}
.pmcard:hover{border-color:var(--accent)}
.pmcard .pm-id{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.pmcard .pm-title{font-weight:600;font-size:14.5px;margin:3px 0 8px}
.pmcard .pm-meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}

/* status badges: alltid ikon + tekst, aldri bare farge */
.status{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:2px 11px;font-size:11.5px;font-weight:600;border:1px solid}
.st-utkast{color:var(--muted);border-color:var(--border2);background:var(--surface2)}
.st-klar{color:var(--accent2);border-color:var(--accent);background:rgba(59,130,246,.12)}
.st-prod{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.st-test{color:var(--info);border-color:var(--info);background:var(--info-bg)}
.st-ferdig{color:var(--good);border-color:var(--good);background:var(--good-bg)}
.st-arkiv{color:var(--muted);border-color:var(--border2);background:none}

/* meter */
.meter{background:var(--surface2);border-radius:6px;height:9px;overflow:hidden;margin-top:4px}
.meter>div{height:100%;border-radius:6px;background:var(--accent)}
.meter.m-good>div{background:var(--good)}
.meter-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}

/* ---------- buttons ---------- */
.btn{border:none;border-radius:9px;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-good{background:var(--good);color:#06281c}
[data-theme="light"] .btn-good{color:#fff}
.btn-ghost{background:none;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover{background:var(--surface2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-big{font-size:15px;padding:13px 26px;border-radius:11px}

/* ---------- wizard ---------- */
.steps{display:flex;gap:0;margin-bottom:22px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:12.5px;color:var(--muted);border-bottom:2px solid var(--border)}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;border:1px solid var(--border2)}
.step.active{color:var(--text);border-bottom-color:var(--accent)}
.step.active .n{background:var(--accent);color:#fff;border-color:var(--accent)}
.step.done{color:var(--good);border-bottom-color:var(--good)}
.step.done .n{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.wizfoot{display:flex;justify-content:space-between;margin-top:20px;gap:10px;flex-wrap:wrap}
.gatemsg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--warn)}

/* forms */
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.frm label{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.frm input,.frm select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;color:var(--text);padding:9px 12px;font-size:13.5px;font-family:var(--font)}
textarea{font-family:var(--mono);font-size:12px;min-height:150px;resize:vertical}
.frm input:focus,.frm select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--surface2);text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-top:1px solid var(--border);white-space:nowrap}
td.mono,.mono{font-family:var(--mono)}
tr.rowbad td{background:var(--bad-bg)}
tr.rowwarn td{background:var(--warn-bg)}
td input{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:3px 7px;font-size:12px;font-family:var(--mono);width:110px}
td input.cellbad{border-color:var(--bad)}

/* ---------- redigerbart rutenett (veiviser steg 2) ---------- */
.gridbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.rowdel{background:none;border:1px solid var(--border2);border-radius:7px;color:var(--muted);padding:2px 8px;font-size:12px;cursor:pointer;line-height:1.4}
.rowdel:hover{border-color:var(--bad);color:var(--bad)}
td .ptspill{display:inline-block;font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px dashed var(--border2);color:var(--muted)}
td .ptspill.has{border-style:solid;border-color:var(--accent);color:var(--text)}
.pastefold{margin-top:12px;padding:12px;border:1px dashed var(--border2);border-radius:var(--radius);background:var(--surface2)}
.telbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--good-bg);border:1px solid var(--good);color:var(--text)}

/* ---------- antall > 1: må være umulig å overse på verkstedet ---------- */
.qtybadge{display:inline-flex;align-items:center;gap:6px;background:var(--warn-bg);border:2px solid var(--warn);color:var(--text);font-weight:800;border-radius:12px;padding:5px 14px;font-size:17px;white-space:nowrap}
.touch .qtybadge{font-size:21px;padding:8px 18px}
.qtybadge.mini{font-size:12.5px;padding:2px 9px;border-width:1.5px;border-radius:9px}
.touch .qtybadge.mini{font-size:14px}

/* iPad-optimalisert fokuskort: full bredde. Liggende: POS-banner over hele
   bredden, stor tegning (slange + koblinger) til venstre, mål/teller til
   høyre, bekreft-knappen i full bredde nederst. Stående: én kolonne. */
.touch .focus-wrap{max-width:none}
.fc-grid{display:grid;gap:14px;grid-template-areas:"pos" "main" "act" "photo"}
.fc-pos{grid-area:pos}
.fc-maincol{grid-area:main;min-width:0}
.fc-act{grid-area:act;min-width:0}
.fc-photo2{grid-area:photo;border-top:1px dashed var(--border2);padding-top:14px}
.fc-pos .posref{text-align:left}
.fc-pos .posref .p-num{font-size:56px;line-height:1}
@media(orientation:landscape) and (min-width:900px){
  .touch .fc-grid{grid-template-columns:11fr 9fr;grid-template-areas:"pos pos" "photo main" "photo act";grid-template-rows:auto auto 1fr;align-items:start;column-gap:28px}
  .touch .fc-act{align-self:start}
  .touch .fc-photo2{border-top:none;padding-top:0;margin-top:0}
  /* POS-banner: alt på én linje over hele bredden */
  .touch .fc-pos .posref{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--border);padding-bottom:10px}
  .touch .fc-pos .posref .p-label{font-size:15px;letter-spacing:2px}
  .touch .fc-pos .posref .p-num{font-size:76px}
  .touch .fc-pos .posref .p-mach{font-size:17px}
  .touch .fc-pos .posref .p-ctx{font-size:13px}
  .touch .fc-pos .posref .qtybadge{margin-top:0;margin-left:auto;font-size:24px;padding:10px 22px}
  /* stor tegning: slange + koblinger skal være tydelige */
  .touch .fc-photo2 .assembly{max-width:none}
  .touch .fc-photo2 .assembly .asm-slot .imgclip{height:190px}
  .touch .fc-photo2 .assembly .asm-lab{font-size:14px}
  .touch .fc-photo2 .assembly .asm-geo{font-size:11.5px}
  .touch .fc-photo2 .hpanel{max-width:none}
  .touch .fc-photo2 .hpanel .imgclip{height:230px}
  .touch .fc-photo2 .hpanel .asm-lab{font-size:14px}
  .touch .fc-maincol .focus-main{font-size:clamp(44px,5.5vw,80px)}
  /* kompakte nøkkeltall i høyrekolonnen så bekreft-knappen alltid er synlig */
  .touch .fc-grid{row-gap:10px}
  .touch .fc-maincol .focus-meta{gap:14px;margin:10px 0 2px;flex-wrap:nowrap;overflow-x:auto}
  .touch .fc-maincol .focus-meta .fm{min-width:0;flex:0 0 auto}
  .touch .fc-maincol .focus-meta .fm b{font-size:14px}
  .touch .fc-maincol .focus-meta .fm span{font-size:9.5px}
  .touch .fc-act .bigbtn{margin-top:6px}
  /* stram topp: mer plass til selve arbeidskortet */
  .touch .qrail{padding:2px 2px;margin:4px 0 2px}
  .touch .qcard{min-width:96px;padding:6px 10px}
  .touch .qcard .qpos{font-size:19px}
  .touch .qcard .qst{font-size:11px}
  body.fs.touch .content{padding-top:52px}
  .touch .focus-card{padding:16px 20px}
  .touch .fc-maincol .focus-main{font-size:clamp(38px,4.6vw,64px)}
  /* koblingskodene på én linje i liggende (de står også i tegningen) */
  .touch .fc-maincol .press-cpl{font-size:26px}
  .touch .fc-maincol .press-cpl .cplsep{display:inline}
  .touch .fc-maincol .press-cpl .cplsep::before{content:"  /  "}
  .touch .fc-maincol .press-note{display:none}
  .touch .fc-maincol .crimp-note{display:none}
}
.cplsep{display:block}
.touch .focus-card{padding:20px 22px}
.touch h1{font-size:20px}
body.fs.touch .fsver{display:none}
body.fs.touch .content{padding-top:62px}
@media(max-width:900px){.fsbar .fsver{display:none}.fsbar select{max-width:150px}}
.touch .focus-nav{margin-top:10px}
.touch .bigbtn{padding:20px;min-height:76px;font-size:21px}

/* kø-rekke i fokusvisningen: små kort som viser tatt / nå / venter */
.qrail{display:flex;gap:8px;overflow-x:auto;padding:6px 2px;margin:8px 0 4px;-webkit-overflow-scrolling:touch;scrollbar-width:thin}
.qcard{flex:0 0 auto;min-width:88px;border:2px solid var(--border2);border-radius:12px;padding:6px 10px;background:var(--surface);cursor:pointer;text-align:center;font-family:var(--font)}
.qcard .qpos{font-family:var(--head);font-weight:800;font-size:18px;line-height:1.15;color:var(--text)}
.qcard .qpts{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.3px}
.qcard .qst{font-size:11px;margin-top:3px;font-weight:700;color:var(--muted);white-space:nowrap}
.qcard.done{border-color:var(--good);background:var(--good-bg)}
.qcard.done .qst{color:var(--good)}
.qcard.cur{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.28)}
.qcard.cur .qst{color:var(--accent2)}
.touch .qcard{min-width:108px;padding:9px 12px}
.touch .qcard .qpos{font-size:23px}
.touch .qcard .qst{font-size:12.5px}
.lastconfirm{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:12px;font-size:14px;font-weight:700;color:var(--good)}
.touch .lastconfirm{font-size:16.5px}

/* logget trykktest (ESI-sensor): live kurve + måler */
.gauge{font-family:var(--head);font-size:clamp(46px,7vw,80px);font-weight:800;line-height:1;color:var(--info)}
.gauge small{font-size:.35em;color:var(--muted);font-weight:700}
.phasepill{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:6px 16px;font-size:14px;font-weight:700;border:1.5px solid var(--border2);background:var(--surface2)}
.phasepill.hold{border-color:var(--info);color:var(--info)}
.phasepill.pass{border-color:var(--good);color:var(--good);background:var(--good-bg)}
.phasepill.fail{border-color:var(--bad);color:var(--bad);background:var(--bad-bg)}
.curvebox{background:var(--surface2);border:1px solid var(--border2);border-radius:12px;padding:10px;margin-top:12px}
.curvebox svg{width:100%;height:auto;display:block}
.sensorchip{display:inline-flex;align-items:center;gap:8px;border-radius:99px;padding:5px 14px;font-size:12.5px;font-weight:700;border:1.5px solid var(--border2);background:var(--surface2)}
.sensorchip.on{border-color:var(--good);color:var(--good);background:var(--good-bg)}

/* stk-teller for kapping (antall > 1): ett trykk per kappet slange */
.cutcount{display:flex;gap:14px;align-items:stretch;margin-top:18px}
.ccnum{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:130px;background:var(--surface2);border:2px solid var(--border2);border-radius:16px;padding:8px 16px;font-family:var(--head)}
.ccnum b{font-size:clamp(34px,5vw,52px);line-height:1;color:var(--accent2)}
.ccnum span{font-size:16px;color:var(--muted);font-weight:700}
.ccnum .cclabel{font-size:10.5px;letter-spacing:1px;color:var(--muted);margin-top:4px}
.ccminus{border:2px solid var(--border2);background:none;color:var(--text);border-radius:16px;padding:0 22px;font-size:20px;font-weight:800;cursor:pointer}
.ccminus:disabled{opacity:.35;cursor:not-allowed}
.pieces{display:flex;gap:7px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.piece{width:20px;height:20px;border-radius:50%;border:2px solid var(--border2);background:var(--surface2)}
.piece.done{background:var(--good);border-color:var(--good)}
.touch .piece{width:26px;height:26px}
.ccmini{font-family:var(--head);font-weight:800;font-size:16px;padding:2px 10px;border:1.5px solid var(--border2);border-radius:9px;background:var(--surface2);white-space:nowrap}
.ccmini b{color:var(--accent2)}

/* måle-innlegging (manglende B-/S-mål) */
.mm-input{width:96px;background:var(--surface2);border:1px solid var(--warn);border-radius:9px;color:var(--text);padding:9px 12px;font-size:16px;font-family:var(--mono);text-align:center}
.touch .mm-input{font-size:20px;padding:13px 12px;width:120px}

/* ---------- fullskjerm (verksted/iPad): meny og topplinje kollapses ---------- */
body.fs .topbar,body.fs .sidebar{display:none}
body.fs .content{padding:58px 18px 18px}      /* plass til den flytende linjen */
body.fs.touch .content{padding-top:72px}
.fsbar{position:fixed;top:10px;right:12px;z-index:400;display:none;gap:8px;align-items:center}
body.fs .fsbar{display:flex}
.fsbar select,.fsbar button{background:var(--surface);border:1px solid var(--border2);border-radius:99px;color:var(--text);padding:8px 14px;font-size:13px;font-family:var(--font);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.fsbar button:hover{border-color:var(--accent)}
.touch .fsbar select,.touch .fsbar button{padding:12px 18px;font-size:15px}

/* validation list */
.vitem{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:9px;margin-bottom:7px;font-size:13px}
.v-bad{background:var(--bad-bg);border:1px solid var(--bad)}
.v-warn{background:var(--warn-bg);border:1px solid var(--warn)}
.v-good{background:var(--good-bg);border:1px solid var(--good)}
.vitem .fix{margin-left:auto;flex-shrink:0}
.vitem button.fixbtn{background:none;border:1px solid var(--border2);border-radius:7px;color:var(--text);padding:3px 10px;font-size:12px;cursor:pointer}
.vitem button.fixbtn:hover{background:var(--surface2)}

/* ---------- fane/tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tab{background:none;border:none;color:var(--muted);padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}

/* status-stepper i mappe */
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0 18px}
.flow .f{font-size:11.5px;padding:4px 12px;border-radius:20px;border:1px solid var(--border2);color:var(--muted)}
.flow .f.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.flow .f.past{border-color:var(--good);color:var(--good)}
.flow .arr{color:var(--muted);font-size:11px}

/* ---------- dokumenter ---------- */
.docgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.doccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.doccard h3{font-size:14px;margin-bottom:6px}
.doc-stale{border-color:var(--warn)}
.docpreview{background:#fff;color:#111;border-radius:8px;padding:18px;font-size:11.5px;margin-top:14px;max-height:480px;overflow:auto;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.docpreview h4{font-size:15px;margin-bottom:2px}
.docpreview table{font-size:10.5px}
.docpreview th{background:#ED7D31;color:#fff;position:static;padding:4px 6px}
.docpreview td{border:1px solid #ccc;padding:3px 6px;color:#111}
.tagsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tag{border:2px solid #111;border-radius:8px;padding:8px 10px;background:#fffbe6;color:#111;font-size:10.5px;position:relative}
.tag .pts{font-family:var(--mono);font-weight:700;font-size:15px}
.tag .qr{position:absolute;right:8px;top:8px;width:34px;height:34px;background:
  repeating-linear-gradient(0deg,#111 0 3px,transparent 3px 6px),
  repeating-linear-gradient(90deg,#111 0 3px,transparent 3px 6px);opacity:.85;border:2px solid #111}

/* ---------- verksted ---------- */
.wsrow td{font-size:14.5px;padding:11px 12px}
.wsbtn{border:2px solid var(--border2);background:var(--surface2);color:var(--muted);border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.wsbtn.on-prod{background:var(--accent);border-color:var(--accent);color:#fff}
.wsbtn.on-test{background:var(--good);border-color:var(--good);color:#06281c}
[data-theme="light"] .wsbtn.on-test{color:#fff}
.wsbig{font-size:16px;padding:14px 22px}

/* logg */
.log{list-style:none}
.log li{display:flex;gap:12px;padding:8px 4px;border-bottom:1px solid var(--border);font-size:12.5px}
.log .lt{font-family:var(--mono);color:var(--muted);white-space:nowrap}

/* sp-tre */
.sptree{font-family:var(--mono);font-size:12.5px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:14px 16px;line-height:1.9}
.sptree .dim{color:var(--muted)}
.sptree .new{color:var(--good)}

.notice{display:flex;gap:10px;background:var(--info-bg);border:1px solid var(--info);border-radius:9px;padding:10px 14px;font-size:12.5px;margin-bottom:14px}
.hidden{display:none!important}
@media(max-width:840px){.sidebar{width:64px}.nav-item span.txt,.nav-sep{display:none}.content{padding:14px}}

/* ---------- Touch-/iPad-modus (fokus: én slange om gangen) ---------- */
.touch .pmcard{padding:22px;border-radius:16px}
.touch .btn{padding:14px 24px;font-size:16px;border-radius:13px}
.touch .wsbtn{padding:16px 22px;font-size:16px;border-radius:13px}
.touch .tile{padding:18px 22px}
.focus-wrap{max-width:900px;margin:0 auto}
.focus-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px 30px;
  animation:cardin .22s ease-out;box-shadow:0 10px 34px rgba(0,0,0,.35)}
@keyframes cardin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.focus-main{font-family:var(--head);font-weight:800;font-size:clamp(44px,9vw,84px);line-height:1.05;letter-spacing:1px}
.focus-sub{color:var(--muted);font-size:15px;margin-top:2px}
.focus-meta{display:flex;gap:26px;flex-wrap:wrap;margin:16px 0 6px}
.focus-meta .fm{min-width:110px}
.focus-meta .fm b{display:block;font-size:19px;font-family:var(--mono)}
.focus-meta .fm span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.bigbtn{width:100%;border:none;border-radius:16px;padding:24px;font-size:23px;font-weight:800;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px;min-height:84px;font-family:var(--font)}
.bigbtn:active{transform:scale(.985)}
.bigbtn.confirm{background:var(--good);color:#06281c}
[data-theme="light"] .bigbtn.confirm{color:#fff}
.bigbtn.next{background:var(--accent);color:#fff}
.bigbtn.ghostb{background:var(--surface2);color:var(--text);border:2px solid var(--border2)}
.bigbtn.undo{background:var(--warn-bg);color:var(--warn);border:2px solid var(--warn);min-height:60px;font-size:16px;padding:12px}
.focus-nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:14px 0}
.navarrow{width:72px;height:72px;border-radius:50%;border:2px solid var(--border2);background:var(--surface);
  color:var(--text);font-size:26px;cursor:pointer;flex-shrink:0}
.navarrow:disabled{opacity:.25}
.dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;flex:1}
.dot{width:15px;height:15px;border-radius:50%;background:var(--surface2);border:2px solid var(--border2);cursor:pointer;padding:0}
.dot.done{background:var(--good);border-color:var(--good)}
.dot.cur{outline:3px solid var(--accent);outline-offset:2px}
.donecard{text-align:center;padding:50px 30px}
.donecard .big{font-size:60px;margin-bottom:8px}

/* ---------- produktfoto (Parker-katalog) ---------- */
.photo{background:#fff;border-radius:10px;padding:6px 6px 3px;width:132px;text-align:center;border:1px solid var(--border2)}
.photo img{width:100%;height:92px;object-fit:contain;display:block}
.photo span{font-size:9.5px;color:#444;display:block;padding:2px 0;font-family:var(--mono)}
.photo.big{width:170px}
.photo.big img{height:120px}
.photo-mini{background:#fff;border-radius:6px;padding:2px;width:52px;height:40px;display:inline-block;vertical-align:middle}
.photo-mini img{width:100%;height:100%;object-fit:contain;display:block}

/* ---------- fotomontasje: C1 – slange – C2 ---------- */
.assembly{display:flex;align-items:stretch;background:#fff;border-radius:14px;padding:10px 12px;gap:6px;max-width:640px}
.assembly .asm-slot{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px}
.assembly .asm-slot.mid{flex:1.2;border-left:1px dashed #ccc;border-right:1px dashed #ccc}
.assembly .imgclip img{height:100%}
.assembly .asm-slot.mid .imgclip img{transform:scale(1.85)}
.assembly .asm-lab{font-family:var(--mono);font-size:11.5px;font-weight:700;color:#111;text-align:center;margin-top:4px}
.assembly .asm-geo{font-size:9.5px;color:#555;text-align:center}
.asm-fallback{display:none;height:110px;align-items:center;justify-content:center;background:#f3f4f6;border-radius:8px;width:100%;color:#555;font-family:var(--mono);font-size:11px;text-align:center;padding:6px}
.assembly.small .asm-fallback{height:72px}
.hpanel{background:#fff;border-radius:14px;padding:10px 14px;max-width:640px}
.hpanel .asm-lab{font-family:var(--mono);font-size:11.5px;font-weight:700;color:#111;text-align:center;margin-top:2px}
.hpanel .asm-geo{font-size:9.5px;color:#555;text-align:center}
/* Parker-fotoene er kvadratiske med mye luft rundt slangen – imgclip zoomer
   inn så motivet fyller rammen (motivet ligger sentrert i originalene). */
.imgclip{overflow:hidden;border-radius:8px;display:flex;align-items:center;justify-content:center;width:100%}
.imgclip img{height:100%;object-fit:contain;display:block}
.imgclip.zoomh img{transform:scale(2.05)}
.hpanel .imgclip{height:150px}
.hthumb{background:#fff;border-radius:10px;padding:4px;width:100%;max-width:230px;overflow:hidden}
.hthumb .imgclip{height:84px}
.assembly .asm-slot .imgclip{height:110px}
.assembly.small .asm-slot .imgclip{height:72px}
.photo-mini{overflow:hidden}

/* ---------- POS-referanse ---------- */
.posref{text-align:right}
.posref .p-label{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.posref .p-num{font-family:var(--mono);font-weight:800;font-size:40px;line-height:1.05;color:var(--accent2)}
.posref .p-num.missing{color:var(--warn);font-size:22px}
.posref .p-mach{font-size:14px;font-weight:700;margin-top:2px}
.posref .p-ctx{font-size:11.5px;color:var(--muted);margin-top:2px}
.touch .posref .p-num{font-size:52px}
td.pos-cell{font-family:var(--mono);font-weight:800;font-size:16px;color:var(--accent2)}

/* ---------- spot-check ---------- */
.st-qc{color:#c4b5fd;border-color:#8b5cf6;background:rgba(139,92,246,.12)}
[data-theme="light"] .st-qc{color:#6d28d9;border-color:#7c3aed;background:rgba(124,58,237,.08)}
.qc-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.qc-card.ok{border-color:var(--good)}
.qc-card.avvik{border-color:var(--bad)}
.qc-btn{border:2px solid var(--border2);background:var(--surface2);color:var(--text);border-radius:12px;
  padding:14px 26px;font-size:16px;font-weight:800;cursor:pointer}
.qc-btn.ok-on{background:var(--good);border-color:var(--good);color:#06281c}
[data-theme="light"] .qc-btn.ok-on{color:#fff}
.qc-btn.avvik-on{background:var(--bad);border-color:var(--bad);color:#fff}

/* ---------- pallemerkelapp ---------- */
.pallet{background:#fff;color:#111;border:4px solid #111;border-radius:12px;padding:22px 26px;max-width:660px;position:relative}
.pallet h3{font-size:15px;letter-spacing:2px;margin-bottom:2px}
.pallet .pl-id{font-family:var(--mono);font-size:44px;font-weight:800;line-height:1.1}
.pallet .pl-row{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px}
.pallet .pl-f{min-width:150px}
.pallet .pl-f b{display:block;font-size:17px}
.pallet .pl-f span{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:#555}
.pallet .qr{position:absolute;right:22px;top:20px;width:86px;height:86px;border:3px solid #111;background:
  repeating-linear-gradient(0deg,#111 0 4px,transparent 4px 8px),
  repeating-linear-gradient(90deg,#111 0 4px,transparent 4px 8px)}
.pallet table{font-size:12px;margin-top:10px}
.pallet td,.pallet th{border:1px solid #999;padding:3px 8px;color:#111}
.pallet th{background:#eee;position:static}

/* ---------- utskrift ---------- */
.print-toolbar{display:flex;gap:10px;align-items:center;margin-bottom:16px}
@media print{
  .topbar,.sidebar,.noprint{display:none!important}
  .content{padding:0!important;overflow:visible!important}
  .main,.shell{display:block;height:auto}
  body{background:#fff}
  .docpreview{box-shadow:none;max-height:none;overflow:visible;border-radius:0;padding:0}
  .pallet{border-width:5px}
}
</style>
</head>
<body>
<div class="shell">

<header class="topbar">
  <div class="logo">HoseMaker <span>· Global Onsite</span></div>
  <span class="verbadge mono" id="verbadge"></span>
  <div class="badge-proto">PROTOTYPE · demo-modus – data lagres ikke</div>
  <div class="spacer"></div>
  <div class="userbox">
    <span>Innlogget som:</span>
    <select id="whoami" onchange="App.setUser(this.value)">
      <option>Simen (PMO)</option>
      <option>Kim (PMO)</option>
      <option>Verksted – Christian</option>
      <option>Verksted – Sigfus</option>
    </select>
  </div>
  <button class="iconbtn" onclick="App.toggleTheme()" title="Bytt lys/mørk">🌙</button>
</header>

<!-- flytende linje i fullskjerm (verksted/iPad) – topplinjen og menyen er skjult -->
<div class="fsbar noprint">
  <span class="fsver mono" id="fsver"></span>
  <select id="fsuser" onchange="App.setUser(this.value)" title="Innlogget som">
    <option>Simen (PMO)</option>
    <option>Kim (PMO)</option>
    <option>Verksted – Christian</option>
    <option>Verksted – Sigfus</option>
  </select>
  <button onclick="App.toggleFs()" title="Avslutt fullskjerm – hent tilbake menyen">✕ Avslutt fullskjerm</button>
</div>

<div class="main">
  <nav class="sidebar">
    <button class="nav-item active" data-view="dash" onclick="App.nav('dash')">📊 <span class="txt">Oversikt</span></button>
    <button class="nav-item" data-view="wizard" onclick="App.startWizard()">➕ <span class="txt">Ny produksjonsmappe</span></button>
    <button class="nav-item" data-view="list" onclick="App.nav('list')">📁 <span class="txt">Produksjonsmapper</span></button>
    <button class="nav-item" data-view="plan" onclick="App.nav('plan')">📅 <span class="txt">Produksjonsplan</span></button>
    <div class="nav-sep">Verksted</div>
    <button class="nav-item" data-view="verksted" onclick="App.nav('verksted')">🏭 <span class="txt">Verkstedsmodus</span></button>
    <div class="nav-sep">Referanse</div>
    <button class="nav-item" data-view="master" onclick="App.nav('master')">🗄️ <span class="txt">Masterdata</span></button>
    <button class="nav-item" data-view="om" onclick="App.nav('om')">❓ <span class="txt">Om prototypen</span></button>
  </nav>

  <main class="content" id="content"><!-- render --></main>
</div>
</div>
<script>
/* =====================================================================
   HoseMaker – slangeproduksjon, klikkbar prototype (PMOTION-modul)
   All data er demodata og lever kun i minnet til denne fanen.
   I pilot erstattes State av SharePoint-lister via Microsoft Graph.
   ===================================================================== */

/* ---------- Versjon (vises i topplinjen, fullskjermlinjen og på Om-siden) ---------- */
const APP_VERSION="0.23";
const APP_BUILD="13.08.2026";
const CHANGELOG=[
  ["0.23","13.08.2026","Liggende iPad-visning bruker nå hele skjermbredden: POS-banner øverst over full bredde, stor tegning av slange + koblinger til venstre, mål/pressmål og teller til høyre, og bekreft-knapp i full bredde nederst"],
  ["0.22","13.08.2026","Liggende iPad-visning i verkstedet: to kolonner med POS og produktfoto til venstre, mål/teller/bekreft-knapp til høyre – alt synlig samtidig. Stående format beholder én kolonne"],
  ["0.21","13.08.2026","iPad-optimalisert layout i fullskjerm/touch: POS, mål og bekreft-knapp øverst uten scrolling (foto ligger under), kompaktere topplinje, og bedre plassutnyttelse i både liggende og stående format"],
  ["0.20","13.08.2026","Tag-regel etter lengde: slanger med OAL ≥ 2000 mm får 2 tagger (én til hver ende), kortere slanger får 1 – i utskriften ved kapping, i tags-dokumentet og i Telaris-BOM-en (vare 23951)"],
  ["0.19","13.08.2026","TAG-steget fjernet: taggingen skjer samtidig med kappingen – taggen skrives ut per stk i det hvert kutt kvitteres, og kutt-knappen dekker begge («Bekreft kappet + tag på»). Spot-checken beholder tag-kontrollpunktet. Flyten er nå 6 operasjoner"],
  ["0.18","13.08.2026","Preservering er nå én samlet kvittering (som Tag på og Rens): alle trykktestede slanger får krympehetter/plugger og kvitteres med ett trykk"],
  ["0.17","13.08.2026","Pressmål med toleranser i presse-steget: pressdiameter, toleransebånd og bakkesett (fra Parker CrimpSource, «Adjustable crimper») vises stort i fokusvisningen og per slangetype i presselisten – med varsel og CrimpSource-lenke der spesifikasjon mangler"],
  ["0.16","13.08.2026","Automatisk tidtaking: arbeidsøkten starter i det montøren åpner en produksjonsmappe i verkstedsmodus, og stopper automatisk ved mappebytte, brukerbytte, navigering ut eller når mappen fullføres – ingen knapper å huske"],
  ["0.15","13.08.2026","Feilretting: pakking av siste slange stoppet opp (krasj på siste operasjon). Tag på er nå ÉN samlet kvittering (utskriften skjer fortsatt automatisk per kapping), og hver gang en slangetype er ferdig i en prosess får du valget: fortsett med typen til neste prosess, eller ta neste type i samme prosess"],
  ["0.14","13.08.2026","Salgssjefens 7-stegs flyt: Kapp → Sett på tag → Rens → Pressing → Trykktest → Preservering → Pakking. Taggen skrives ut automatisk på benkeskriveren i det kappingen bekreftes (én per PTS-ID) – idiotsikker identitet fra første steg"],
  ["0.13","13.08.2026","Tidsmåling mot kalkylen: arbeidsøkter (start/stopp) i verkstedet, faktisk brukt tid per ordre mot estimert og opptjent tid etter fremdrift, med status frempå / on track / bakpå i mappen, verkstedsmodus og produksjonsplanen"],
  ["0.12","13.08.2026","Visuell kø-rekke i verkstedets fokusvisning: små kort viser hvilke slanger som er tatt (✓ med klokkeslett), hvilken som er «NÅ» og hva som venter – pluss «Sist bekreftet»-kvittering, så man aldri er i tvil om forrige trykk gikk inn"],
  ["0.11","13.08.2026","All produsert dokumentasjon på engelsk (UI fortsatt norsk), og DNV-kobling: AoM AMT00000F4 + typegodkjenning (TAP) per slangetype påføres trykktestsertifikatet automatisk, med varsling ved utløpt/manglende sertifikat"],
  ["0.10","13.08.2026","Unike PTS-ID-er per fysisk slange: linjer med antall N får N ID-er fra registeret, tags og sertifikat får én lapp/rad per slange, stk-telleren logger hvert kutt mot sin PTS-ID, og alle porter teller manglende ID-er i stk"],
  ["0.9","13.08.2026","Integrert trykktestlogging med ESI-sensor (GD4200-USB): live trykkurve, holdetid-nedtelling, automatisk godkjent/avvik på trykkfall, testlogg knyttet til PTS-ID-er og rett inn i sertifikatet – tredjepartsprogrammet trengs ikke"],
  ["0.8","13.08.2026","Stk-teller på kapping ved antall > 1: ett trykk per kutt med stor teller, −1 for feiltelling, hvert kutt loggføres, og linjen fullføres først når riktig antall er nådd"],
  ["0.7","13.08.2026","Trykktest i puljer per testtrykk (med manuell justering av utvalget), rens som én samlet kvittering, synlig versjonsnummer, navnet HoseMaker"],
  ["0.6","13.08.2026","Fullskjermmodus for iPad/verksted, mål-port for manglende B-/S-mål, tydelig varsling ved antall > 1"],
  ["0.5","13.08.2026","Redigerbart rutenett i nettleseren, PTS-register («Hent PTS-ID-er»), Telaris-integrasjon med varenummer og BOM, riktig prosessrekkefølge (Telaris før tilbud)"],
  ["0.4","12.08.2026","Livsløp fra forespørselsfasen, valgfri PMOTION-kobling, POS som hovedreferanse, originale Parker-produktfoto"],
  ["0.3","11.08.2026","Touch-/iPad-visning, trykktestsertifikat, pallemerkelapp, spot-check (annenhåndskontroll), produksjonsplan med tidsestimat"],
  ["0.2","10.08.2026","Kuttemålberegning (CUT = Lengde − B1 − B2 − S) og fire verkstedsoperasjoner i riktig rekkefølge"],
  ["0.1","08.08.2026","Første klikkbare prototype: veiviser, produksjonsmapper, verkstedsmodus, SharePoint-struktur"]
];

/* ---------- Demo-masterdata (fra Database_Hose_&_fittings.xlsx) ---------- */
/* B-mål (koblinger) og S-mål (slanger) er reelle verdier fra
   Database_Hose_&_fittings.xlsx – kuttemålene under blir derfor identiske
   med CUT-kolonnen i dagens Excel-ark. */
const MASTER = {
  hoses: {
    "487ST-8":{wp:280,inch:'1/2"',s:5}, "487ST-12":{wp:280,inch:'3/4"',s:6}, "487ST-16":{wp:280,inch:'1"',s:8},
    "787ST-6":{wp:350,inch:'3/8"',s:5}, "787ST-8":{wp:350,inch:'1/2"',s:5}, "187ST-8":{wp:70,inch:'1/2"',s:4},
    "462ST-8":{wp:310,inch:'1/2"',s:6}, "2390N-4":{wp:490,inch:'1/4"',s:4}
  },
  couplings: {   /* ang/sys/dim er reelle verdier fra MasterTable ((0,45,90), Type2, INFO) */
    "1C948-20-12":{wp:350,b:30,ang:0,sys:"Metric",dim:"20S"},
    "1C943-25-16":{wp:280,b:33,ang:0,sys:"Metric",dim:"25S"},
    "1C948-16-8":{wp:350,b:28,ang:0,sys:"Metric",dim:"16S"},
    "11C48-16-8":{wp:280,b:37,ang:90,sys:"Metric",dim:"16S",imgHoseEnd:"right"},
    "1C948-12-6":{wp:420,b:24,ang:0,sys:"Metric",dim:"12S"},
    "10C48-12-6":{wp:310,b:46,ang:45,sys:"Metric",dim:"12S",imgHoseEnd:"right"},
    "1CA48-15-8":{wp:280,b:26,ang:0,sys:"Metric",dim:"15L"},
    "1CA48-18-8":{wp:280,b:25,ang:0,sys:"Metric",dim:"18L"},
    "1CA48-22-12":{wp:280,b:30,ang:0,sys:"Metric",dim:"22L"},
    "1CA48-26-12":{wp:280,b:36,ang:0,sys:"Metric",dim:"26L"},
    "1CF48-16-8":{wp:280,b:null,ang:45,sys:"Metric",dim:"16S"},  /* demo: B-mål mangler i master – må måles og legges inn */
    "1B243-8-8":{wp:430,b:39,ang:90,sys:"BSP",dim:'1/2"',imgHoseEnd:"right"},
    "19248-8-8":{wp:350,b:22,ang:0,sys:"BSP",dim:'1/2"'},
    "1J948-8-8":{wp:415,b:32,ang:90,sys:"ORFS",dim:'1/2"',imgHoseEnd:"right"},
    "1JC48-10-10":{wp:380,b:24,ang:0,sys:"ORFS",dim:'5/8"'}
  }
};

/* ---------- Pressmål (crimp) – fra Parker CrimpSource, «Adjustable crimper» ----------
   Pressdiameter med toleranse per slangetype/koblingsserie. Verdiene under er
   demo-verdier i realistisk størrelsesorden – i drift synkroniseres tabellen
   fra CrimpSource (divapps.parker.com/divapps/hpd/crimpsourcev2), som slås opp
   per maskin + slange + kobling + dimensjon. Etter pressing kontrolleres
   diameteren med mikrometer mot toleransebåndet. */
const CRIMPSOURCE_URL="https://divapps.parker.com/divapps/hpd/crimpsourcev2/?cc=Eur";

function todayISO(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function hoseTypeDash(code){const m=String(code||"").match(/^(\d[0-9A-Z]*?)-(\d+)$/);return m?{type:m[1],dash:Number(m[2])}:null}
/* Finn gjeldende TAP for en slangekode («487ST-8» → type 487ST, dash 8) */
function dnvCertFor(hose){
  const td=hoseTypeDash(hose);if(!td)return null;
  const hits=DNV.taps.filter(t=>t.types.includes(td.type)&&td.dash>=t.dash[0]&&td.dash<=t.dash[1]);
  if(!hits.length)return null;
  hits.sort((a,b)=>b.validUntil.localeCompare(a.validUntil));
  return {no:hits[0].no,validUntil:hits[0].validUntil,expired:hits[0].validUntil<todayISO()};
}
function aomStatus(){
  const t=todayISO();
  const soon=new Date(DNV.aom.validUntil)-new Date(t)<90*24*3600*1000;
  return {expired:DNV.aom.validUntil<t,soon};
}
/* DNV-status for en hel mappe: per slangetype + samlet vurdering */
function dnvForFolder(f){
  const types=[...new Set(f.lines.map(l=>l.hose))];
  const rows=types.map(h=>({hose:h,cert:dnvCertFor(h)}));
  return {rows,
    missing:rows.filter(r=>!r.cert).length,
    expired:rows.filter(r=>r.cert&&r.cert.expired).length,
    aom:aomStatus()};
}

/* Enkel likhetssøk for «mente du …?» */
function editDist(a,b){
  a=a.toUpperCase();b=b.toUpperCase();
  const m=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=0;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]!==b[j-1]?1:0));
  return m[a.length][b.length];
}
function suggest(code,dict){
  // Kandidater med samme dimensjonssuffiks («-18-8») prioriteres – det er
  // nesten alltid serie-delen som er feiltastet, ikke dimensjonene.
  const dims=code.includes("-")?code.slice(code.indexOf("-")):null;
  let best=null,bd=99;
  for(const k of Object.keys(dict)){
    const d=editDist(code,k)-(dims&&k.toUpperCase().endsWith(dims.toUpperCase())?0.5:0);
    if(d<bd){bd=d;best=k}
  }
  return bd<=3?best:null;
}

   Slik jobbes det i virkeligheten: alle slangene kappes først, deretter
   renses de med UC-propper, så presses koblingene på, og til slutt
   trykktestes de. Hver linje har derfor fire uavhengige bekreftelser
   (i rekkefølge), og verkstedet veksler fritt mellom operasjonene. */
const STAGES=[
  {key:"cut",  icon:"✂️", label:"Kapping + tag", verb:"kappet"},
  {key:"clean",icon:"🧼", label:"Rens (UC)",    verb:"renset"},
  {key:"press",icon:"🔧", label:"Pressing",     verb:"presset"},

/* ---------- Spot-check (annenhåndskontroll) ----------
   Deterministisk utvalg (samme prinsipp som SpotCheck-spørringen i Excel):
   minst én slange per slangetype, ca. 10 % totalt. Kontrollen skal utføres
   av en annen person enn den som trykktestet slangen. */
function stableHash(s){let h=17;for(const c of String(s))h=(h*31+c.charCodeAt(0))%2147483647;return h}
function buildSpotCheck(f){
  const byType={};
  f.lines.forEach((l,i)=>{(byType[l.hose]=byType[l.hose]||[]).push({l,i})});
  const items=[];
  Object.values(byType).forEach(arr=>{
    const k=Math.max(1,Math.ceil(arr.length*0.1));
    arr.slice().sort((a,b)=>stableHash(a.l.pts)-stableHash(b.l.pts)).slice(0,k)
      .forEach(x=>items.push({i:x.i,result:null,comment:"",by:null,at:null}));
  });
  items.sort((a,b)=>a.i-b.i);
  return {items,startedAt:now(),completedAt:null};
}
function spotDone(f){return f.spot&&f.spot.items.every(x=>x.result==="ok")}

/* ---------- Demodata ---------- */
function sibPts(pts,k){ /* deterministisk søsken-ID for demodata (samme prefiks, unik hale) */
  const CS="ABCDEFGHJKMNPQRSTVWXYZ23456789";
  const h=stableHash(pts+":"+k);
  return String(pts).slice(0,6)+CS[h%CS.length]+CS[Math.floor(h/CS.length)%CS.length];
}
function L(pts,pos,hose,len,c1,c2,qty,stageN){
  const wp = wpFor(hose,c1,c2);
  const cut = cutFor(len,hose,c1,c2);
  const who=["Christian","Christian","Sigfus","Sigfus","Sigfus","Christian"],
        at=["05.08 11:02","06.08 08:40","06.08 13:15","07.08 09:41","07.08 10:12","07.08 10:30"];
  const st={cut:null,clean:null,press:null,test:null};
  STAGES.forEach((s,i)=>{if(i<(stageN||0))st[s.key]={by:who[i],at:at[i]}});
  const n=qty||1;
  const ptsList=pts?[pts,...Array.from({length:n-1},(_,k)=>sibPts(pts,k+1))]:[];
  return {pts,pos,hose,len,c1,c2,qty:n,wp,cut:cut.cut,cutErr:cut.err,st,cutN:(stageN||0)>=1?n:0,ptsList};
}
function wpFor(hose,c1,c2){
  const w=[MASTER.hoses[hose]?.wp,MASTER.couplings[c1]?.wp,MASTER.couplings[c2]?.wp].filter(x=>x>0);
  return w.length?Math.min(...w):null;
}
/* Kuttemål – samme formel som CUT-kolonnen i Excel-arket:
   CUT = Length − (B1 + B2 + S)
   B1/B2 = koblingenes B-mål (MasterTable[B]), S = slangens S-mål (HoseInfo[S-Mål]).
   Viktig forskjell fra Excel: mangler et B-/S-mål stopper vi og sier ifra,
   i stedet for å stille regne ut et for langt kutt. */
function cutFor(len,hose,c1,c2){
  const n=Number(len);
  if(!len||isNaN(n)||n<=0)return {cut:null,err:null};
  const miss=[];
  const b1=MASTER.couplings[c1]?.b, b2=MASTER.couplings[c2]?.b, s=MASTER.hoses[hose]?.s;
  if(b1==null&&MASTER.couplings[c1])miss.push(`B-mål mangler i master for ${c1}`);
  if(b2==null&&MASTER.couplings[c2])miss.push(`B-mål mangler i master for ${c2}`);
  if(s==null&&MASTER.hoses[hose])miss.push(`S-mål mangler i master for ${hose}`);
  if(b1==null||b2==null||s==null)return {cut:null,err:miss.length?miss.join("; "):null};
  const cut=n-(b1+b2+s);
  if(cut<=0)return {cut:null,err:`Lengden (${n} mm) er kortere enn koblingene + S-mål (${b1+b2+s} mm)`};
  return {cut,err:null};
}
function fmtCut(l){return l.cut?l.cut.toLocaleString("nb-NO")+" mm":"–"}

/* ---------- Manglende B-/S-mål: fanges og legges inn der jobben gjøres ----------
   Mangler et mål i masterdata, holdes kuttemålet tilbake til noen har MÅLT
   komponenten og lagt inn verdien – da beregnes kuttemålet automatisk for
   alle slanger som bruker samme komponent, og masterdata blir riktigere. */
function missingMeasures(l){
  const out=[];
  const c1=MASTER.couplings[l.c1],c2=MASTER.couplings[l.c2],h=MASTER.hoses[l.hose];
  if(c1&&c1.b==null)out.push({kind:"cpl",code:l.c1,label:"B-mål"});
  if(c2&&c2.b==null&&l.c2!==l.c1)out.push({kind:"cpl",code:l.c2,label:"B-mål"});
  if(h&&h.s==null)out.push({kind:"hose",code:l.hose,label:"S-mål"});
  return out;
}
function setMeasure(kind,code,val,fid){
  const v=Number(String(val??"").trim().replace(",","."));
  if(!String(val??"").trim()||isNaN(v)||v<=0||v>=1000)return false;
  if(kind==="cpl"&&MASTER.couplings[code])MASTER.couplings[code].b=v;
  else if(kind==="hose"&&MASTER.hoses[code])MASTER.hoses[code].s=v;
  else return false;
  /* re-beregn kutt/WP overalt der komponenten brukes */
  State.folders.forEach(f=>f.lines.forEach(l=>{
    const c=cutFor(l.len,l.hose,l.c1,l.c2);l.cut=c.cut;l.cutErr=c.err;
  }));
  if(State.wizard&&State.wizard.rows)State.wizard.rows.forEach(r=>{
    const c=cutFor(r.len,r.hose,r.c1,r.c2);r.cut=c.cut;r.cutErr=c.err;
  });
  const f=fid?folder(fid):null;
  if(f)addLog(f,`${kind==="cpl"?"B-mål":"S-mål"} for ${code} målt og registrert: ${v} mm – kuttemål beregnet på nytt. (I drift oppdateres masterdatabasen med verdien.)`);
  return true;
}

/* ---------- Tidsestimat ----------
   Samme modell som TimeCalc-tabellen og TimeCalcEachHose-spørringen i Excel:
   timer per slange = Start tid + (Add. Ea m × lengde i meter)
                      + tillegg for under/over 10 m (per DIM = dash-størrelsen).
   Verdiene under er demoverdier – i drift leses de fra TimeCalc-tabellen i
   Database_Hose_&_fittings.xlsx (inkl. egne SAE-kolonner). */
const TIMECALC = {
  4:{start:0.35,eaM:0.010,u10:0.15,o10:0.30},
  6:{start:0.40,eaM:0.012,u10:0.20,o10:0.35},
  8:{start:0.45,eaM:0.014,u10:0.20,o10:0.40},
  12:{start:0.60,eaM:0.018,u10:0.30,o10:0.50},
  16:{start:0.75,eaM:0.022,u10:0.35,o10:0.60}
};
function estHoursLine(l){
  const dim=Number(String(l.hose||"").split("-").pop());
  const tc=TIMECALC[dim];
  const len=Number(l.len)||0;
  if(!tc||!len)return null;
  const base=tc.start+tc.eaM*len/1000;
  const add=len<10000?tc.u10:tc.o10;
  return Math.ceil((base+add)*100)/100;   // Number.RoundUp(…, 2) som i Excel
}
function estHoursFolder(f){
  let sum=0,unknown=0;
  f.lines.forEach(l=>{const h=estHoursLine(l);if(h==null)unknown++;else sum+=h});
  return {hours:Math.round(sum*10)/10,unknown};
}
/* Gjenstående timer: estimat × andel operasjoner som ikke er utført */
function remainingHours(f){
  const n=f.lines.length;if(!n)return 0;
  const doneFrac=STAGES.reduce((a,s)=>a+stageCount(f,s.key),0)/(STAGES.length*n);
  return Math.round(estHoursFolder(f).hours*(1-doneFrac)*10)/10;
}
function fmtH(h){return (h==null?"–":h.toLocaleString("nb-NO",{maximumFractionDigits:1})+" t")}

/* ---------- Tidsmåling mot kalkylen (earned value) ----------
   Montørene stempler arbeidsøkter (start/stopp) per mappe i verkstedsmodus.
   Faktisk brukt tid sammenlignes med OPPTJENT tid = estimat × utført andel
   av operasjonene. Da ser vi løpende om vi er frempå, on track eller bakpå
   – og over tid kalibreres TimeCalc-modellen med reelle tall. */
function activeSession(f,user){return (f.sessions||[]).find(s=>!s.endAt&&(!user||s.by===user))}
function actualMins(f){
  return (f.sessions||[]).reduce((a,s)=>a+(s.mins!=null?s.mins:Math.max(0,(Date.now()-s.startMs)/60000)),0);
}
function earnedHours(f){
  const n=f.lines.length;if(!n)return 0;
  const frac=STAGES.reduce((a,s)=>a+stageCount(f,s.key),0)/(STAGES.length*n);
  return Math.round(estHoursFolder(f).hours*frac*10)/10;
}
function timeStatus(f){
  if(!(f.sessions&&f.sessions.length))return null;
  const used=Math.round(actualMins(f)/60*10)/10, earned=earnedHours(f);
  const diff=Math.round((earned-used)*10)/10;   /* + = frempå, − = bakpå */
  const st=used<=earned*0.9?"ahead":used<=earned*1.1?"ontrack":"behind";
  return {used,earned,diff,st,
    label:st==="ahead"?"✅ Frempå":st==="ontrack"?"🟦 On track":"⚠️ Bakpå",
    cls:st==="ahead"?"good":st==="ontrack"?"info":"warn"};
}
function wsClockIn(id){
  const f=folder(id);
  const me=State.user;
  if(activeSession(f,me))return;
  f.sessions=f.sessions||[];
  f.sessions.push({by:me,startAt:now(),startMs:Date.now()});
  addLog(f,`Arbeidsøkt startet (${me.replace("Verksted – ","")})`);
  render();
}
function wsClockOut(id){
  const f=folder(id);
  const s=activeSession(f,State.user);
  if(!s)return;
  s.endAt=now();
  s.mins=Math.max(1,Math.round((Date.now()-s.startMs)/60000));
  addLog(f,`Arbeidsøkt avsluttet (${s.by.replace("Verksted – ","")}) – ${(s.mins/60).toLocaleString("nb-NO",{maximumFractionDigits:1})} t registrert. Totalt brukt: ${fmtH(actualMins(f)/60)} av estimert ${fmtH(estHoursFolder(f).hours)}`);
  render();
}
/* Automatisk tidtaking: økten starter når mappen ÅPNES i verkstedsmodus,
   og stopper når man forlater den – ingen knapper å huske på benken. */
function autoClockStart(fid){
  const f=fid?folder(fid):null;if(!f)return;
  if(!["prod","test","qc"].includes(f.status))return;   // kun aktive produksjonsmapper
  if(activeSession(f,State.user))return;
  f.sessions=f.sessions||[];
  f.sessions.push({by:State.user,startAt:now(),startMs:Date.now(),auto:true});
  addLog(f,`⏱ Arbeidsøkt startet automatisk – ${State.user.replace("Verksted – ","")} åpnet mappen i verkstedsmodus`);
}
function autoClockStop(fid,reason){
  const f=fid?folder(fid):null;if(!f)return;
  const s=activeSession(f,State.user);
  if(!s)return;
  s.endAt=now();
  s.mins=Math.max(1,Math.round((Date.now()-s.startMs)/60000));
  addLog(f,`⏱ Arbeidsøkt stoppet automatisk (${s.by.replace("Verksted – ","")}${reason?" – "+reason:""}) – ${(s.mins/60).toLocaleString("nb-NO",{maximumFractionDigits:1})} t. Totalt brukt: ${fmtH(actualMins(f)/60)} av estimert ${fmtH(estHoursFolder(f).hours)}`);
}
/* Åpne/forlat mappe i verkstedsmodus (fra mappevalget) */
function wsEnter(id){
  if(State.ws.folderId&&State.ws.folderId!==id)autoClockStop(State.ws.folderId,"byttet mappe");
  State.ws.folderId=id;State.ws.stage=null;State.ws.hoseType=null;State.ws.typeChoice=null;State.ws.testSel={};
  if(State.view==="verksted")autoClockStart(id);
  render();
}
function wsLeaveFolder(){
  autoClockStop(State.ws.folderId,"forlot mappen");
  State.ws.folderId=null;State.ws.stage=null;State.ws.typeChoice=null;
  render();
}

/* =====================================================================
   PTS-register (simulert) – reserverer neste ledige ID-er.
   I drift: ett kall mot PTS-databasen som reserverer n ID-er atomisk.
   ===================================================================== */
function reservePtsIds(n){
  const CS="ABCDEFGHJKMNPQRSTVWXYZ23456789"; // registerets tegnsett (uten I/L/O/U/0/1)
  const ids=[];
  for(let k=0;k<n;k++){
    let x=(State.ptsSeq++)*2654435761 % 2147483647; if(x<0)x+=2147483647;
    let s="";
    for(let j=0;j<8;j++){s+=CS[x%CS.length];x=Math.floor(x/CS.length)+((j*7919)%CS.length)}
    ids.push(s);
  }
  return ids;
}
/* Hver FYSISKE slange har sin egen PTS-ID – også når en linje har antall > 1.
   ptsAll(l) gir alle ID-ene på linjen; l.pts er alltid den første (linjereferansen). */
function ptsAll(l){return (l.ptsList&&l.ptsList.length)?l.ptsList:(l.pts?[l.pts]:[])}
/* Tag-regelen: OAL ≥ 2000 mm → 2 tagger per slange (én til hver ende), ellers 1 */
function tagCountFor(l){return (Number(l.len)||0)>=2000?2:1}
function ptsMissingCount(l){return Math.max(0,(Number(l.qty)||1)-ptsAll(l).length)}
/* Tildel PTS-ID-er til alt som mangler – per stk, og topper opp delvis
   tildelte linjer (f.eks. når antallet er økt). Returnerer antall reservert. */
function assignPts(list){
  const need=list.reduce((a,r)=>a+ptsMissingCount(r),0);
  if(!need)return 0;
  const ids=reservePtsIds(need);
  let k=0;
  list.forEach(r=>{
    const m=ptsMissingCount(r);
    if(!m)return;
    r.ptsList=ptsAll(r).concat(ids.slice(k,k+m));k+=m;
    r.pts=r.ptsList[0];
  });
  return need;
}
/* Antall MANGLENDE PTS-ID-er i mappen – telt i stk, ikke linjer */
function ptsMissing(f){return f.lines.reduce((a,l)=>a+ptsMissingCount(l),0)}

/* =====================================================================
   Telaris (simulert) – oppretter slangepakken som vare med BOM.
   I drift: Telaris-API. Varenummerserier: 2004xx = slangepakke,
   118xxx = enkeltslange. Faste BOM-varer: 20001 timer, 23951 gul tag.
   ===================================================================== */
function buildTelaris(f){
  const pkgNo="2004"+String(State.telarisSeq%100).padStart(2,"0");
  const items=f.lines.map(l=>{
    const itemNo=String(++State.telarisSeq);
    const cut=l.cut||cutFor(l.len,l.hose,l.c1,l.c2).cut;
    return {itemNo,pts:l.pts,ptsAll:ptsAll(l),pos:l.pos,
      desc:`Slange ${l.hose} L=${l.len} POS ${l.pos||"–"}`,qty:l.qty||1,
      bom:[
        {no:"H-"+l.hose,desc:"Slange "+l.hose,qty:Math.round((cut||Number(l.len)||0))/1000,unit:"m"},
        {no:l.c1,desc:"Kobling "+l.c1,qty:1,unit:"stk"},
        {no:l.c2,desc:"Kobling "+l.c2,qty:1,unit:"stk"},
        {no:"20001",desc:"Montasje/timer",qty:estHoursLine(l),unit:"t"},
        {no:"23951",desc:"Gul tag m/gravering",qty:tagCountFor(l),unit:"stk"}
      ]};
  });
  const totals={};
  items.forEach(it=>it.bom.forEach(b=>{
    const key=b.no;totals[key]=totals[key]||{no:b.no,desc:b.desc,qty:0,unit:b.unit};
    totals[key].qty=Math.round((totals[key].qty+b.qty*it.qty)*100)/100;
  }));
  return {pkg:pkgNo,createdAt:now(),by:State.user,items,totals:Object.values(totals)};
}

function fsEnter(){
  State.fs=true;

}
function fsOff(){
  if(!State.fs)return;
  State.fs=false;
  try{
    const ef=document.exitFullscreen||document.webkitExitFullscreen;
    if(ef&&(document.fullscreenElement||document.webkitFullscreenElement))ef.call(document);
  }catch(e){}
}

/* Celleendring: oppdater data + beregnede celler + feilliste – uten å
   tegne hele siden på nytt, så fokus/tab-rekkefølge i rutenettet bevares */
function wzCellG(i,field,el){
  const w=State.wizard,r=w.rows[i];
  r[field]=el.value.trim();
  r.wp=wpFor(r.hose,r.c1,r.c2);
  const c=cutFor(r.len,r.hose,r.c1,r.c2);r.cut=c.cut;r.cutErr=c.err;
  wzValidate();
  if(typeof document==="undefined")return;
  const wpc=document.getElementById("wpc-"+i),cutc=document.getElementById("cutc-"+i);
  if(wpc)wpc.textContent=r.wp?r.wp+" bar":"–";
  if(cutc)cutc.textContent=r.cut?r.cut.toLocaleString("nb-NO"):(missingMeasures(r).length?"📏 mål mangler":"–");
  if(field==="hose")el.classList.toggle("cellbad",!!(r.hose&&!MASTER.hoses[r.hose]));
  if(field==="c1"||field==="c2")el.classList.toggle("cellbad",!!(r[field]&&!MASTER.couplings[r[field]]));
  const badRows=new Set(w.issues.filter(x=>x.sev==="bad").map(x=>x.row));
  const warnRows=new Set(w.issues.filter(x=>x.sev==="warn").map(x=>x.row));
  w.rows.forEach((_,k)=>{
    const tr=document.getElementById("gr-"+k);
    if(tr)tr.className=badRows.has(k)?"rowbad":warnRows.has(k)?"rowwarn":"";
  });
  const gi=document.getElementById("gridissues");if(gi)gi.innerHTML=gridIssuesHTML();
  const gf=document.getElementById("gridfoot");if(gf)gf.innerHTML=gridFootHTML();
}

/* Tåler både kundens format (POS først) og gammelt format med PTS-ID først */
function wzAppendRows(raw){
  const w=State.wizard;
  const lines=String(raw||"").split(/\r?\n/).filter(l=>l.trim()!=="");
  if(!lines.length)return;
  let rows=lines.map(l=>l.split("\t").map(c=>c.trim()));
  let hasPts=false;
  if(/pos|pts|hose/i.test(rows[0].join(" "))){hasPts=/pts/i.test(rows[0][0]);rows=rows.slice(1)}
  else hasPts=/^(?=.*[A-Z])[A-Z0-9]{6,}$/i.test(rows[0][0]||"");
  rows.forEach(r=>{
    const o=hasPts?{pts:r[0]||"",pos:r[1]||"",hose:r[2]||"",len:r[3]||"",c1:r[4]||"",c2:r[5]||"",qty:r[6]||"1",mach:r[7]||""}
                  :{pts:"",pos:r[0]||"",hose:r[1]||"",len:r[2]||"",c1:r[3]||"",c2:r[4]||"",qty:r[5]||"1",mach:r[6]||""};
    w.rows.push({...o,wp:null,cut:null});
  });
  wzValidate();render();
}

/* ---------- Validering ---------- */
function wzValidate(){
  const w=State.wizard;
  w.issues=validateRows(w.rows);
}
function validateRows(rows){
  const issues=[];
  const seen={};
  const lbl=(r,i)=>`Rad ${i+1}${r.pos?` (POS ${r.pos})`:r.pts?` (${r.pts})`:""}`;
  rows.forEach((r,i)=>{
    if(r.pts){ // PTS-ID er valgfri ved innlegging – hentes fra registeret
      if(seen[r.pts]!==undefined)issues.push({sev:"bad",row:i,msg:`${lbl(r,i)}: PTS-ID «${r.pts}» er duplikat av rad ${seen[r.pts]+1}. Hver slange må ha unik ID.`});
      seen[r.pts]=i;
    }
    if(!r.pos)issues.push({sev:"warn",row:i,msg:`${lbl(r,i)}: mangler POS – tillatt, men bør fylles ut før tags skrives ut.`});
    if(!r.hose)issues.push({sev:"bad",row:i,msg:`${lbl(r,i)}: mangler slangetype.`});
    else if(!MASTER.hoses[r.hose]){
      const s=suggest(r.hose,MASTER.hoses);
      issues.push({sev:"bad",row:i,field:"hose",fix:s,msg:`${lbl(r,i)}: slangetypen «${r.hose}» finnes ikke i masterdata.${s?` Mente du «${s}»?`:""}`});
    }
    ["c1","c2"].forEach(f=>{
      const code=r[f];
      if(!code)issues.push({sev:"bad",row:i,msg:`${lbl(r,i)}: mangler ${f==="c1"?"Coupling 1":"Coupling 2"}.`});
      else if(!MASTER.couplings[code]){
        const s=suggest(code,MASTER.couplings);
        issues.push({sev:"bad",row:i,field:f,fix:s,msg:`${lbl(r,i)}: koblingen «${code}» finnes ikke i masterdata.${s?` Mente du «${s}»?`:""}`});
      }
    });
    const len=Number(r.len);
    if(!r.len||isNaN(len)||len<=0)issues.push({sev:"bad",row:i,msg:`${lbl(r,i)}: lengde mangler eller er ugyldig («${r.len||"tom"}»).`});
    const q=Number(r.qty);
    if(!r.qty||isNaN(q)||q<1)issues.push({sev:"warn",row:i,msg:`${lbl(r,i)}: antall mangler – settes til 1.`});
  });
  rows.forEach((r,i)=>{
    r.wp=wpFor(r.hose,r.c1,r.c2);
    const c=cutFor(r.len,r.hose,r.c1,r.c2);
    r.cut=c.cut;r.cutErr=c.err;
    if(c.err){
      const missing=/mangler i master/.test(c.err);
      /* manglende B-/S-mål i master er ikke radens feil: mappen kan lagres,
         men kuttemålet holdes tilbake til målet er målt og lagt inn
         (her, eller av montøren i verkstedsmodus før kapping) */
      issues.push({sev:missing?"warn":"bad",row:i,msg:`${lbl(r,i)}: kuttemål kan ikke beregnes – ${c.err}.${missing?" Legg inn målet under, eller la verkstedet måle komponenten – kappingen sperres uansett til målet er på plass.":""}`});
    }
  });
  return issues;
}
function wzFix(idx){
  const w=State.wizard,it=w.issues[idx];
  if(it&&it.fix&&it.field!==undefined){w.rows[it.row][it.field]=it.fix;wzValidate();render()}

      <div><b>WP ${x.r.wp||"–"} bar</b>${(()=>{const c=dnvCertFor(x.r.hose);return c?` · DNV ${esc(c.no.split(" ")[0])}`:""})()} · Global Onsite AS</div>
      ${x.t2===2?`<div style="font-weight:700;border-top:1px dashed #999;margin-top:3px;padding-top:2px">×2 – one tag per end (OAL ≥ 2000 mm)</div>`:""}</div>`).join("")}
    ${pieces.length>8?`<div style="align-self:center;color:#555">… + ${pieces.length-8} more</div>`:""}</div></div>`;
}

/* ---------- Steg 4: Lagre ---------- */
function wz5(){
  const w=State.wizard;
  const year=new Date().getFullYear();
  const id=w.editId||("PM-"+year+"-"+String(State.seq+1).padStart(3,"0"));
  w.newId=w.editId?null:("PM-"+year+"-"+String(State.seq+1).padStart(3,"0"));
  const totStk=w.rows.reduce((a,r)=>a+(Number(r.qty)||1),0);
  const havePts=totStk-w.rows.reduce((a,r)=>a+ptsMissingCount(r),0);
  return `<div class="card">
    <h2 style="margin-top:0">4 · Oppsummering og lagring</h2>
    <div class="cardrow">
      <div class="tile"><div class="t-label">Mappe-ID</div><div class="t-value" style="font-size:19px" class="mono">${id}</div></div>
      <div class="tile"><div class="t-label">Prosjekt</div><div class="t-value" style="font-size:15px">${esc(w.project||w.customer)}</div><div class="t-note">Ordre ${esc(w.order||"–")} · PO ${esc(w.po||"–")}</div></div>
      <div class="tile"><div class="t-label">Slanger</div><div class="t-value">${w.rows.length}</div><div class="t-note">alle validert ✓</div></div>
      <div class="tile"><div class="t-label">🔖 PTS-ID-er</div><div class="t-value">${havePts}/${totStk}</div><div class="t-note">${havePts===totStk?"alle fysiske slanger har egen ID":"én unik ID per fysisk slange – også ved antall > 1"}</div></div>
      <div class="tile"><div class="t-label">⏱ Estimert produksjonstid</div><div class="t-value">${fmtH(estHoursFolder({lines:w.rows}).hours)}</div><div class="t-note">≈ ${(estHoursFolder({lines:w.rows}).hours/(State.plan.fitters*State.plan.hoursPerDay)).toLocaleString("nb-NO",{maximumFractionDigits:1})} dagsverk med ${State.plan.fitters} montører – legges rett i produksjonsplanen</div></div>
      <div class="tile"><div class="t-label">Dokumenter</div><div class="t-value" style="font-size:15px">${["prod"in w.docs&&w.docs.prod?"Produksjonsliste":null,w.docs.test?"Trykktest":null,w.docs.tags?"Tags":null].filter(Boolean).join(" · ")}</div></div>
    </div>
    ${havePts<totStk?`
    <div class="vitem v-warn">🔖 <div><b>${totStk-havePts} av ${totStk} fysiske slanger mangler PTS-ID.</b> Hver slange får sin egen unike ID – også når en linje har antall &gt; 1. Hent dem nå med ett klikk – systemet reserverer neste ledige ID-er i PTS-registeret. (Kan også gjøres senere fra mappen, men må være på plass før produksjon.)</div>
      <span class="fix"><button class="fixbtn" onclick="wzFetchPts()">🔖 Hent PTS-ID-er til alle slangene</button></span></div>`
    :`<div class="vitem v-good">🔖 <div><b>Alle ${totStk} fysiske slanger har egen PTS-ID</b> – reservert i PTS-registeret og klare for tags og sporing.</div></div>`}
    <h2>Slik lagres det i SharePoint</h2>
    <div class="sptree">
      <div class="dim">/sites/PMO/HoseMaker/</div>
      <div class="dim">├─ Produksjonsmapper (liste – metadata, status, logg)</div>
      <div>└─ ${year}/</div>
      <div class="new">&nbsp;&nbsp;&nbsp;└─ ${id} – ${esc(w.project||w.customer)}/</div>
      <div class="new">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;├─ 01_Produksjonsliste.xlsx</div>
      <div class="new">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;├─ 02_Trykktestsertifikat.pdf</div>
      <div class="new">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;├─ 03_Tags.pdf</div>
      <div class="new">&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;└─ Slangeliste (SharePoint-liste, én rad per slange)</div>
    </div>
    ${w.project?`<div class="notice" style="margin-top:12px">🔗 Mappen kobles til PMOTION-prosjektet «${esc(w.project)}» og dukker opp som sjekklistepunkt i Fase 4 – Gjennomføring.</div>`
    :`<div class="notice" style="margin-top:12px">📨 Ikke knyttet til PMOTION-prosjekt – helt greit for enkeltstående slangeforespørsler. Kobling kan legges til senere fra mappen.</div>`}
    <div class="notice">${w.order||w.po?"📦 Ordre-/PO-nummer er registrert – mappen lagres som <b>Ordre – klar til produksjon</b>.":"📨 Uten ordre/PO lagres mappen som <b>Forespørsel</b>: slangelisten kan bearbeides videre, tilbudsunderlag kan skrives ut, og mappen løftes til ordre når bestillingen kommer."}</div>
    <div class="notice">⚙️ Etter lagring følger mappen prosessen: <b>opprett slangepakken i Telaris</b> med ett klikk (varenummer + komplett BOM genereres automatisk) → <b>tilbudet sendes fra Telaris</b> på pakkevaren → bestilling registreres når den kommer. Portene i mappen håndhever rekkefølgen.</div>
    <div class="wizfoot">
      <button class="btn btn-ghost" onclick="State.wizard.step=3;render()">← Tilbake</button>
      <button class="btn btn-good btn-big" onclick="wzCreate()">${w.editId?"✅ Lagre oppdatert slangeliste":w.order||w.po?"✅ Opprett produksjonsmappe":"✅ Opprett forespørsel"}</button>
    </div>
  </div>`;
}
function wzFetchPts(){
  const w=State.wizard;
  const n=assignPts(w.rows);
  w.ptsFetched=(w.ptsFetched||0)+n;
  wzValidate();render();
}

function wzCreate(){
  const w=State.wizard;
  const newLines=w.rows.map(r=>({...r,len:Number(r.len),qty:Number(r.qty)||1,cutN:0,st:{cut:null,clean:null,press:null,test:null}}));
  if(w.editId){
    const f=folder(w.editId);
    f.customer=w.customer;f.custRef=w.custRef;f.project=w.project;f.order=w.order;f.po=w.po;f.hub=w.hub;
    // bevar utført arbeid på linjer med samme PTS ID
    const oldByPts={};f.lines.forEach(l=>{if(l.pts)oldByPts[l.pts]=l});
    f.lines=newLines.map(l=>l.pts&&oldByPts[l.pts]?{...l,st:oldByPts[l.pts].st,cutN:oldByPts[l.pts].cutN||0,mach:l.mach||oldByPts[l.pts].mach}:l);
    f.docsStale=true;
    if(w.ptsFetched)addLog(f,`${w.ptsFetched} PTS-ID-er reservert fra PTS-registeret`);
    addLog(f,`Slangelisten bearbeidet på nytt – ${f.lines.length} linjer, validering OK. Dokumentene må regenereres.`);
    State.wizard=null;App.openFolder(f.id);return;
  }
  State.seq++;
  const isOrder=!!(w.order||w.po);
  const f={id:w.newId,
    title:(w.customer||"Kunde")+" – "+(w.project?w.project.replace(/^[\d]+ – /,""):(w.custRef||"slangeforespørsel")),
    project:w.project,order:w.order,po:w.po,custRef:w.custRef,customer:w.customer,hub:w.hub,
    status:isOrder?"klar":"fsp",
    created:now(),by:State.user,docsGenerated:true,docsStale:false,plannedStart:null,
    lines:newLines,log:[]};
  f.log.unshift({t:now(),who:State.user,msg:isOrder
    ?`Produksjonsmappe opprettet${w.project?` fra PMOTION-prosjekt «${w.project}»`:""} – ${f.lines.length} slanger, validering OK`
    :`Forespørsel registrert fra ${w.customer}${w.custRef?" ("+w.custRef+")":""} – slangelisten bearbeidet og validert (${f.lines.length} linjer)`});
  if(w.ptsFetched)f.log.unshift({t:now(),who:"System",msg:`${w.ptsFetched} PTS-ID-er reservert fra PTS-registeret`});
  f.log.unshift({t:now(),who:"System",msg:"Dokumenter generert og lagret i SharePoint (simulert i prototypen)"});
  State.folders.unshift(f);
  State.wizard=null;
  App.openFolder(f.id);
}
</script>
<script>
/* =====================================================================
   Mappevisning
   ===================================================================== */
function vFolder(){
  const f=folder(State.activeId);
  if(!f)return "<p>Fant ikke mappen.</p>";
  const n=f.lines.length,p=f.lines.filter(l=>l.st.cut).length,t=f.lines.filter(l=>l.st.test).length;
  const flowIdx=FLOWORDER.indexOf(f.status);
  return `
  <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap">
    <div><div class="pm-id mono">${f.id} · opprettet ${f.created} av ${esc(f.by)}</div>
    <h1>${esc(f.title)}</h1>
    <div class="sub" style="margin-bottom:6px">📎 ${esc(f.project)} · Ordre/PO: ${esc(f.po||"–")} · Hub: ${esc(f.hub)}${f.lines.length?` · ⏱ Estimat ${fmtH(estHoursFolder(f).hours)}${["prod","test","qc"].includes(f.status)?` (gjenstår ${fmtH(remainingHours(f))})`:""}`:""}${f.telaris?` · <span class="telbadge">⚙️ Telaris ${f.telaris.pkg}</span>`:""}</div></div>
    <div>${stBadge(f.status)}</div>
  </div>
  <div class="flow">${FLOWORDER.slice(0,7).map((s,i)=>{
    const cls=i<flowIdx?"f past":i===flowIdx?"f on":"f";
    return `<span class="${cls}">${STATUSES[s].icon} ${STATUSES[s].label}</span>${i<6?'<span class="arr">→</span>':""}`;
  }).join("")}</div>
  ${folderActions(f)}
  ${timePanel(f)}
  <div class="tabs">
    ${[["liste","📄 Slangeliste ("+n+")"],["dok","🗂️ Dokumenter"],["logg","📝 Logg ("+f.log.length+")"]].map(([k,l])=>
      `<button class="tab ${State.activeTab===k?"active":""}" onclick="State.activeTab='${k}';render()">${l}</button>`).join("")}
  </div>
  ${State.activeTab==="liste"?fTabListe(f,p,t):State.activeTab==="dok"?fTabDok(f):fTabLogg(f)}`;
}

/* ⏱ Tid mot kalkyle: estimat vs brukt vs opptjent (fremdrift) */
function timePanel(f){
  if(!["prod","test","qc","ferdig","arkiv"].includes(f.status)&&!(f.sessions&&f.sessions.length))return "";
  const est=estHoursFolder(f).hours;
  const ts=timeStatus(f);
  const run=(f.sessions||[]).filter(s=>!s.endAt);
  const used=ts?ts.used:0, earned=earnedHours(f);
  const pctUsed=est?Math.min(100,Math.round(100*used/est)):0;
  const pctEarned=est?Math.min(100,Math.round(100*earned/est)):0;
  return `<div class="card" style="padding:14px 18px">
    <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">
      <b style="font-family:var(--head)">⏱ Tid mot kalkyle</b>
      <span class="sub" style="margin:0">Estimat <b style="color:var(--text)">${fmtH(est)}</b></span>
      <span class="sub" style="margin:0">Brukt <b style="color:var(--text)">${fmtH(used)}</b>${run.length?` <span class="status st-prod">⏵ ${run.length} økt${run.length>1?"er":""} pågår</span>`:""}</span>
      <span class="sub" style="margin:0">Opptjent iht. fremdrift <b style="color:var(--text)">${fmtH(earned)}</b></span>
      ${ts?`<span class="status ${ts.st==="ahead"?"st-ferdig":ts.st==="ontrack"?"st-klar":"st-prod"}">${ts.label}${ts.diff?` ${Math.abs(ts.diff).toLocaleString("nb-NO")} t`:""}</span>`
          :`<span class="sub" style="margin:0">ingen økter ennå – tiden starter automatisk når mappen åpnes i verkstedsmodus</span>`}
    </div>
    <div style="display:flex;gap:14px;align-items:center;margin-top:8px;flex-wrap:wrap">
      <div style="flex:1;min-width:220px"><div style="font-size:11px;color:var(--muted)">Fremdrift (opptjent av estimat: ${pctEarned} %)</div><div class="meter m-good"><div style="width:${pctEarned}%"></div></div></div>
      <div style="flex:1;min-width:220px"><div style="font-size:11px;color:var(--muted)">Tidsbruk (brukt av estimat: ${pctUsed} %)</div><div class="meter"><div style="width:${pctUsed}%;${ts&&ts.st==="behind"?"background:var(--warn)":""}"></div></div></div>
    </div>
  </div>`;
}

function folderActions(f){
  const btns=[];
  const miss=ptsMissing(f);
  if(["fsp","tilbud"].includes(f.status)){
    btns.push(`<button class="btn btn-primary" onclick="fResume('${f.id}')">✏️ Bearbeid slangelisten</button>`);
  }
  /* kjeden: bearbeid → hent PTS-ID-er → opprett i Telaris → tilbud fra Telaris → ordre → verksted */
  if(miss&&["fsp","tilbud","klar"].includes(f.status))
    btns.push(`<button class="btn btn-good" onclick="fFetchPts('${f.id}')">🔖 Hent PTS-ID-er til alle slangene (${miss} mangler)</button>`);
  if(!f.telaris&&f.lines.length&&!miss&&["fsp","tilbud","klar"].includes(f.status))
    btns.push(`<button class="btn btn-good" onclick="fCreateTelaris('${f.id}')">⚙️ Opprett slangepakke i Telaris</button>`);
  if(["fsp","tilbud"].includes(f.status)){
    if(f.status==="fsp"){
      btns.push(`<button class="btn btn-ghost" ${f.telaris?"":`disabled title="Slangepakken må opprettes i Telaris først – tilbudet sendes derfra"`} onclick="fMarkTilbud('${f.id}')">📤 Marker tilbud sendt fra Telaris</button>`);
      if(f.lines.length&&!f.telaris&&!miss)btns.push(`<span class="gatemsg" style="align-self:center">🔒 Tilbudet sendes fra Telaris – opprett slangepakken først</span>`);
    }
    btns.push(`<button class="btn btn-good" ${f.lines.length?"":"disabled title='Slangelisten er tom'"} onclick="State.poForm=State.poForm==='${f.id}'?null:'${f.id}';render()">📦 Registrer bestilling …</button>`);
  }
  if(!f.project&&!["ferdig","arkiv"].includes(f.status))btns.push(`<select style="background:var(--surface2);color:var(--text);border:1px solid var(--border2);border-radius:9px;padding:8px 10px;font-size:12.5px" onchange="fLinkProject('${f.id}',this.value)">
    <option value="">🔗 Koble til PMOTION-prosjekt …</option>${PMPROJECTS.map(p=>`<option>${p}</option>`).join("")}</select>`);
  if(f.status==="klar"){
    btns.push(`<button class="btn btn-primary" ${miss||!f.telaris?`disabled title="${miss?"Hent PTS-ID-er først – hver slange må ha ID for tags og sporing":"Opprett slangepakken i Telaris først – BOM-en styrer lagertrekk og kalkyle"}"`:""} onclick="fSend('${f.id}')">🏭 Send til verksted</button>`);
    if(miss)btns.push(`<span class="gatemsg" style="align-self:center">🔒 ${miss} slanger mangler PTS-ID – hent dem før produksjon</span>`);
    else if(!f.telaris)btns.push(`<span class="gatemsg" style="align-self:center">🔒 Opprett slangepakken i Telaris før produksjon</span>`);
  }
  if(["prod","test"].includes(f.status))btns.push(`<button class="btn btn-ghost" onclick="State.ws.folderId='${f.id}';State.ws.stage=null;State.ws.hoseType=null;App.nav('verksted')">🏭 Åpne i verkstedsmodus</button>`);
  if(f.status==="qc")btns.push(`<button class="btn btn-primary" onclick="State.ws.folderId='${f.id}';State.ws.stage='qc';App.nav('verksted')">🔍 Åpne spot-check</button>`);
  if(f.status==="ferdig"&&f.spot)btns.push(`<button class="btn btn-primary" onclick="State.ws.folderId='${f.id}';State.ws.stage='prints';App.nav('verksted')">🖨️ Utskrifter</button>`);
  if(f.status==="ferdig")btns.push(`<button class="btn btn-ghost" onclick="fArchive('${f.id}')">🗃️ Arkiver mappen</button>`);
  const poForm=State.poForm===f.id?`
  <div class="card" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
    <div><label style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Ordrenummer</label><br>
      <input id="pf-order" value="${esc(f.order||"")}" placeholder="f.eks. 26810" style="background:var(--surface2);border:1px solid var(--border2);border-radius:9px;color:var(--text);padding:9px 12px"></div>
    <div><label style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">PO-nummer</label><br>
      <input id="pf-po" value="${esc(f.po||"")}" placeholder="kundens PO" style="background:var(--surface2);border:1px solid var(--border2);border-radius:9px;color:var(--text);padding:9px 12px"></div>
    <button class="btn btn-good" onclick="fRegisterPO('${f.id}',document.getElementById('pf-order').value,document.getElementById('pf-po').value)">✅ Registrer – mappen blir klar til produksjon</button>
  </div>`:"";
  return (btns.length?`<div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">${btns.join("")}</div>`:"")+poForm;
}
function fMarkTilbud(id){
  const f=folder(id);if(!f.lines.length)return;
  if(!f.telaris)return; // port: tilbudet sendes fra Telaris på pakkevaren
  f.status="tilbud";
  addLog(f,`Tilbud sendt til kunden fra Telaris på pakkevare ${f.telaris.pkg} – tilbudsunderlaget ligger i Dokumenter`);
  render();
}
function fRegisterPO(id,order,po){
  const f=folder(id);
  if(!order&&!po)return;
  f.order=(order||"").trim();f.po=(po||"").trim();f.status="klar";State.poForm=null;
  addLog(f,`Bestilling registrert (ordre ${f.order||"–"} / PO ${f.po||"–"}) – mappen er klar til produksjon og lagt i produksjonsplanen`);
  render();
}
function fLinkProject(id,proj){
  if(!proj)return;
  const f=folder(id);f.project=proj;
  addLog(f,`Mappen koblet til PMOTION-prosjektet «${proj}»`);
  render();
}
function fResume(id){
  const f=folder(id);
  App.startWizard();
  const w=State.wizard;
  w.editId=f.id;w.project=f.project||"";w.order=f.order||"";w.po=f.po||"";
  w.customer=f.customer||"";w.custRef=f.custRef||"";w.hub=f.hub||"Lillesand";
  w.rows=f.lines.map(l=>({pts:l.pts,pos:String(l.pos??""),hose:l.hose,len:String(l.len??""),
    c1:l.c1,c2:l.c2,qty:String(l.qty??"1"),mach:l.mach||"",wp:l.wp,cut:l.cut}));
  if(w.rows.length){wzValidate();w.step=2}
  render();
}
function fFetchPts(id){
  const f=folder(id);
  const n=assignPts(f.lines);
  if(n){f.docsStale=true;addLog(f,`${n} PTS-ID-er reservert fra PTS-registeret – tags og dokumenter må regenereres`)}
  render();
}
function fSend(id){
  const f=folder(id);
  if(ptsMissing(f)||!f.telaris)return; // port: PTS-ID-er hentet og Telaris-pakke opprettet før produksjon
  f.status="prod";
  addLog(f,"Status endret: Klar til produksjon → I produksjon (sendt til verksted)");
  render();
}
function fCreateTelaris(id){
  const f=folder(id);
  if(f.telaris)return;
  f.telaris=buildTelaris(f);
  addLog(f,`Slangepakke opprettet i Telaris (simulert): vare ${f.telaris.pkg} med ${f.telaris.items.length} slanger og komplett BOM`);
  render();
}
function fArchive(id){
  const f=folder(id);f.status="arkiv";
  addLog(f,"Mappen arkivert – historikk og dokumenter beholdes i SharePoint");
  render();
}

function fTabListe(f,p,t){
  const editable=["fsp","tilbud","klar"].includes(f.status);
  return `
  ${f.lines.length?`
  <div class="cardrow">
    ${STAGES.map(s=>{const c=stageCount(f,s.key);return `<div class="tile"><div class="t-label">${s.icon} ${s.label}</div><div class="t-value">${c}/${f.lines.length}</div><div class="meter ${s.key==="test"?"m-good":""}"><div style="width:${Math.round(100*c/f.lines.length)}%"></div></div></div>`}).join("")}
  </div>` : `<div class="notice">Utkastet har ingen slangeliste ennå – fortsett i veiviseren.</div>`}
  ${editable&&f.lines.length?`<div class="notice">✏️ Mappen kan redigeres til den sendes til verksted. Endringer merker dokumentene som utdaterte.</div>`:""}
  <div class="tblwrap"><table>
    <tr><th>PTS ID</th><th>POS</th><th>Hose</th><th>Lengde</th><th>Kutt</th><th>Coupling 1</th><th>Coupling 2</th><th>Ant.</th><th>WP</th><th>Operasjoner</th></tr>
    ${f.lines.map((l,i)=>`<tr>
      <td class="mono">${(()=>{const n=l.qty||1,ids=ptsAll(l);
        if(!ids.length)return `<span class="ptspill">hentes${n>1?` (${n})`:""}</span>`;
        if(ids.length<n)return `<span class="ptspill">${esc(ids[0])} · ${ids.length}/${n}</span>`;
        return `<span title="${ids.map(esc).join(" · ")}">${esc(ids[0])}${n>1?` <span class="ptspill has">+${n-1}</span>`:""}</span>`})()}</td><td>${esc(l.pos)}</td><td>${esc(l.hose)}</td><td>${esc(l.len)}</td>
      <td class="mono" style="font-weight:700">${l.cut?fmtCut(l):(l.cutErr?`<span style="color:var(--warn)" title="${esc(l.cutErr)}">📏 mål mangler</span>`:"–")}</td>
      <td class="mono">${esc(l.c1)}</td><td class="mono">${esc(l.c2)}</td><td>${l.qty}</td><td>${l.wp?l.wp+" bar":"–"}</td>
      <td>${STAGES.map(s=>`<span title="${s.label}${l.st[s.key]?" – "+l.st[s.key].by+" "+l.st[s.key].at:" – ikke utført"}" style="opacity:${l.st[s.key]?1:.22};font-size:15px">${s.icon}</span>`).join(" ")}</td>
    </tr>`).join("")}
  </table></div>
  ${editable&&f.lines.length?`<div style="margin-top:12px"><button class="btn btn-ghost" onclick="fEditDemo('${f.id}')">✏️ Simuler endring (legg til en slange)</button></div>`:""}`;
}
function fEditDemo(id){
  const f=folder(id);
