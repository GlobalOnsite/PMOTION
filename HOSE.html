/* =====================================================================
   Verkstedsmodus – store flater for PC/skjerm på verkstedet.
   Slangene er gruppert per slangetype: montøren må aktivt velge typen
   (med tegning) før kuttelisten vises – det hindrer kapping av feil
   slange når flere typer ligger i samme mappe.
   ===================================================================== */

/* Visuell profil per serie: farge + antall lag. Fargen er en skjermkode
   for å skille typene – typenavnet står alltid påtrykt (aldri farge alene). */
const SERIES_STYLE={
  "187ST":{color:"#8a94a8",layers:1,desc:"1-flettet · WP 70 bar"},
  "387ST":{color:"#3b82f6",layers:2,desc:"2-flettet · WP 210 bar"},
  "487ST":{color:"#d64545",layers:4,desc:"4-spiral · WP 280 bar"},
  "787ST":{color:"#2f9e6e",layers:6,desc:"multispiral · WP 350 bar"},
  "462ST":{color:"#b07d2b",layers:2,desc:"2-flettet · WP 310 bar"},
  "2390N":{color:"#7c5cd6",layers:2,desc:"kompakt · WP 490 bar"}
};
function seriesOf(code){return (code||"").split("-")[0]}
function sizeOf(code){const p=(code||"").split("-");return Number(p[p.length-1])||8}

/* Skjematisk tegning av slangen: press-nippel i begge ender, hylse,
   slangekropp med spiralmønster og påtrykt kode ("lay line"). */
function hoseSVG(code,h){
  h=h||64;
  const st=SERIES_STYLE[seriesOf(code)]||{color:"#8892a4",layers:2,desc:""};
  const size=sizeOf(code);
  const bodyH=Math.min(12+size*1.5,36);           // tykkelse følger dimensjonen
  const W=440,cy=h/2,x1=78,x2=W-78;
  const pid="p"+code.replace(/[^a-zA-Z0-9]/g,"");
  const fitting=(x,dir)=>`
    <rect x="${x-14*dir-14}" y="${cy-bodyH/2-5}" width="28" height="${bodyH+10}" rx="3" fill="#9aa3b5"/>
    <rect x="${dir>0?x-52:x+24}" y="${cy-7}" width="28" height="14" rx="2" fill="#c2c9d6"/>
    <path d="M ${dir>0?x-66:x+66} ${cy} l ${10*dir} -9 v18 z" fill="#c2c9d6"/>`;
  return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;max-width:${W}px;height:auto" role="img" aria-label="Tegning av ${esc(code)}">
    <defs><pattern id="${pid}" width="14" height="${bodyH}" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="14" height="${bodyH}" fill="${st.color}"/>
      <path d="M -2 ${bodyH+2} L 9 -2" stroke="rgba(0,0,0,.28)" stroke-width="${Math.max(2,6-st.layers)}"/>
      <path d="M 5 ${bodyH+2} L 16 -2" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
    </pattern></defs>
    <rect x="${x1}" y="${cy-bodyH/2}" width="${x2-x1}" height="${bodyH}" rx="${bodyH/2.6}" fill="url(#${pid})" stroke="rgba(0,0,0,.4)"/>
    <rect x="${x1}" y="${cy-bodyH/2+2}" width="${x2-x1}" height="4" rx="2" fill="rgba(255,255,255,.25)"/>
    ${fitting(x1,1)}${fitting(x2,-1)}
    <rect x="${(W-190)/2}" y="${cy-8}" width="190" height="16" rx="3" fill="rgba(0,0,0,.45)"/>
    <text x="${W/2}" y="${cy+4}" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#fff">${esc(code)} · ${MASTER.hoses[code]?MASTER.hoses[code].inch:""}</text>
  </svg>`;
}

/* =====================================================================
   Detaljerte tegninger: koblinger (riktig vinkel/system fra masterdata),
   komplett montasje, bar slange med målpil og UC-propper.
   ===================================================================== */
let svgSeq=0;
function metalDefs(tag){return `<defs>
  <linearGradient id="met${tag}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eef2f7"/><stop offset=".45" stop-color="#aeb8c6"/>
    <stop offset=".55" stop-color="#98a3b3"/><stop offset="1" stop-color="#5f6875"/>
  </linearGradient>
  <linearGradient id="metd${tag}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cfd6df"/><stop offset="1" stop-color="#49515c"/>
  </linearGradient>
</defs>`}
function hosePattern(tag,hose,bodyH){
  const st=SERIES_STYLE[seriesOf(hose)]||{color:"#8892a4",layers:2};
  return `<defs><pattern id="hp${tag}" width="14" height="${bodyH}" patternUnits="userSpaceOnUse">
    <rect width="14" height="${bodyH}" fill="${st.color}"/>
    <path d="M -2 ${bodyH+2} L 9 -2" stroke="rgba(0,0,0,.28)" stroke-width="${Math.max(2,6-(st.layers||2))}"/>
    <path d="M 5 ${bodyH+2} L 16 -2" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
  </pattern></defs>`;
}

/* Én kobling tegnet ut fra hylsa. dir=1: venstre ende, dir=-1: høyre ende. */
function couplingPart(code,dir,x,cy,bodyH,tag){
  const c=MASTER.couplings[code]||{};
  const ang=c.ang??0;
  const E="#3a414c";
  const fh=bodyH+14, fw=34;
  const fx=dir>0?x-fw:x;
  let g=`<rect x="${fx}" y="${cy-fh/2}" width="${fw}" height="${fh}" rx="4" fill="url(#met${tag})" stroke="${E}"/>`;
  for(let k=1;k<6;k++){const rx=fx+k*(fw/6);
    g+=`<line x1="${rx}" y1="${cy-fh/2+3}" x2="${rx}" y2="${cy+fh/2-3}" stroke="#525a66" stroke-width="1.4" opacity=".8"/>`}
  const stem=13, nutW=26, nutH=bodyH+18, nipW=15;
  let outer=`<rect x="0" y="${-bodyH/2-2}" width="${stem}" height="${bodyH+4}" fill="url(#metd${tag})" stroke="${E}"/>`;
  outer+=`<rect x="${stem}" y="${-nutH/2}" width="${nutW}" height="${nutH}" rx="3" fill="url(#met${tag})" stroke="${E}"/>`;
  outer+=`<line x1="${stem+2}" y1="${-nutH/6}" x2="${stem+nutW-2}" y2="${-nutH/6}" stroke="#6a7482" stroke-width="1.2"/>`;
  outer+=`<line x1="${stem+2}" y1="${nutH/6}" x2="${stem+nutW-2}" y2="${nutH/6}" stroke="#4d5560" stroke-width="1.2"/>`;
  outer+=`<rect x="${stem+nutW}" y="${-bodyH/2}" width="${nipW}" height="${bodyH}" fill="url(#metd${tag})" stroke="${E}"/>`;
  for(let k=2;k<nipW-1;k+=3)
    outer+=`<line x1="${stem+nutW+k}" y1="${-bodyH/2+1}" x2="${stem+nutW+k}" y2="${bodyH/2-1}" stroke="#e8edf3" stroke-width="1" opacity=".65"/>`;
  if(c.sys==="ORFS")outer+=`<rect x="${stem+nutW-3}" y="${-bodyH/2-3}" width="3" height="${bodyH+6}" fill="#20242b"/>`;
  const px=dir>0?fx:fx+fw;
  const rot=ang===0?0:(ang===45?-45:-90);
  const elbow=ang?`<rect x="-7" y="${-bodyH/2-5}" width="14" height="${bodyH+10}" rx="3" fill="url(#met${tag})" stroke="${E}"/>`:"";
  g+=`<g transform="translate(${px},${cy}) scale(${dir>0?-1:1},1)${ang?` rotate(${rot})`:""}">${elbow}${outer}</g>`;
  return g;
}
function cplLabel(code){
  const c=MASTER.couplings[code]||{};
  return c.sys?`${c.sys} ${c.dim} · ${c.ang??0}°`:"";
}

/* Komplett montasjetegning: C1 + slange + C2, med etiketter under hver ende */
function assemblySVG(l,H){
  H=H||150;svgSeq++;const tag="a"+svgSeq;
  const size=sizeOf(l.hose);const bodyH=Math.min(12+size*1.5,32);
  const W=540,cy=H-44,x1=122,x2=W-122;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" role="img" aria-label="Montasje ${esc(l.hose)} med ${esc(l.c1)} og ${esc(l.c2)}">
    ${metalDefs(tag)}${hosePattern(tag,l.hose,bodyH)}
    <rect x="${x1}" y="${cy-bodyH/2}" width="${x2-x1}" height="${bodyH}" rx="${bodyH/2.6}" fill="url(#hp${tag})" stroke="rgba(0,0,0,.4)"/>
    <rect x="${x1}" y="${cy-bodyH/2+2}" width="${x2-x1}" height="4" rx="2" fill="rgba(255,255,255,.25)"/>
    <rect x="${(W-170)/2}" y="${cy-8}" width="170" height="16" rx="3" fill="rgba(0,0,0,.45)"/>
    <text x="${W/2}" y="${cy+4}" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#fff">${esc(l.hose)} · ${MASTER.hoses[l.hose]?MASTER.hoses[l.hose].inch:""}</text>
    ${couplingPart(l.c1,1,x1,cy,bodyH,tag)}
    ${couplingPart(l.c2,-1,x2,cy,bodyH,tag)}
    <text x="10" y="${H-10}" font-family="monospace" font-size="12.5" font-weight="800" fill="currentColor">C1: ${esc(l.c1)}</text>
    <text x="10" y="${H-24}" font-size="10.5" fill="currentColor" opacity=".65">${cplLabel(l.c1)}</text>
    <text x="${W-10}" y="${H-10}" text-anchor="end" font-family="monospace" font-size="12.5" font-weight="800" fill="currentColor">C2: ${esc(l.c2)}</text>
    <text x="${W-10}" y="${H-24}" text-anchor="end" font-size="10.5" fill="currentColor" opacity=".65">${cplLabel(l.c2)}</text>
  </svg>`;
}

/* Bar slange (før pressing): kappesnitt, valgfri målpil for kuttemål og UC-propper */
function bareHoseSVG(l,opts){
  opts=opts||{};svgSeq++;const tag="b"+svgSeq;
  const size=sizeOf(l.hose);const bodyH=Math.min(12+size*1.5,32);
  const W=540,H=opts.arrow?120:86,cy=38,x1=46,x2=W-46;
  let g=`<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" role="img" aria-label="Slange ${esc(l.hose)}">
    ${metalDefs(tag)}${hosePattern(tag,l.hose,bodyH)}
    <rect x="${x1}" y="${cy-bodyH/2}" width="${x2-x1}" height="${bodyH}" fill="url(#hp${tag})" stroke="rgba(0,0,0,.4)"/>
    <rect x="${x1}" y="${cy-bodyH/2+2}" width="${x2-x1}" height="4" rx="2" fill="rgba(255,255,255,.25)"/>
    <rect x="${(W-170)/2}" y="${cy-8}" width="170" height="16" rx="3" fill="rgba(0,0,0,.45)"/>
    <text x="${W/2}" y="${cy+4}" text-anchor="middle" font-family="monospace" font-size="11.5" font-weight="700" fill="#fff">${esc(l.hose)} · ${MASTER.hoses[l.hose]?MASTER.hoses[l.hose].inch:""}</text>
    <line x1="${x1}" y1="${cy-bodyH/2-4}" x2="${x1}" y2="${cy+bodyH/2+4}" stroke="#e8edf3" stroke-width="2.5"/>
    <line x1="${x2}" y1="${cy-bodyH/2-4}" x2="${x2}" y2="${cy+bodyH/2+4}" stroke="#e8edf3" stroke-width="2.5"/>`;
  if(opts.plugs){
    g+=`<rect x="${x1-16}" y="${cy-bodyH/2-3}" width="18" height="${bodyH+6}" rx="4" fill="#f3c614" stroke="#8a6d00"/>
        <rect x="${x2-2}" y="${cy-bodyH/2-3}" width="18" height="${bodyH+6}" rx="4" fill="#f3c614" stroke="#8a6d00"/>
        <text x="${W/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="currentColor" opacity=".7">UC-propper i begge ender etter rens</text>`;
  }
  if(opts.arrow&&l.cut){
    const ay=cy+bodyH/2+26;
    g+=`<line x1="${x1}" y1="${cy+bodyH/2+8}" x2="${x1}" y2="${ay+8}" stroke="currentColor" stroke-width="1" opacity=".5"/>
        <line x1="${x2}" y1="${cy+bodyH/2+8}" x2="${x2}" y2="${ay+8}" stroke="currentColor" stroke-width="1" opacity=".5"/>
        <line x1="${x1}" y1="${ay}" x2="${x2}" y2="${ay}" stroke="currentColor" stroke-width="1.6"/>
        <path d="M ${x1} ${ay} l 9 -4.5 v 9 z" fill="currentColor"/>
        <path d="M ${x2} ${ay} l -9 -4.5 v 9 z" fill="currentColor"/>
        <rect x="${W/2-70}" y="${ay-12}" width="140" height="24" rx="5" fill="var(--surface2)" stroke="var(--border2)"/>
        <text x="${W/2}" y="${ay+5}" text-anchor="middle" font-family="monospace" font-size="15" font-weight="800" fill="currentColor">✂ ${l.cut.toLocaleString("nb-NO")} mm</text>`;
  }
  return g+`</svg>`;
}

/* Lite koblingsikon til lister */
function miniCplSVG(code){
  svgSeq++;const tag="m"+svgSeq;
  return `<svg viewBox="0 0 100 46" style="width:88px;height:40px" role="img" aria-label="${esc(code)}">
    ${metalDefs(tag)}
    <rect x="2" y="17" width="12" height="12" rx="3" fill="#333a45"/>
    ${couplingPart(code,-1,12,23,12,tag)}
  </svg>`;
}

/* =====================================================================
   FOTOBASERT MONTASJEVISNING – kun originalbilder fra Parker.
   Koblingsfoto speilvendes automatisk slik at nippelen alltid peker inn
   mot slangen (orientering per fotofamilie ligger i master: imgHoseEnd).
   ===================================================================== */
function cplPhotoImg(code,side){
  const c=MASTER.couplings[code]||{};
  const end=c.imgHoseEnd||"left";                       // hvor slangeenden peker i originalfotoet
  const flip=(side==="left"&&end==="left")||(side==="right"&&end==="right");
  return `<div class="imgclip"><img src="${cplImgURL(code)}" alt="${esc(code)}" loading="lazy"
    style="transform:scale(1.25)${flip?" scaleX(-1)":""}"
    onerror="this.parentElement.style.display='none';this.parentElement.nextElementSibling.style.display='flex'"></div>
  <div class="asm-fallback">${esc(code)}<br>foto mangler</div>`;
}
function photoAssembly(l,small){
  return `<div class="assembly${small?" small":""}">
    <div class="asm-slot">${cplPhotoImg(l.c1,"left")}
      <div class="asm-lab">C1: ${esc(l.c1)}</div><div class="asm-geo">${cplLabel(l.c1)} · nippel inn →</div></div>
    <div class="asm-slot mid"><div class="imgclip"><img src="${hoseImgURL(l.hose)}" alt="${esc(l.hose)}" loading="lazy"
        onerror="this.parentElement.style.display='none';this.parentElement.nextElementSibling.style.display='flex'"></div>
      <div class="asm-fallback">${esc(l.hose)}<br>foto mangler</div>
      <div class="asm-lab">${esc(l.hose)}</div><div class="asm-geo">${MASTER.hoses[l.hose]?MASTER.hoses[l.hose].inch:""} · kutt ${fmtCut(l)}</div></div>
    <div class="asm-slot">${cplPhotoImg(l.c2,"right")}
      <div class="asm-lab">C2: ${esc(l.c2)}</div><div class="asm-geo">← nippel inn · ${cplLabel(l.c2)}</div></div>
  </div>`;
}
/* Ren målpil (ingen tegning av selve slangen) */
function measureSVG(l){
  if(!l.cut)return "";
  const W=540,ay=22;
  return `<svg viewBox="0 0 ${W} 44" style="width:100%;max-width:${W}px;height:auto">
    <line x1="8" y1="6" x2="8" y2="38" stroke="currentColor" stroke-width="1.5" opacity=".6"/>
    <line x1="${W-8}" y1="6" x2="${W-8}" y2="38" stroke="currentColor" stroke-width="1.5" opacity=".6"/>
    <line x1="8" y1="${ay}" x2="${W-8}" y2="${ay}" stroke="currentColor" stroke-width="1.6"/>
    <path d="M 8 ${ay} l 10 -5 v 10 z" fill="currentColor"/>
    <path d="M ${W-8} ${ay} l -10 -5 v 10 z" fill="currentColor"/>
    <rect x="${W/2-78}" y="${ay-14}" width="156" height="28" rx="6" fill="var(--surface2)" stroke="var(--border2)"/>
    <text x="${W/2}" y="${ay+6}" text-anchor="middle" font-family="monospace" font-size="16" font-weight="800" fill="currentColor">✂ ${l.cut.toLocaleString("nb-NO")} mm</text>
  </svg>`;
}
function hosePhotoPanel(l,opts){
  opts=opts||{};
  return `<div>
    <div class="hpanel"><div class="imgclip zoomh"><img src="${hoseImgURL(l.hose)}" alt="${esc(l.hose)}" loading="lazy"
      onerror="this.parentElement.style.display='none';this.parentElement.nextElementSibling.style.display='flex'"></div>
      <div class="asm-fallback" style="height:150px">${esc(l.hose)}<br>foto mangler</div>
      <div class="asm-lab">${esc(l.hose)} · ${MASTER.hoses[l.hose]?MASTER.hoses[l.hose].inch:""}</div>
      ${opts.plugs?`<div class="asm-geo">🟡 Sett UC-propper i begge ender etter rens</div>`:""}
    </div>
    ${opts.arrow?`<div style="margin-top:8px">${measureSVG(l)}</div>`:""}
  </div>`;
}
function hoseThumb(code){
  return `<div class="hthumb"><div class="imgclip zoomh"><img src="${hoseImgURL(code)}" alt="${esc(code)}" loading="lazy"
    onerror="this.parentElement.style.display='none';this.parentElement.nextElementSibling.style.display='flex'"></div>
    <div class="asm-fallback" style="height:84px">${esc(code)}</div></div>`;
}

function wsTypes(f,stageKey){
  const g={};
  f.lines.forEach((l,i)=>{(g[l.hose]=g[l.hose]||[]).push({l,i})});
  return Object.entries(g).map(([hose,items])=>({hose,items,
    done:items.filter(x=>x.l.st[stageKey||"cut"]).length}));
}
/* Neste slangetype med gjenstående arbeid i valgt operasjon (wrap-around). */
function wsNextType(f,current,stageKey){
  const types=wsTypes(f,stageKey);
  const start=Math.max(0,types.findIndex(x=>x.hose===current));
  for(let k=1;k<=types.length;k++){
    const cand=types[(start+k)%types.length];
    if(cand.hose!==current&&cand.done<cand.items.length)return cand;
  }
  return null;
}
function stageDef(key){return STAGES.find(s=>s.key===key)}
function prevStage(key){const i=STAGES.findIndex(s=>s.key===key);return i>0?STAGES[i-1]:null}

function vVerksted(){
  if(State.testRun)return vTestRun();
  const cands=State.folders.filter(f=>["prod","test","qc"].includes(f.status));
  const f=folder(State.ws.folderId);
  if(f&&State.ws.stage==="prints")return vPrints(f);
  if(f&&(f.status==="qc"||State.ws.stage==="qc")&&f.spot)return vQC(f);
  if(!f||!["prod","test","qc"].includes(f.status)){
    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h1>🏭 Verkstedsmodus</h1>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${wsModeBtn()}</div>
    </div>
    <div class="sub">Velg produksjonsmappen dere jobber med. Kun mapper som er sendt til produksjon vises her.${State.fs?"":" På iPad: trykk <b>⛶ Fullskjerm</b> – menyen og topplinjen kollapses så hele skjermen brukes til arbeidet."}</div>
    ${cands.length?`<div class="pmgrid">${cands.map(x=>`<div class="pmcard" onclick="wsEnter('${x.id}')">
      <div class="pm-id">${x.id}</div><div class="pm-title" style="font-size:17px">${esc(x.title)}</div>
      ${stBadge(x.status)}
      <div class="meter" style="margin-top:10px"><div style="width:${Math.round(100*x.lines.filter(l=>l.st.cut).length/x.lines.length)}%"></div></div>
      <div class="meter-label"><span>✂️ Kappet ${x.lines.filter(l=>l.st.cut).length}/${x.lines.length}</span><span>🧪 Testet ${x.lines.filter(l=>l.st.test).length}/${x.lines.length}</span></div>
    </div>`).join("")}</div>`
    :`<div class="notice">Ingen mapper i produksjon akkurat nå.</div>`}`;
  }
  if(!State.ws.stage)return wsStageSelect(f);
  if(State.ws.stage==="cut"){
    if(!(State.ws.hoseType&&f.lines.some(l=>l.hose===State.ws.hoseType)))return wsCutTypeSelect(f);
    return State.touch?wsFocus(f,"cut"):wsCutView(f);
  }
  if(State.ws.stage==="clean")return wsCleanView(f);   // én samlet kvittering
  if(State.ws.stage==="pres")return wsPresView(f);     // én samlet kvittering (krympehetter/plugger)
  if(State.ws.stage==="test")return wsTestView(f);     // puljer per testtrykk
  return State.touch?wsFocus(f,State.ws.stage):wsStageList(f,State.ws.stage);
}

/* Brytere: PC/touch-visning + fullskjerm (meny og topplinje kollapses).
   I fullskjerm vises avslutt-knappen i den flytende linjen øverst til høyre. */
function wsModeBtn(){
  return `<button class="btn btn-ghost" onclick="State.touch=!State.touch;render()" title="Bytt mellom PC- og nettbrettvisning">${State.touch?"🖥️ PC-visning":"📱 Touch-visning"}</button>${State.fs?"":`
  <button class="btn btn-primary" onclick="App.toggleFs()" title="Fullskjerm for iPad/verkstedskjerm – menyen og topplinjen skjules">⛶ Fullskjerm</button>`}`;

/* --- manglende B-/S-mål: montøren måler og legger inn før kutt vises --- */
function wsSetMeasure(kind,code,val,fid,focusPts){
  if(!setMeasure(kind,code,val,fid)){State.mmErr=code;render();return}
  State.mmErr=null;
  if(State.wizard&&State.wizard.rows&&State.wizard.rows.length)wzValidate();
  /* bli stående på samme slange i fokusvisningen (køen re-sorteres når kuttet dukker opp) */
  if(focusPts&&State.ws.folderId&&State.ws.stage&&!["qc","prints"].includes(State.ws.stage)){
    const f=folder(State.ws.folderId);
    if(f){const q=wsFocusQueue(f,State.ws.stage);const p=q.findIndex(x=>x.l.pts===focusPts);if(p>=0)State.ws.focusPos=p}
  }
  render();
}
function measureRow(m,fid,focusPts){
  const iid=`mm-${m.kind}-${m.code}`;
  const call=`wsSetMeasure('${m.kind}','${esc(m.code)}',document.getElementById('${iid}').value,'${fid||""}','${focusPts||""}')`;
  return `<div class="vitem v-warn" style="align-items:center">
    📏 <div><b class="mono" style="font-size:16px">${esc(m.code)}</b> · mål ${m.kind==="cpl"?"koblingens <b>B-mål</b> (fra koblingens anleggsflate til enden av nippelen)":"slangens <b>S-mål</b>"} med skyvelære og legg inn verdien${State.mmErr===m.code?` <b style="color:var(--bad)">– ugyldig verdi, prøv igjen</b>`:""}</div>
    <span class="fix" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <input class="mm-input" id="${iid}" inputmode="decimal" placeholder="mm"
        onkeydown="if(event.key==='Enter')wsSetMeasure('${m.kind}','${esc(m.code)}',this.value,'${fid||""}','${focusPts||""}')">
      <button class="btn btn-good" onclick="${call}">💾 Lagre – beregn kutt</button>
    </span>
  </div>`;
}
/* Ett panel per manglende komponent (unik på tvers av linjene som vises) */
function measurePanel(lines,fid,focusPts){
  const seen={},miss=[];
  lines.forEach(l=>missingMeasures(l).forEach(m=>{const k=m.kind+"|"+m.code;if(!seen[k]){seen[k]=1;miss.push(m)}}));
  if(!miss.length)return "";
  return `<div class="vitem v-warn" style="border-width:2px">⚠️ <div><b>Kuttemål holdes tilbake – mål mangler i masterdata.</b>
    Legg inn riktig mål under, så beregnes kuttemålet automatisk for alle slanger som bruker komponenten – og masterdata blir riktig for alltid. Kapping kan ikke bekreftes før målet er på plass.</div></div>
  ${miss.map(m=>measureRow(m,fid,focusPts)).join("")}`;
}

/* --- operasjonsvelger: verkstedets startside for mappen --- */

  ${(()=>{const ts=timeStatus(f),act=activeSession(f,State.user),run=(f.sessions||[]).filter(x=>!x.endAt);
    return `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px">
    <span class="sensorchip ${act?"on":""}">⏱ Brukt ${fmtH(actualMins(f)/60)} av est. ${fmtH(estHoursFolder(f).hours)}${ts?` · ${ts.label}${ts.diff?" "+Math.abs(ts.diff).toLocaleString("nb-NO")+" t":""}`:""}</span>

    ${run.filter(x=>x.by!==State.user).length?`<span class="sub" style="margin:0">· også pågår: ${run.filter(x=>x.by!==State.user).map(x=>esc(x.by.replace("Verksted – ",""))+" fra "+x.startAt.split(" ")[1]).join(", ")}</span>`:""}
  </div>`})()}
  <div class="sub">Velg operasjon. Flyten på benken: ✂️ kapp – taggen skrives ut og festes i samme håndvending – → 🧼 rens med UC-propper (samlet kvittering) → 🔧 press → 🧪 trykktest i puljer → 🛡️ preserver (samlet) → 📦 pakk. Du kan bytte operasjon når som helst – ingenting låser deg.</div>
  <div class="pmgrid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">
    ${STAGES.map((s,i)=>{

            :`<span class="status st-utkast">venter på ${prev?prev.label.toLowerCase():""}</span>`}
        </div>
        <div class="meter ${s.key==="test"?"m-good":""}" style="margin-top:12px"><div style="width:${Math.round(100*done/n)}%"></div></div>
        <div class="meter-label"><span>${done}/${n} ${s.verb}</span>${prev&&done<n?`<span>${ready}/${n} klare fra ${prev.label.toLowerCase()}</span>`:"<span></span>"}</div>
      </div>`}).join("")}
  </div>
  <div style="margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    ${allDone?`<button class="btn btn-good btn-big wsbig" onclick="wsStartQC('${f.id}')">🔍 Alt utført – start spot-check (annenhåndskontroll)</button>`
    :`<span class="gatemsg">🔒 Spot-check og utskrifter blir tilgjengelig når alle slanger er gjennom alle seks operasjonene</span>`}

/* --- RENS (UC): én samlet kvittering for alt som er kappet ---
   Å kvittere per slange er overkill her – rensingen gjøres i én jobb.
   Slanger som kappes senere fanges av en ny kvittering. --- */
function wsCleanView(f){
  const elig=f.lines.map((l,i)=>({l,i})).filter(x=>x.l.st.cut);
  const todo=elig.filter(x=>!x.l.st.clean);
  const doneArr=elig.filter(x=>x.l.st.clean);
  const notCut=f.lines.length-elig.length;
  const header=`
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <h1 style="font-size:24px">🧼 Rens (UC) – ${esc(f.title)} <span class="mono" style="font-size:12px;color:var(--muted)">${f.id}</span></h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${wsModeBtn()}<button class="btn btn-ghost" onclick="State.ws.stage=null;render()">↩︎ Til operasjonene</button></div>
  </div>
  <div class="sub">Rens kvitteres <b>samlet</b> – ett sjekkpunkt for alle kappede slanger, ikke én bekreftelse per slange. Innlogget: <b>${esc(State.user)}</b></div>`;
  if(!elig.length)return header+`
  <div class="focus-wrap"><div class="focus-card donecard">
    <div class="big">⏳</div><div style="font-size:19px">Ingen slanger er kappet ennå – rens kommer etter kapping + tag.</div>
    <button class="bigbtn next" onclick="State.ws.stage='cut';State.ws.focusPos=-1;render()">Gå til ✂️ Kapping</button>
  </div></div>`;
  if(!todo.length)return header+`
  <div class="focus-wrap"><div class="focus-card donecard">
    <div class="big">🎉</div>
    <div style="font-size:21px;font-weight:700">Alle ${elig.length} kappede slanger er renset og har UC-propper.</div>
    ${doneArr.length?`<div class="sub" style="margin-top:6px">Sist kvittert: ${esc(doneArr[doneArr.length-1].l.st.clean.by)} · ${doneArr[doneArr.length-1].l.st.clean.at}</div>`:""}
    ${notCut?`<div class="sub">${notCut} slanger er ikke kappet ennå – de får egen kvittering senere.</div>`:""}
    <button class="bigbtn next" onclick="State.ws.stage='press';State.ws.focusPos=-1;render()">➡️ Gå til 🔧 Pressing</button>
  </div></div>`;
  return header+`
  <div class="focus-wrap"><div class="focus-card" style="border-left:10px solid var(--accent)">

/* --- ESI-sensor: integrert trykktestlogging ---
   I drift: ESI GD4200-USB leses direkte i nettleseren via Web Serial
   (Chrome/Edge) eller via en liten lokal brotjeneste bygget på ESIs
   offisielle API-DLL. I prototypen simuleres sensoren, men hele flyten
   (kurve, holdetid, godkjenningskriterier, logg) er den samme. --- */
let _runTimer=null;
const RUN={TICK:0.2,RAMP:5,HOLD:24,REL:2,HOLD_REAL:600}; /* 24 s i demo = 10 min holdetid */
function wsToggleSensor(){State.sensor.connected=!State.sensor.connected;render()}
function wsStartLoggedTest(id,tp){
  const f=folder(id);
  const sel=State.ws.testSel||{};
  const batch=f.lines.map((l,i)=>({l,i})).filter(x=>x.l.st.press&&!x.l.st.test
    &&(x.l.wp?Math.round(x.l.wp*1.5):0)===tp&&sel[x.i]!==false);
  if(!batch.length||!State.sensor.connected)return;
  State.testRun={fid:id,tp,idx:batch.map(x=>x.i),pts:batch.map(x=>x.l.pts),
    t:0,phase:"ramp",samples:[],holdMax:0,holdEnd:0,holdMin:1e9,leak:false,
    startedAt:now(),by:State.user.replace("Verksted – ","")};
  if(typeof window!=="undefined"){clearInterval(_runTimer);_runTimer=setInterval(wsRunTick,200)}
  render();
}
function wsRunTick(){
  const r=State.testRun;
  if(!r){if(typeof window!=="undefined")clearInterval(_runTimer);return}
  if(r.phase==="done")return;
  r.t+=RUN.TICK;
  const tp=r.tp;let p;
  const noise=Math.sin(r.t*7.3)*tp*0.002+Math.sin(r.t*2.1)*tp*0.001;
  if(r.t<=RUN.RAMP){r.phase="ramp";p=tp*1.01*(r.t/RUN.RAMP)+noise}
  else if(r.t<=RUN.RAMP+RUN.HOLD){
    r.phase="hold";
    const ht=r.t-RUN.RAMP;
    const decay=r.leak?tp*0.008*ht:tp*0.00012*ht;   /* lekkasje: tydelig fall */
    p=tp*1.005-decay+noise;
    r.holdMax=Math.max(r.holdMax,p);r.holdMin=Math.min(r.holdMin,p);r.holdEnd=p;
  }else if(r.t<=RUN.RAMP+RUN.HOLD+RUN.REL){r.phase="release";p=Math.max(0,(1-(r.t-RUN.RAMP-RUN.HOLD)/RUN.REL)*tp*0.9)}
  else{
    r.phase="done";
    r.dropPct=Math.round((r.holdMax-r.holdEnd)/tp*1000)/10;
    r.pass=r.dropPct<=2&&r.holdMin>=tp*0.97;
    r.endedAt=now();
    if(typeof window!=="undefined")clearInterval(_runTimer);
  }
  if(p!==undefined)r.samples.push({t:Math.round(r.t*10)/10,p:Math.round(p*10)/10});
  if(typeof document!=="undefined"&&typeof window!=="undefined")render();
}
function wsSimLeak(){if(State.testRun)State.testRun.leak=true}
function wsAbortTest(){
  if(typeof window!=="undefined")clearInterval(_runTimer);
  const r=State.testRun;
  if(r){const f=folder(r.fid);addLog(f,`Logget trykktest avbrutt manuelt (${r.pts.length} slanger, ${r.tp} bar)`)}
  State.testRun=null;render();
}
function wsApplyLoggedTest(){
  const r=State.testRun;if(!r||r.phase!=="done")return;
  const f=folder(r.fid);
  const logId="TL-"+(State.tlSeq++);
  const step=Math.max(1,Math.floor(r.samples.length/120));
  f.testLogs=f.testLogs||[];
  f.testLogs.push({id:logId,tp:r.tp,pass:r.pass,dropPct:r.dropPct,by:r.by,
    startedAt:r.startedAt,endedAt:r.endedAt,holdReal:RUN.HOLD_REAL,
    pts:r.pts.slice(),samples:r.samples.filter((_,k)=>k%step===0)});
  if(r.pass){
    const at=now();
    r.idx.forEach(i=>{f.lines[i].st.test={by:r.by,at,log:logId}});
    addLog(f,`Logget trykktest ${logId} GODKJENT: ${r.pts.length} slange${r.pts.length===1?"":"r"} ved ${r.tp} bar, 10 min holdetid, trykkfall ${r.dropPct} % (ESI ${State.sensor.serial})`);
  }else{
    addLog(f,`Logget trykktest ${logId} IKKE GODKJENT: trykkfall ${r.dropPct} % ved ${r.tp} bar – ${r.pts.length} slanger må utbedres og testes på nytt`);
  }
  State.ws.testSel={};
  State.testRun=null;
  render();
}
/* Trykkurve som SVG – brukes live og i sertifikatet (light=utskrift) */
function svgCurve(samples,tp,opts){
  const o=opts||{};const W=640,H=220,mx=42,my=14;
  const tMax=Math.max(RUN.RAMP+RUN.HOLD+RUN.REL,samples.length?samples[samples.length-1].t:1);
  const pMax=tp*1.25;
  const X=t=>mx+(W-mx-10)*(t/tMax), Y=p=>H-my-(H-2*my)*(p/pMax);
  const path=samples.map((s,k)=>(k?"L":"M")+X(s.t).toFixed(1)+" "+Y(s.p).toFixed(1)).join(" ");
  const ink=o.light?"#333":"var(--text)",grid=o.light?"#ccc":"rgba(255,255,255,.14)";
  const line=o.light?"#0e7490":"var(--info)",target=o.light?"#b45309":"var(--warn)";
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Trykkurve">
    <rect x="${X(RUN.RAMP)}" y="${my}" width="${X(RUN.RAMP+RUN.HOLD)-X(RUN.RAMP)}" height="${H-2*my}" fill="${o.light?"rgba(14,116,144,.06)":"rgba(103,232,249,.05)"}"/>
    ${[0,.5,1].map(fr=>`<line x1="${mx}" y1="${Y(pMax*fr)}" x2="${W-10}" y2="${Y(pMax*fr)}" stroke="${grid}" stroke-width="1"/>
      <text x="4" y="${Y(pMax*fr)+4}" font-size="11" fill="${ink}">${Math.round(pMax*fr)}</text>`).join("")}
    <line x1="${mx}" y1="${Y(tp)}" x2="${W-10}" y2="${Y(tp)}" stroke="${target}" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="${W-10}" y="${Y(tp)-5}" font-size="11" fill="${target}" text-anchor="end">TP ${tp} bar</text>
    <path d="${path}" fill="none" stroke="${line}" stroke-width="2.5" stroke-linejoin="round"/>
    <text x="${X(RUN.RAMP+RUN.HOLD/2)}" y="${H-2}" font-size="11" fill="${ink}" text-anchor="middle">hold time 10 min</text>
  </svg>`;
}
/* Live-skjermen for pågående logget test */
function vTestRun(){
  const r=State.testRun;

  const cur=r.samples.length?r.samples[r.samples.length-1].p:0;

    :r.phase==="release"?`<span class="phasepill">⬇️ Avlaster …</span>`
    :r.pass?`<span class="phasepill pass">✅ GODKJENT – trykkfall ${r.dropPct} % (grense 2 %)</span>`
    :`<span class="phasepill fail">⛔ IKKE GODKJENT – trykkfall ${r.dropPct} % (grense 2 %)</span>`;

      <div>${phase}</div>

          <button class="bigbtn undo" onclick="wsApplyLoggedTest()">📋 Lagre avviksloggen</button>`)
      :`<div style="display:flex;gap:10px;margin-top:14px;flex-wrap:wrap">

          :`<button class="bigbtn confirm" style="flex:1;min-width:280px" ${selCount?"":"disabled"} onclick="wsTestBatch('${f.id}',${tp})">🧪 BEKREFT TRYKKTEST – ${selCount} SLANGE${selCount===1?"":"R"} VED ${tp} BAR</button>`}
        ${left?`<span class="gatemsg">⏸ ${left} trukket bort – blir liggende til neste pulje</span>`:""}
      </div>`:""}
    </div>`}).join("")}
  ${waiting?`<div class="notice">⏳ ${waiting} slange${waiting===1?" er":"r er"} ikke presset ennå og dukker opp i puljene etter hvert.</div>`:""}`;
}
function wsTestSel(i,val){State.ws.testSel=State.ws.testSel||{};State.ws.testSel[i]=val;render()}
function wsTestSelAll(id,tp,val){
  const f=folder(id);State.ws.testSel=State.ws.testSel||{};
  f.lines.forEach((l,i)=>{
    if(l.st.press&&!l.st.test&&(l.wp?Math.round(l.wp*1.5):0)===tp)State.ws.testSel[i]=val;
  });
  render();
}
function wsTestBatch(id,tp){
  const f=folder(id);
  const sel=State.ws.testSel||{};
  const batch=f.lines.map((l,i)=>({l,i})).filter(x=>x.l.st.press&&!x.l.st.test
    &&(x.l.wp?Math.round(x.l.wp*1.5):0)===tp&&sel[x.i]!==false);
  if(!batch.length)return;
  const by=State.user.replace("Verksted – ",""),at=now();
  batch.forEach(x=>x.l.st.test={by,at});
  addLog(f,`Trykktest utført i pulje: ${batch.length} slange${batch.length===1?"":"r"} ved ${tp} bar (1,5 × WP, 10 min holdetid) – godkjent av ${by}`);
  State.ws.testSel={};
  render();
}

/* --- RENS / PRESSING / TRYKKTEST: felles liste per operasjon --- */

      ${waiting?`<div class="t-note">+ ${waiting} venter på ${prev.label.toLowerCase()}</div>`:""}</div>
    <div class="tile" style="display:flex;flex-direction:column;justify-content:center;gap:8px">
      <label style="font-size:13.5px"><input type="checkbox" ${State.ws.onlyRemaining?"checked":""} onchange="State.ws.onlyRemaining=this.checked;render()"> Vis kun gjenstående</label>
      ${key==="clean"&&todo.length?`<button class="btn btn-primary" onclick="wsStageAll('${f.id}','clean')">🧼 Merk alle ${todo.length} som renset</button>`:""}
    </div>

  ${done===eligible.length&&eligible.length===f.lines.length?(()=>{

    return `<div class="vitem v-good" style="align-items:center">✅ <div><b>Alle ${f.lines.length} slanger er ${s.verb}.</b>${nxs?` Neste operasjon: ${nxs.icon} ${nxs.label}.`:allDoneF?" Mappen er klar for spot-check.":" Venter på oppstrøms operasjoner."}</div>
    <span class="fix">${nxs?`<button class="btn btn-good" onclick="State.ws.stage='${nxs.key}';render()">➡️ Gå videre</button>`
      :allDoneF?`<button class="btn btn-good" onclick="wsStartQC('${f.id}')">🔍 Start spot-check</button>`
      :`<button class="btn btn-good" onclick="State.ws.stage=null;render()">➡️ Til oversikten</button>`}</span></div>`})():""}
  <div class="tblwrap"><table>
    <tr><th>POS</th><th>Maskin</th><th>PTS ID</th><th>Hose</th><th>Kutt</th>${key==="press"?"<th>Coupling 1</th><th>Coupling 2</th>":""}${key==="test"?"<th>WP</th><th style='color:var(--info)'>Testtrykk</th>":""}<th>${s.label}</th></tr>
    ${rows.map(({l,i})=>{

        <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><div style="width:150px">${hoseThumb(l.hose)}</div>
        <b class="mono" style="font-size:15px">${l.hose}</b><span style="color:var(--muted);font-size:12px">${(SERIES_STYLE[seriesOf(l.hose)]||{}).desc||""}</span>

      <td><span class="photo-mini" style="width:64px;height:48px"><img src="${cplImgURL(l.c2)}" loading="lazy" alt="" style="transform:scaleX(${(MASTER.couplings[l.c2]||{}).imgHoseEnd==="right"?-1:1})" onerror="this.parentElement.style.display='none'"></span><div class="mono" style="font-size:11px">${esc(l.c2)}<span style="color:var(--muted)"> · ${cplLabel(l.c2)}</span></div></td>`:""}
      ${key==="test"?`<td class="mono">${l.wp?l.wp+" bar":"–"}</td><td class="mono" style="font-weight:800;font-size:16px;color:var(--info)">${l.wp?Math.round(l.wp*1.5)+" bar":"–"}</td>`:""}
      <td><button class="wsbtn ${l.st[key]?(key==="test"?"on-test":"on-prod"):""}" onclick="wsStage('${f.id}',${i},'${key}')">${l.st[key]?"✅ "+esc(l.st[key].by)+" · "+l.st[key].at:l.qty>1?`Bekreft ${s.verb} · alle ${l.qty} stk`:"Bekreft "+s.verb}</button></td>
    </tr>`}).join("")}
  </table></div>
  ${waiting&&!State.ws.onlyRemaining?`<div class="notice" style="margin-top:12px">⏳ ${waiting} slange${waiting===1?" er":"r er"} ikke ${prev.verb} ennå og vises derfor ikke i denne listen.</div>`:""}`;
}

/* --- stk-teller for kapping: ett trykk per kappet slange ---
   Ved antall > 1 kvitteres hvert enkelt kutt, med tydelig teller.
   Linjen fullføres automatisk når riktig antall er nådd – det er
   umulig å gå videre med feil antall. --- */
/* 🖨️ Tag-printeren på benken: taggen skrives ut I DET kuttet kvitteres –
   per stk ved +1-telleren, samlet ved enkel bekreftelse. Slangen tagges
   samtidig som den kappes; ingen egen kvittering trengs (spot-checken
   kontrollerer merkingen med en annen person). */
function logTagPrint(f,l,pieceId){
  const per=tagCountFor(l);
  if(pieceId){addLog(f,`🖨️ ${per===2?"2 tagger":"1 tag"} for ${pieceId} skrevet ut på benkeskriveren (${per===2?"én til hver ende – OAL ≥ 2000 mm":"kort slange: én tag"}) – fest på slangen nå`);return}
  const ids=ptsAll(l);
  const tot=ids.length*per;
  addLog(f,`🖨️ ${tot} tag${tot>1?"er":""} skrevet ut på benkeskriveren (simulert): ${ids.join(", ")}${per===2?" – én til hver ende (OAL ≥ 2000 mm)":""} – fest på slangen${ids.length>1?"e":""} nå`);
}
function wsCutPiece(id,idx,d){
  const f=folder(id),l=f.lines[idx];
  if(l.st.cut||missingMeasures(l).length)return null;
  const qty=l.qty||1, before=l.cutN||0;
  l.cutN=Math.max(0,Math.min(qty,before+d));
  if(l.cutN===before)return null;
  const ids=ptsAll(l);
  if(d>0){addLog(f,`${ids[l.cutN-1]||l.pts||"(uten ID)"} kappet (${l.cutN} av ${qty} på POS ${l.pos||"–"})`);
    logTagPrint(f,l,ids[l.cutN-1]||l.pts);
    State.ws.lastConfirm={key:"cut",pos:l.pos,pts:ids[l.cutN-1]||l.pts,at:now(),by:State.user.replace("Verksted – ",""),what:`kappet ${l.cutN} av ${qty}`};}
  else addLog(f,`POS ${l.pos||"–"}: kappeteller justert ned til ${l.cutN} av ${qty}`);
  if(l.cutN===qty){
    l.st.cut={by:State.user.replace("Verksted – ",""),at:now()};
    addLog(f,`${l.pts} ferdig kappet og tagget – riktig antall bekreftet (${qty} stk)`);
    return "done";
  }
  return "inc";
}
function wsCutPieceT(id,idx,d){wsCutPiece(id,idx,d);render()}          /* PC-tabellen */
function wsCutPieceF(id,idx,pos,d){                                     /* touch-fokus */
  const r=wsCutPiece(id,idx,d);
  if(r==="done")wsFocusAdvance(folder(id),"cut",pos);
  if(typeof navigator!=="undefined"&&navigator.vibrate)try{navigator.vibrate(r==="done"?60:20)}catch(e){}
  render();
}

/* --- bekreftelser --- */
function wsStage(id,idx,key){
  const f=folder(id),l=f.lines[idx];
  const prev=prevStage(key);
  if(prev&&!l.st[prev.key])return;                 // rekkefølgen håndheves per slange
  if(key==="cut"&&!l.st.cut&&missingMeasures(l).length)return; // port: kutt uten mål kan ikke bekreftes
  if(key==="cut"&&!l.st.cut&&(l.qty||1)>1&&(l.cutN||0)<(l.qty||1))return; // port: antall>1 kvitteres stk for stk (teller)
  const s=stageDef(key);
  if(l.st[key]){
    l.st[key]=null;
    if(key==="cut")l.cutN=0; // ny telling ved angret kapping
    // fjernes et steg, fjernes også stegene etter (kan ikke være testet uten å være presset)
    let after=false;
    STAGES.forEach(x=>{if(x.key===key)after=true;else if(after)l.st[x.key]=null});
    addLog(f,`${l.pts}: ${s.verb}-bekreftelse fjernet`);
  }else{
    l.st[key]={by:State.user.replace("Verksted – ",""),at:now()};
    if(key==="cut")logTagPrint(f,l);
    addLog(f,`${l.pts} bekreftet ${s.verb}`);
    State.ws.lastConfirm={key,pos:l.pos,pts:l.pts,at:l.st[key].at,by:l.st[key].by,what:s.verb};
  }
  if(f.status==="prod"&&stageCount(f,"press")===f.lines.length){f.status="test";addLog(f,"Alle slanger presset – status endret til Trykktest")}
  if(f.status==="test"&&stageCount(f,"press")<f.lines.length)f.status="prod";
  render();
}
function wsStageAll(id,key){
  const f=folder(id),prev=prevStage(key),s=stageDef(key);
  let c=0;
  f.lines.forEach(l=>{
    if((!prev||l.st[prev.key])&&!l.st[key]){l.st[key]={by:State.user.replace("Verksted – ",""),at:now()};c++}
  });
  addLog(f,`${c} slanger bekreftet ${s.verb} (samlet bekreftelse)`);
  render();
}
function wsStartQC(id){
  const f=folder(id);
  if(!STAGES.every(st=>stageCount(f,st.key)===f.lines.length))return;
  if(!f.spot)f.spot=buildSpotCheck(f);
  f.status="qc";
  State.ws.stage="qc";
  addLog(f,`Alle operasjoner utført – spot-check startet (${f.spot.items.length} slanger i utvalget)`);
  render();
}
function qcSet(id,idx,result){
  const f=folder(id),it=f.spot.items[idx],l=f.lines[it.i];
  const me=State.user.replace("Verksted – ","");
  if(l.st.test&&l.st.test.by===me){
    it.blockMsg=`Annenhåndskontroll: ${me} trykktestet denne slangen selv og kan ikke kontrollere den. Bytt bruker øverst.`;
    render();return;
  }
  it.blockMsg=null;
  if(it.result===result){it.result=null;it.by=null;it.at=null}
  else{it.result=result;it.by=State.user;it.at=now();
    addLog(f,`Spot-check ${l.pts}: ${result==="ok"?"OK":"AVVIK"}${result==="avvik"&&it.comment?" – "+it.comment:""}`);}
  render();
}
function qcComment(id,idx,val){folder(id).spot.items[idx].comment=val}
function wsCompleteQC(id){
  const f=folder(id);
  if(!spotDone(f))return;
  autoClockStop(id,"mappen fullført");
  f.spot.completedAt=now();
  f.status="ferdig";
  State.ws.stage="prints";
  addLog(f,"Spot-check godkjent – mappen er fullført. Trykktestsertifikat, pallemerkelapp og spot-check-rapport er klare for utskrift.");
  render();
}

/* =====================================================================
   TOUCH-/iPad-FOKUS: én slange om gangen, store knapper, auto-videre
   ===================================================================== */
function wsFocusQueue(f,key){
  const prev=prevStage(key);
  let q=f.lines.map((l,i)=>({l,i})).filter(x=>!prev||x.l.st[prev.key]);
  if(key==="cut")q=q.filter(x=>x.l.hose===State.ws.hoseType).sort((a,b)=>(b.l.cut||0)-(a.l.cut||0));
  else if(key==="press")q.sort((a,b)=>(a.l.hose+"").localeCompare(b.l.hose)||(b.l.cut||0)-(a.l.cut||0));
  else if(key==="test")q.sort((a,b)=>(b.l.wp||0)-(a.l.wp||0));
  else q.sort((a,b)=>(b.l.cut||0)-(a.l.cut||0));
  return q;
}
function wsFocusAdvance(f,key,fromPos){
  const q=wsFocusQueue(f,key);
  if(!q.length)return;
  const cur=q[fromPos]?q[fromPos].l:null;
  if(cur&&key!=="cut"){
    /* 1) hold deg på SAMME slangetype til den er ferdig */
    for(let k=1;k<=q.length;k++){
      const p=(fromPos+k)%q.length;
      if(!q[p].l.st[key]&&q[p].l.hose===cur.hose){State.ws.focusPos=p;return}
    }
    /* 2) typen er ferdig for dette steget – gjenstår andre typer? → valg */
    if(q.some(x=>!x.l.st[key])){
      State.ws.typeChoice={key,hose:cur.hose};
      State.ws.focusPos=fromPos;
      return;
    }
  }
  for(let k=1;k<=q.length;k++){
    const p=(fromPos+k)%q.length;
    if(!q[p].l.st[key]){State.ws.focusPos=p;return}
  }
  State.ws.focusPos=fromPos; // ingen gjenstående – done-kortet vises
}
/* Type-valget: fortsett med typen til neste prosess, eller ta neste type her */
function wsTypeGo(id,hose,nextKey){
  State.ws.typeChoice=null;State.ws.stage=nextKey;State.ws.focusPos=-1;
  if(nextKey==="cut")State.ws.hoseType=hose;
  const f=folder(id);
  if(!["clean","test","pres"].includes(nextKey)){
    const q=wsFocusQueue(f,nextKey);
    const p=q.findIndex(x=>!x.l.st[nextKey]&&x.l.hose===hose);
    if(p>=0)State.ws.focusPos=p;
  }
  render();
}
function wsTypeStay(id,key,hose){
  State.ws.typeChoice=null;
  const q=wsFocusQueue(folder(id),key);
  const p=q.findIndex(x=>!x.l.st[key]&&x.l.hose===hose);
  if(p>=0)State.ws.focusPos=p;
  render();
}
function wsFocusConfirm(id,idx,key,pos){
  const f=folder(id);
  const wasDone=!!f.lines[idx].st[key];
  wsStage(id,idx,key);
  if(!wasDone)wsFocusAdvance(f,key,pos);
  if(typeof navigator!=="undefined"&&navigator.vibrate)try{navigator.vibrate(30)}catch(e){}
  render();
}

function wsFocus(f,key){
  const s=stageDef(key), prev=prevStage(key);
  const q=wsFocusQueue(f,key);
  const total=q.length, done=q.filter(x=>x.l.st[key]).length;
  const waiting=prev?f.lines.filter(l=>!l.st[prev.key]).length:0;
  const header=`
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <h1 style="font-size:23px">${s.icon} ${s.label}${key==="cut"?` · <span class="mono">${esc(State.ws.hoseType)}</span>`:""} <span class="mono" style="font-size:12px;color:var(--muted)">${f.id}</span></h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${wsModeBtn()}
      ${key==="cut"?`<button class="btn btn-ghost" onclick="State.ws.hoseType=null;render()">↩︎ Slangetyper</button>`:""}
      <button class="btn btn-ghost" onclick="State.ws.stage=null;render()">↩︎ Operasjoner</button>
    </div>
  </div>`;

  const tc=State.ws.typeChoice;
  if(tc&&tc.key===key){
    const nx=STAGES[STAGES.findIndex(x=>x.key===key)+1];
    const undone=q.filter(x=>!x.l.st[key]);
    const nextHose=undone.length?undone[0].l.hose:null;
    const nleft=nextHose?undone.filter(x=>x.l.hose===nextHose).length:0;
    return header+`<div class="focus-wrap"><div class="focus-card donecard">
      <div class="big">✅</div>
      <div style="font-size:21px;font-weight:700">Alle ${esc(tc.hose)} er ${s.verb}!</div>
      <div class="sub" style="margin-top:4px">Hva vil du gjøre nå?</div>
      ${nx?`<button class="bigbtn confirm" onclick="wsTypeGo('${f.id}','${esc(tc.hose)}','${nx.key}')">➡️ Fortsett med ${esc(tc.hose)} → ${nx.icon} ${nx.label}</button>`:""}
      ${nextHose?`<button class="bigbtn next" onclick="wsTypeStay('${f.id}','${key}','${esc(nextHose)}')">${s.icon} ${s.label} neste type: ${esc(nextHose)} (${nleft} igjen)</button>
        <div style="margin-top:10px;display:flex;justify-content:center">${hoseThumb(nextHose)}</div>`:""}
      <button class="bigbtn ghostb" onclick="State.ws.typeChoice=null;State.ws.stage=null;render()">Til operasjonene</button>
    </div></div>`;
  }
  if(total===0)return header+`<div class="focus-wrap"><div class="focus-card donecard">
    <div class="big">⏳</div><div style="font-size:19px">Ingen slanger er klare for ${s.label.toLowerCase()} ennå${prev?` – ${waiting} venter på ${prev.label.toLowerCase()}`:""}.</div>
    <button class="bigbtn next" onclick="State.ws.stage=${prev?`'${prev.key}'`:"null"};State.ws.focusPos=-1;render()">Gå til ${prev?prev.icon+" "+prev.label:"operasjonene"}</button>
  </div></div>`;

  /* alle i køen ferdig? -> done-kort med stor «videre»-knapp */
  if(done===total){
    let nextBtn="";
    if(key==="cut"){
      const next=wsNextType(f,State.ws.hoseType,"cut");
      nextBtn=`
        <button class="bigbtn confirm" onclick="State.ws.stage='clean';State.ws.focusPos=-1;render()">➡️ Fortsett med ${esc(State.ws.hoseType)} → 🧼 Rens (UC)</button>
        ${next?`<button class="bigbtn next" onclick="State.ws.hoseType='${esc(next.hose)}';State.ws.focusPos=-1;render()">✂️ Kapp neste slangetype: ${esc(next.hose)} (${next.items.length-next.done} igjen)</button>
          <div style="margin-top:10px;display:flex;justify-content:center">${hoseThumb(next.hose)}</div>`:""}`;
    }else if(key!=="test"){
      const nx=STAGES[STAGES.findIndex(x=>x.key===key)+1];
      const allDoneF=STAGES.every(st=>stageCount(f,st.key)===f.lines.length);
      nextBtn=!nx
        ?(allDoneF
          ?`<button class="bigbtn confirm" onclick="wsStartQC('${f.id}')">🔍 Alt pakket – start spot-check (annenhåndskontroll)</button>`
          :`<button class="bigbtn ghostb" onclick="State.ws.stage=null;render()">Alt pakket her – noe venter oppstrøms, til oversikten</button>`)
        :stageCount(f,key)===f.lines.length
        ?`<button class="bigbtn next" onclick="State.ws.stage='${nx.key}';State.ws.focusPos=-1;render()">➡️ Gå til ${nx.icon} ${nx.label}</button>`
        :`<button class="bigbtn ghostb" onclick="State.ws.stage=null;render()">${waiting} slanger venter fortsatt på ${prev.label.toLowerCase()} – til oversikten</button>`;
    }else{
      nextBtn=stageCount(f,"test")===f.lines.length
        ?`<button class="bigbtn confirm" onclick="wsStartQC('${f.id}')">🔍 Start spot-check (annenhåndskontroll)</button>`
        :`<button class="bigbtn ghostb" onclick="State.ws.stage=null;render()">Til operasjonene (${waiting} venter oppstrøms)</button>`;
    }
    return header+`<div class="focus-wrap"><div class="focus-card donecard">
      <div class="big">🎉</div>
      <div style="font-size:21px;font-weight:700">Alle ${total} ${key==="cut"?"av "+esc(State.ws.hoseType):"klare slanger"} er ${s.verb}!</div>
      ${nextBtn}
    </div></div>`;
  }

  let pos=State.ws.focusPos;
  if(pos<0||pos>=total||q[pos]===undefined)pos=Math.max(0,q.findIndex(x=>!x.l.st[key]));
  State.ws.focusPos=pos;
  const {l,i}=q[pos];
  const doneThis=!!l.st[key];
  const stStyle=SERIES_STYLE[seriesOf(l.hose)]||{color:"var(--border2)"};

  const mmCut = key==="cut"?missingMeasures(l):[];
  const main = key==="cut" ? (mmCut.length
      ? `<div class="focus-main" style="color:var(--warn);font-size:clamp(28px,5vw,44px)">📏 MÅL MANGLER</div>
         <div class="focus-sub">Kuttemålet kan ikke beregnes før målet er målt og lagt inn under</div>
         ${measurePanel([l],f.id,l.pts)}`
      : `<div class="focus-main" style="color:var(--accent2)">${fmtCut(l)}</div><div class="focus-sub">KUTTEMÅL · kontroller mot tegningen over${l.qty>1?` · <b style="color:var(--warn)">KAPP ${l.qty} STK</b>`:""} · 🏷️ ${tagCountFor(l)===2?"<b>2 tagger/slange</b> (én per ende, OAL ≥ 2000)":"1 tag/slange"}</div>`)
    : key==="pres" ? `<div class="focus-main" style="font-size:clamp(34px,6vw,54px)">🛡️ Preservering</div><div class="focus-sub">Sett på krympehetter/plugger i begge ender${(l.qty||1)>1?` – alle ${l.qty} stk`:""}</div>`
    : key==="pack" ? `<div class="focus-main" style="font-size:clamp(34px,6vw,54px)">📦 Pakking</div><div class="focus-sub">Legg slangen${(l.qty||1)>1?"e ("+l.qty+" stk)":""} i kassen/pallen – kontroller POS ${esc(l.pos||"–")} mot pakklisten</div>`
    : key==="clean" ? `<div class="focus-main" style="font-size:clamp(34px,6vw,54px)">🧼 ${esc(l.pts)}</div><div class="focus-sub">Rens innvendig og sett UC-propper i begge ender</div>`
    : key==="press" ? (()=>{const c=crimpFor(l.hose);
        return `<div class="focus-main mono press-cpl" style="font-size:clamp(26px,4vw,40px);line-height:1.25">${esc(l.c1)}<span class="cplsep"></span>${esc(l.c2)}</div>
        ${c?`<div style="margin-top:12px;border:2.5px solid var(--info);border-radius:16px;padding:12px 16px;background:var(--info-bg)">
          <div style="font-size:12px;letter-spacing:1px;color:var(--muted);font-weight:700">PRESSMÅL (${esc(c.series)}, ${esc(c.die)}) · CrimpSource Adjustable crimper</div>
          <div style="font-family:var(--head);font-weight:800;font-size:clamp(34px,6vw,56px);color:var(--info);line-height:1.1">Ø ${fmtMM(c.od)} mm</div>
          <div style="font-size:clamp(16px,2.5vw,22px);font-weight:700">Toleranse: <span class="mono">${crimpRange(c)}</span></div>
          <div class="focus-sub crimp-note" style="margin-top:4px">Mål pressdiameteren med mikrometer etter pressing – den skal ligge innenfor båndet</div>
        </div>`
        :`<div class="vitem v-warn" style="margin-top:12px">📖 <div><b>Pressmål mangler i masterdata for ${esc(l.hose)}.</b> Slå opp i <a href="${CRIMPSOURCE_URL}" target="_blank" rel="noopener" style="color:var(--accent2)">Parker CrimpSource (Adjustable crimper)</a> og legg verdien inn i masterdatabasen.</div></div>`}
        <div class="focus-sub press-note" style="margin-top:8px">KOBLING 1 / KOBLING 2 · kontroller pressinnstilling for ${esc(l.hose)}</div>`})()
    : `<div class="focus-main" style="color:var(--info)">${l.wp?Math.round(l.wp*1.5)+" bar":"–"}</div><div class="focus-sub">TESTTRYKK (1,5 × WP ${l.wp||"–"} bar) · holdetid 10 min</div>`;

  const rail=`<div class="qrail">${q.map((x,p)=>{
    const dn=!!x.l.st[key];
    return `<button class="qcard ${dn?"done":""} ${p===pos?"cur":""}" onclick="State.ws.typeChoice=null;State.ws.focusPos=${p};render()" title="POS ${esc(x.l.pos||"–")} · ${esc(x.l.pts)}">
      <div class="qpos">${esc(x.l.pos||"–")}</div>
      <div class="qpts">${esc(x.l.pts)}</div>
      <div class="qst">${dn?`✓ ${(x.l.st[key].at||"").split(" ")[1]||x.l.st[key].at}`
        :key==="cut"&&(x.l.cutN||0)>0?`${p===pos?"◉ ":""}✂ ${x.l.cutN}/${x.l.qty}`
        :p===pos?"◉ NÅ"
        :x.l.qty>1?`${x.l.qty} stk`:"venter"}</div>
    </button>`}).join("")}</div>`;
  const lc=State.ws.lastConfirm;
  const lastLine=lc&&lc.key===key?`<div class="lastconfirm">✅ Sist: POS ${esc(lc.pos||"–")} ${esc(lc.what)} kl. ${(lc.at||"").split(" ")[1]||lc.at} av ${esc(lc.by)}</div>`:"";
  return header+`
  <div class="focus-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 2px;gap:12px">
      <span style="font-size:15px;font-weight:700">${s.verb.charAt(0).toUpperCase()+s.verb.slice(1)}: ${done} av ${total}</span>
      <div class="meter" style="flex:1;max-width:340px"><div style="width:${Math.round(100*done/total)}%"></div></div>
      ${waiting?`<span style="font-size:12px;color:var(--muted)">+${waiting} venter oppstrøms</span>`:""}
    </div>
    ${rail}
    <div class="focus-card" style="border-left:10px solid ${stStyle.color}">
      ${(()=>{ /* iPad: liggende = to kolonner (POS+foto venstre, mål+knapp høyre); stående = én kolonne */
        const photoHtml=key==="cut"?hosePhotoPanel(l,{arrow:true}):key==="clean"?hosePhotoPanel(l,{plugs:true}):photoAssembly(l);
        const metaHtml=`<div class="focus-meta">
          <div class="fm"><b>${l.cut?fmtCut(l):(missingMeasures(l).length?"📏":"–")}</b><span>Kutt</span></div>
          <div class="fm"><b>${l.qty>1?`<span style="color:var(--warn)">✕ ${l.qty} STK</span>`:"1 stk"}</b><span>Antall</span></div>
          <div class="fm"><b>${esc(l.len)} mm</b><span>Lengde (OAL)</span></div>
          <div class="fm"><b>${l.wp?l.wp+" bar":"–"}</b><span>WP</span></div>
          ${key!=="press"?`<div class="fm"><b class="mono" style="font-size:14px">${esc(l.c1)}<br>${esc(l.c2)}</b><span>Koblinger</span></div>`
            :(()=>{const c=crimpFor(l.hose);return c?`<div class="fm"><b style="color:var(--info)">Ø ${fmtMM(c.od)}</b><span>Pressmål (±${fmtMM(c.tol)})</span></div>`:""})()}
        </div>`;
        const actionsHtml=doneThis
          ?`<button class="bigbtn confirm" disabled style="opacity:.85">✅ ${s.verb.toUpperCase()} · ${esc(l.st[key].by)} · ${l.st[key].at}${key==="cut"&&l.qty>1?` · ${l.qty} STK`:""}</button>
            <button class="bigbtn undo" onclick="wsFocusConfirm('${f.id}',${i},'${key}',${pos})">↩︎ Angre bekreftelsen</button>`
          :mmCut.length
          ?`<button class="bigbtn confirm" disabled style="opacity:.45">🔒 LEGG INN ${mmCut.map(m=>m.label.toUpperCase()).join(" + ")} FØRST</button>`
          :key==="cut"&&l.qty>1
          ?`<div class="cutcount">
              <div class="ccnum"><b>${l.cutN||0}</b><span>av ${l.qty}</span><div class="cclabel">KAPPET</div></div>
              <button class="bigbtn confirm" style="margin-top:0;flex:1" onclick="wsCutPieceF('${f.id}',${i},${pos},1)">✂️ KAPPET +1 · 🏷️ ${tagCountFor(l)===2?"2 tagger":"tag"} skrives ut</button>
              <button class="ccminus" title="Juster ned (feiltelling)" ${l.cutN?"":"disabled"} onclick="wsCutPieceF('${f.id}',${i},${pos},-1)">−1</button>
            </div>
            <div class="pieces">${Array.from({length:l.qty},(_,k)=>`<span class="piece ${k<(l.cutN||0)?"done":""}" title="${esc(ptsAll(l)[k]||"")}"></span>`).join("")}</div>
            <div class="focus-sub" style="text-align:center;margin-top:8px">${(l.cutN||0)<l.qty?`Neste kutt kvitteres på <b class="mono">PTS ${esc(ptsAll(l)[l.cutN||0]||"–")}</b> – taggen skrives ut i det du trykker +1, fest den med en gang · `:""}linjen fullføres ved ${l.qty} av ${l.qty}</div>`
          :`<button class="bigbtn confirm" onclick="wsFocusConfirm('${f.id}',${i},'${key}',${pos})">${key==="cut"?"✂️ BEKREFT KAPPET + 🏷️ TAG PÅ":s.icon+" BEKREFT "+s.verb.toUpperCase()}</button>`;
        return State.touch
          ?`<div class="fc-grid">
              <div class="fc-pos">${posBlock(l,f)}</div>
              <div class="fc-maincol"><div style="margin-top:2px">${main}</div>${metaHtml}</div>
              <div class="fc-act">${actionsHtml}</div>
              <div class="fc-photo2">${photoHtml}</div>
            </div>`
          :`<div style="display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap">
              <div style="flex:1;min-width:300px">${photoHtml}</div>
              ${posBlock(l,f)}
            </div>
            <div style="margin-top:14px">${main}</div>
            ${metaHtml}
            ${actionsHtml}`})()}
    </div>
    ${lastLine}
    <div class="focus-nav">
      <button class="navarrow" ${pos===0?"disabled":""} onclick="State.ws.typeChoice=null;State.ws.focusPos=${pos-1};render()">◀</button>
      <span style="font-size:14.5px;color:var(--muted);font-weight:700">Slange ${pos+1} av ${total} · trykk et kort i rekken over for å hoppe</span>
      <button class="navarrow" ${pos===total-1?"disabled":""} onclick="State.ws.typeChoice=null;State.ws.focusPos=${pos+1};render()">▶</button>
    </div>
    ${key==="clean"&&total-done>1?`<button class="bigbtn ghostb" onclick="wsStageAll('${f.id}','clean')">🧼 Merk alle ${total-done} gjenstående som renset</button>`:""}
  </div>`;
}

/* =====================================================================
   SPOT-CHECK (annenhåndskontroll) + UTSKRIFTER
   ===================================================================== */
function vQC(f){
  const sp=f.spot;
  const answered=sp.items.filter(x=>x.result).length;
  const oks=sp.items.filter(x=>x.result==="ok").length;
  const avvik=sp.items.filter(x=>x.result==="avvik");
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <h1 style="font-size:23px">🔍 Spot-check – ${esc(f.title)} <span class="mono" style="font-size:12px;color:var(--muted)">${f.id}</span></h1>
    <button class="btn btn-ghost" onclick="wsLeaveFolder()">↩︎ Verkstedsmodus</button>
  </div>
  <div class="notice">🔍 <div><b>Annenhåndskontroll:</b> ${sp.items.length} av ${f.lines.length} slanger er trukket ut (minst én per slangetype).
  Kontrollen må utføres av en <b>annen person</b> enn den som trykktestet slangen – systemet håndhever dette.
  Kontrollpunkter per slange: mål kuttlengde/OAL, riktige koblinger mot listen, merking/tag, renhet og UC-propper. Innlogget: <b>${esc(State.user)}</b></div></div>
  <div class="cardrow">
    <div class="tile"><div class="t-label">Kontrollert</div><div class="t-value">${answered} / ${sp.items.length}</div><div class="meter m-good"><div style="width:${Math.round(100*oks/sp.items.length)}%"></div></div></div>
    ${avvik.length?`<div class="tile" style="border-color:var(--bad)"><div class="t-label">⛔ Avvik</div><div class="t-value" style="color:var(--bad)">${avvik.length}</div><div class="t-note">må løses og re-kontrolleres</div></div>`:""}
  </div>
  ${sp.items.map((it,idx)=>{
    const l=f.lines[it.i];
    return `<div class="qc-card ${it.result==="ok"?"ok":it.result==="avvik"?"avvik":""}">
      <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
        <div style="width:380px;flex-shrink:0">${photoAssembly(l,true)}</div>
        <div style="flex:1;min-width:220px">
          <span class="mono" style="font-size:20px;font-weight:800;color:var(--accent2)">POS ${esc(l.pos||"–")}</span>
          <span style="font-size:13px;font-weight:700"> · Maskin ${esc(l.mach||"–")}</span>
          <span style="color:var(--muted);font-size:12.5px"> · PTS ${esc(l.pts)} · ${esc(l.hose)}</span><br>
          <span style="font-size:13px">Kutt <b class="mono">${fmtCut(l)}</b> · OAL <b class="mono">${esc(l.len)} mm</b> · <span class="mono">${esc(l.c1)} / ${esc(l.c2)}</span></span><br>
          <span style="font-size:11.5px;color:var(--muted)">Trykktestet av ${l.st.test?esc(l.st.test.by)+" · "+l.st.test.at:"–"}</span>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="qc-btn ${it.result==="ok"?"ok-on":""}" onclick="qcSet('${f.id}',${idx},'ok')">✔ OK</button>
          <button class="qc-btn ${it.result==="avvik"?"avvik-on":""}" onclick="qcSet('${f.id}',${idx},'avvik')">⚠ AVVIK</button>
        </div>
      </div>
      ${it.result?`<div style="margin-top:8px;font-size:12px;color:var(--muted)">Signert: ${esc(it.by)} · ${it.at}</div>`:""}
      ${it.result==="avvik"?`<div style="margin-top:8px"><input style="width:100%;background:var(--surface2);border:1px solid var(--bad);border-radius:8px;color:var(--text);padding:9px 12px" placeholder="Beskriv avviket (påkrevd) …" value="${esc(it.comment)}" onchange="qcComment('${f.id}',${idx},this.value)"></div>`:""}
      ${it.blockMsg?`<div class="vitem v-bad" style="margin-top:8px">⛔ <div>${esc(it.blockMsg)}</div></div>`:""}
    </div>`}).join("")}
  <div style="margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    ${spotDone(f)?`<button class="btn btn-good btn-big wsbig" onclick="wsCompleteQC('${f.id}')">✅ Godkjenn spot-check og fullfør mappen</button>`
    :`<span class="gatemsg">🔒 Alle ${sp.items.length} kontrollene må være OK før mappen kan fullføres${avvik.length?" – løs avvikene og kontroller på nytt":""}</span>`}
  </div>`;
}

/* --- selve utskriftsvisningen (alt annet skjules ved print) --- */
function vPrintDoc(){
  const f=folder(State.printDoc.fid);
  const kind=State.printDoc.kind;
  const doc = kind==="pallet"?palletHTML(f) : kind==="spot"?spotHTML(f) : kind==="quote"?quoteHTML(f) : kind==="telaris"?telarisHTML(f) : testCertHTML(f);
  return `
  <div class="print-toolbar noprint">
    <button class="btn btn-primary" onclick="window.print()">🖨️ Skriv ut</button>
    <button class="btn btn-ghost" onclick="State.printDoc=null;render()">✕ Lukk</button>
    <span style="color:var(--muted);font-size:12.5px">Utskriften inneholder kun dokumentet – app-rammen skjules automatisk.</span>
  </div>
  ${doc}`;
}

function testCertHTML(f){
  const testers=[...new Set(f.lines.filter(l=>l.st.test).map(l=>l.st.test.by))].join(", ");
  const dnv=dnvForFolder(f),aom=dnv.aom;
  return `<div class="docpreview">
    <h4>PRESSURE TEST CERTIFICATE</h4>
    <div style="color:#555;margin-bottom:2px">Global Onsite AS, Birkeland, Norway · ${esc(f.id)} · ${esc(f.title)}</div>
    <div style="color:#555;margin-bottom:6px">PMOTION project: ${esc(f.project||"–")} · Order/PO: ${esc(f.po||"–")} · Test medium: water · Hold time: 10 min</div>
    <div style="border:1.5px solid #333;border-radius:8px;padding:8px 12px;margin-bottom:10px">
      <b>DNV references (per Approval of Manufacturer, production testing clause):</b><br>
      Each hose assembly is hydraulic pressure tested to 1.5 × maximum working pressure before delivery.<br>
      DNV Approval of Manufacturer: <b>${esc(DNV.aom.no)}</b> – ${esc(DNV.aom.desc)} (${esc(DNV.aom.program)}) · valid until ${esc(DNV.aom.validUntil)}${aom.expired?' <b style="color:#b91c1c">– EXPIRED</b>':aom.soon?' <b style="color:#b45309">– renewal due</b>':""}<br>
      DNV Type Approval per hose type: ${dnv.rows.map(r=>`${esc(r.hose)} → ${r.cert?`<b>${esc(r.cert.no)}</b> (valid until ${r.cert.validUntil}${r.cert.expired?' – <b style="color:#b91c1c">EXPIRED</b>':""})`:'<b style="color:#b91c1c">no type approval</b>'}`).join(" · ")}
    </div>
    ${(dnv.missing||dnv.expired||aom.expired)?`<div style="border:1.5px solid #b45309;background:#fdf3e3;border-radius:8px;padding:8px 12px;margin-bottom:10px;color:#7a4a06">
      <b>NOTE:</b> Items marked above lack a valid DNV type approval${aom.expired?" and/or the AoM certificate has expired":""}. For DNV deliveries, this certificate is only valid as DNV-referenced documentation for items covered by valid certificates.</div>`:""}
    <table><tr><th>Line</th><th>POS</th><th>Machine</th><th>PTS ID</th><th>Hose</th><th>OAL (mm)</th><th>WP (bar)</th><th>TP 1.5×WP</th><th>DNV TAP</th><th>Result</th><th>Log</th><th>Tested by</th><th>Date</th></tr>
    ${(()=>{let n=0;return f.lines.flatMap(l=>{const ids=ptsAll(l),q=l.qty||1,c=dnvCertFor(l.hose);
      return Array.from({length:q},(_,k)=>{n++;
        return `<tr><td>${n}</td><td><b>${esc(l.pos||"–")}</b>${q>1?` <span style="color:#777">(${k+1}/${q})</span>`:""}</td><td>${esc(l.mach||"–")}</td><td>${esc(ids[k]||"(pending)")}</td><td>${esc(l.hose)}</td><td>${esc(l.len)}</td><td>${l.wp||"–"}</td><td>${l.wp?Math.round(l.wp*1.5):"–"}</td>
        <td>${c?esc(c.no)+(c.expired?' <b style="color:#b91c1c">EXP.</b>':""):"–"}</td>
        <td>${l.st.test?"<b>PASSED</b>":""}</td><td>${l.st.test?(l.st.test.log?l.st.test.log:"manual"):""}</td><td>${l.st.test?esc(l.st.test.by):""}</td><td>${l.st.test?l.st.test.at:""}</td></tr>`})}).join("")})()}</table>
    <div style="margin-top:16px;color:#333">Tested by: <b>${esc(testers)}</b> &nbsp;·&nbsp; Spot check approved: <b>${f.spot&&f.spot.completedAt?f.spot.completedAt:"–"}</b> &nbsp;·&nbsp; Approved (sign): ______________</div>

   PRODUKSJONSPLAN – kapasitet og kalender
   ===================================================================== */
function planDays(nDays){
  const days=[];const d=new Date();
  while(days.length<(nDays||15)){
    if(d.getDay()!==0&&d.getDay()!==6){
      days.push({date:new Date(d),key:d.toISOString().slice(0,10),
        label:["sø","ma","ti","on","to","fr","lø"][d.getDay()]+" "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")});
    }
    d.setDate(d.getDate()+1);
  }
  return days;
}
function planFolders(){
  return State.folders
    .filter(f=>["klar","prod","test","qc"].includes(f.status)&&f.lines.length)
    .sort((a,b)=>{
      const pri=x=>x.status==="klar"?1:0;                 // pågående først
      if(pri(a)!==pri(b))return pri(a)-pri(b);
      return (a.plannedStart||"9999")<(b.plannedStart||"9999")?-1:1;
    });
}
function planSchedule(){
  const days=planDays(15);
  const cap=State.plan.fitters*State.plan.hoursPerDay;
  const used=days.map(()=>0);
  const rowsAlloc=[];
  let cursor=0;
  planFolders().forEach(f=>{
    let rem=remainingHours(f);
    const alloc={};
    let d=f.plannedStart?Math.max(days.findIndex(x=>x.key>=f.plannedStart),0):cursor;
    if(f.plannedStart&&days.findIndex(x=>x.key>=f.plannedStart)<0)d=days.length; // starter etter horisonten
    let overflow=0;
    while(rem>0.049){
      if(d>=days.length){overflow=rem;break}
      const avail=cap-used[d];
      if(avail<=0.049){d++;continue}
      const take=Math.min(avail,rem);
      alloc[d]=Math.round(take*10)/10;
      used[d]+=take;rem-=take;
      if(rem>0.049)d++;
    }
    cursor=Math.max(cursor,Math.min(d,days.length));
    rowsAlloc.push({f,alloc,overflow,doneDay:d});
  });
  return {days,cap,used,rowsAlloc};
}

    <h2 style="margin-top:0">Prøv denne runden (2 min)</h2>
    <p>1. Klikk <b>Ny produksjonsmappe</b> → fyll inn kunde (prosjekt er valgfritt).<br>
    2. I steg 2, klikk <b>Fyll med demodata</b> – kundens liste legges rett i det redigerbare rutenettet. Skriv i cellene som i Excel (med forslag fra masterdata), legg til/slett rader, eller lim inn flere rader. Merk: kundelister har ingen PTS-ID-er – kolonnen står på «hentes».<br>
    3. Se valideringen fange ekte feil (bl.a. tastefeilen «14948-18-8» fra dagens slangeliste!) og rett med ett klikk. Kuttemålene (CUT = Lengde − B1 − B2 − S-mål) regnes ut automatisk fra masterdata – samme formel som i Excel-arket, men uten formler som kan mangle eller bli ødelagt.<br>
    4. Generer dokumenter, og i siste steg: klikk <b>🔖 Hent PTS-ID-er til alle slangene</b> – systemet reserverer neste ledige ID-er i PTS-registeret. Lagre. I mappen følger du så prosessen slik den faktisk er: <b>⚙️ Opprett slangepakke i Telaris</b> (varenummer og BOM genereres automatisk) → <b>📤 Marker tilbud sendt fra Telaris</b> (tilbudet sendes på pakkevaren) → <b>📦 Registrer bestilling</b> når kunden bestiller. Portene håndhever rekkefølgen.<br>
    5. «Send til verksted», bytt bruker til <b>Verksted – Christian</b> øverst, åpne <b>Verkstedsmodus</b>. Tiden begynner å gå <b>automatisk</b> i det mappen åpnes i verkstedsmodus, og stopper når du forlater den – mappen viser løpende om dere er frempå, on track eller bakpå mot kalkylen. Trykk <b>⛶ Fullskjerm</b> (på iPad skjer det automatisk): menyen og topplinjen kollapses så hele skjermen brukes til arbeidet – bruker og avslutt-knapp ligger i en liten flytende linje øverst til høyre. Verkstedet følger benkens flyt i seks operasjoner: ✂️ Kapping + tag (taggen skrives ut per stk i det kuttet kvitteres og festes umiddelbart – idiotsikker identitet fra første sekund) → 🧼 Rens → 🔧 Pressing → 🧪 Trykktest → 🛡️ Preservering → 📦 Pakking. I Kapping velges slangetype fra kort med tegninger, så ingen kapper feil slange. Rens kvitteres med <b>én samlet kvittering</b> for alt som er kappet, og trykktesten kjøres i <b>puljer per testtrykk</b> – hak bort slanger som ikke får plass i benken, så blir de liggende til neste pulje. Koble til <b>ESI-sensoren</b> i trykktest-skjermen og trykk «Start logget trykktest»: hele forløpet logges med live kurve, holdetid-nedtelling og automatisk godkjent/avvik på trykkfall (prøv «Simuler lekkasje»!) – loggen havner rett i sertifikatet.<br>
    6. Når alle seks operasjonene er fullført: «Start spot-check» – annenhåndskontrollen der en annen person enn den som testet må godkjenne et utvalg (bytt bruker øverst for å se regelen håndheves).<br>
    7. Etter godkjent spot-check: skriv ut trykktestsertifikat, pallemerkelapp og spot-check-rapport fra utskriftspanelet.</p>
