<!DOCTYPE html>
<html lang="nb" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slangeproduksjon – Global Onsite · PMOTION-modul (prototype)</title>
<style>
:root{
  --bg:#0a0e1a;--surface:#111827;--surface2:#1a2235;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#f0f4ff;--muted:#8892a4;--accent:#3b82f6;--accent2:#60a5fa;
  --good:#34d399;--warn:#fbbf24;--bad:#f87171;--info:#67e8f9;
  --good-bg:rgba(52,211,153,.12);--warn-bg:rgba(251,191,36,.12);--bad-bg:rgba(248,113,113,.12);--info-bg:rgba(103,232,249,.10);
  --radius:12px;--font:Inter,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'DM Mono','Cascadia Mono',Consolas,monospace;
  --head:Syne,Inter,-apple-system,sans-serif;
}
[data-theme="light"]{
  --bg:#f0f4ff;--surface:#ffffff;--surface2:#f8faff;
  --border:rgba(0,0,0,0.08);--border2:rgba(0,0,0,0.15);
  --text:#111827;--muted:#6b7280;--accent:#2563eb;--accent2:#1d4ed8;
  --good:#047857;--warn:#b45309;--bad:#b91c1c;--info:#0e7490;
  --good-bg:rgba(4,120,87,.10);--warn-bg:rgba(180,83,9,.10);--bad-bg:rgba(185,28,28,.08);--info-bg:rgba(14,116,144,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5}
button{font-family:var(--font)}
.shell{display:flex;flex-direction:column;height:100vh}

/* ---------- topbar ---------- */
.topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--surface);border-bottom:1px solid var(--border);flex-shrink:0}
.topbar .logo{font-family:var(--head);font-weight:700;font-size:17px;letter-spacing:.4px;white-space:nowrap}
.topbar .logo span{color:var(--accent2)}
.badge-proto{background:var(--warn-bg);color:var(--warn);border:1px solid var(--warn);border-radius:20px;padding:2px 12px;font-size:11.5px;font-weight:600;white-space:nowrap}
.topbar .spacer{flex:1}
.userbox{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--muted)}
.userbox select{background:var(--surface2);color:var(--text);border:1px solid var(--border2);border-radius:8px;padding:4px 8px;font-size:12.5px}
.iconbtn{background:none;border:1px solid var(--border2);color:var(--text);border-radius:8px;padding:5px 10px;cursor:pointer;font-size:14px}
.iconbtn:hover{background:var(--surface2)}

/* ---------- layout ---------- */
.main{display:flex;flex:1;min-height:0}
.sidebar{width:222px;background:var(--surface);border-right:1px solid var(--border);padding:14px 10px;display:flex;flex-direction:column;gap:4px;flex-shrink:0;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500;border:none;background:none;width:100%;text-align:left;font-size:13.5px}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent);color:#fff}
.nav-sep{margin:10px 6px 4px;font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--muted)}
.content{flex:1;overflow-y:auto;padding:22px 26px}
h1{font-family:var(--head);font-size:21px;margin-bottom:4px}
h2{font-family:var(--head);font-size:16px;margin:18px 0 10px}
.sub{color:var(--muted);font-size:13px;margin-bottom:18px}

/* ---------- cards & tiles ---------- */
.cardrow{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:20px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 18px;min-width:150px;flex:1}
.tile .t-label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;margin-bottom:4px}
.tile .t-value{font-family:var(--head);font-size:26px;font-weight:700}
.tile .t-note{font-size:12px;color:var(--muted);margin-top:2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:16px}

/* ---------- folder cards ---------- */
.pmgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:14px}
.pmcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;cursor:pointer;transition:border-color .15s}
.pmcard:hover{border-color:var(--accent)}
.pmcard .pm-id{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.pmcard .pm-title{font-weight:600;font-size:14.5px;margin:3px 0 8px}
.pmcard .pm-meta{font-size:12px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}

/* status badges: alltid ikon + tekst, aldri bare farge */
.status{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:2px 11px;font-size:11.5px;font-weight:600;border:1px solid}
.st-utkast{color:var(--muted);border-color:var(--border2);background:var(--surface2)}
.st-klar{color:var(--accent2);border-color:var(--accent);background:rgba(59,130,246,.12)}
.st-prod{color:var(--warn);border-color:var(--warn);background:var(--warn-bg)}
.st-test{color:var(--info);border-color:var(--info);background:var(--info-bg)}
.st-ferdig{color:var(--good);border-color:var(--good);background:var(--good-bg)}
.st-arkiv{color:var(--muted);border-color:var(--border2);background:none}

/* meter */
.meter{background:var(--surface2);border-radius:6px;height:9px;overflow:hidden;margin-top:4px}
.meter>div{height:100%;border-radius:6px;background:var(--accent)}
.meter.m-good>div{background:var(--good)}
.meter-label{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:4px}

/* ---------- buttons ---------- */
.btn{border:none;border-radius:9px;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2)}
.btn-good{background:var(--good);color:#06281c}
[data-theme="light"] .btn-good{color:#fff}
.btn-ghost{background:none;border:1px solid var(--border2);color:var(--text)}
.btn-ghost:hover{background:var(--surface2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-big{font-size:15px;padding:13px 26px;border-radius:11px}

/* ---------- wizard ---------- */
.steps{display:flex;gap:0;margin-bottom:22px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:7px 16px;font-size:12.5px;color:var(--muted);border-bottom:2px solid var(--border)}
.step .n{width:22px;height:22px;border-radius:50%;background:var(--surface2);display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;border:1px solid var(--border2)}
.step.active{color:var(--text);border-bottom-color:var(--accent)}
.step.active .n{background:var(--accent);color:#fff;border-color:var(--accent)}
.step.done{color:var(--good);border-bottom-color:var(--good)}
.step.done .n{background:var(--good-bg);color:var(--good);border-color:var(--good)}
.wizfoot{display:flex;justify-content:space-between;margin-top:20px;gap:10px;flex-wrap:wrap}
.gatemsg{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--warn)}

/* forms */
.frm{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.frm label{display:block;font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.frm input,.frm select,textarea{width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:9px;color:var(--text);padding:9px 12px;font-size:13.5px;font-family:var(--font)}
textarea{font-family:var(--mono);font-size:12px;min-height:150px;resize:vertical}
.frm input:focus,.frm select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0}

/* ---------- tables ---------- */
.tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--surface2);text-align:left;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);white-space:nowrap;position:sticky;top:0}
td{padding:7px 10px;border-top:1px solid var(--border);white-space:nowrap}
td.mono,.mono{font-family:var(--mono)}
tr.rowbad td{background:var(--bad-bg)}
tr.rowwarn td{background:var(--warn-bg)}
td input{background:var(--surface2);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:3px 7px;font-size:12px;font-family:var(--mono);width:110px}
td input.cellbad{border-color:var(--bad)}

/* ---------- redigerbart rutenett (veiviser steg 2) ---------- */
.gridbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}
.rowdel{background:none;border:1px solid var(--border2);border-radius:7px;color:var(--muted);padding:2px 8px;font-size:12px;cursor:pointer;line-height:1.4}
.rowdel:hover{border-color:var(--bad);color:var(--bad)}
td .ptspill{display:inline-block;font-family:var(--mono);font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--surface2);border:1px dashed var(--border2);color:var(--muted)}
td .ptspill.has{border-style:solid;border-color:var(--accent);color:var(--text)}
.pastefold{margin-top:12px;padding:12px;border:1px dashed var(--border2);border-radius:var(--radius);background:var(--surface2)}
.telbadge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--good-bg);border:1px solid var(--good);color:var(--text)}

/* ---------- fullskjerm (verksted/iPad): meny og topplinje kollapses ---------- */
body.fs .topbar,body.fs .sidebar{display:none}
body.fs .content{padding:58px 18px 18px}      /* plass til den flytende linjen */
body.fs.touch .content{padding-top:72px}
.fsbar{position:fixed;top:10px;right:12px;z-index:400;display:none;gap:8px;align-items:center}
body.fs .fsbar{display:flex}
.fsbar select,.fsbar button{background:var(--surface);border:1px solid var(--border2);border-radius:99px;color:var(--text);padding:8px 14px;font-size:13px;font-family:var(--font);cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.35)}
.fsbar button:hover{border-color:var(--accent)}
.touch .fsbar select,.touch .fsbar button{padding:12px 18px;font-size:15px}

/* validation list */
.vitem{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:9px;margin-bottom:7px;font-size:13px}
.v-bad{background:var(--bad-bg);border:1px solid var(--bad)}
.v-warn{background:var(--warn-bg);border:1px solid var(--warn)}
.v-good{background:var(--good-bg);border:1px solid var(--good)}
.vitem .fix{margin-left:auto;flex-shrink:0}
.vitem button.fixbtn{background:none;border:1px solid var(--border2);border-radius:7px;color:var(--text);padding:3px 10px;font-size:12px;cursor:pointer}
.vitem button.fixbtn:hover{background:var(--surface2)}

/* ---------- fane/tabs ---------- */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tab{background:none;border:none;color:var(--muted);padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer;border-bottom:2px solid transparent}
.tab.active{color:var(--text);border-bottom-color:var(--accent)}

/* status-stepper i mappe */
.flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:10px 0 18px}
.flow .f{font-size:11.5px;padding:4px 12px;border-radius:20px;border:1px solid var(--border2);color:var(--muted)}
.flow .f.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.flow .f.past{border-color:var(--good);color:var(--good)}
.flow .arr{color:var(--muted);font-size:11px}

/* ---------- dokumenter ---------- */
.docgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.doccard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.doccard h3{font-size:14px;margin-bottom:6px}
.doc-stale{border-color:var(--warn)}
.docpreview{background:#fff;color:#111;border-radius:8px;padding:18px;font-size:11.5px;margin-top:14px;max-height:480px;overflow:auto;box-shadow:0 4px 18px rgba(0,0,0,.35)}
.docpreview h4{font-size:15px;margin-bottom:2px}
.docpreview table{font-size:10.5px}
.docpreview th{background:#ED7D31;color:#fff;position:static;padding:4px 6px}
.docpreview td{border:1px solid #ccc;padding:3px 6px;color:#111}
.tagsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tag{border:2px solid #111;border-radius:8px;padding:8px 10px;background:#fffbe6;color:#111;font-size:10.5px;position:relative}
.tag .pts{font-family:var(--mono);font-weight:700;font-size:15px}
.tag .qr{position:absolute;right:8px;top:8px;width:34px;height:34px;background:
  repeating-linear-gradient(0deg,#111 0 3px,transparent 3px 6px),
  repeating-linear-gradient(90deg,#111 0 3px,transparent 3px 6px);opacity:.85;border:2px solid #111}

/* ---------- verksted ---------- */
.wsrow td{font-size:14.5px;padding:11px 12px}
.wsbtn{border:2px solid var(--border2);background:var(--surface2);color:var(--muted);border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.wsbtn.on-prod{background:var(--accent);border-color:var(--accent);color:#fff}
.wsbtn.on-test{background:var(--good);border-color:var(--good);color:#06281c}
[data-theme="light"] .wsbtn.on-test{color:#fff}
.wsbig{font-size:16px;padding:14px 22px}

/* logg */
.log{list-style:none}
.log li{display:flex;gap:12px;padding:8px 4px;border-bottom:1px solid var(--border);font-size:12.5px}
.log .lt{font-family:var(--mono);color:var(--muted);white-space:nowrap}

/* sp-tre */
.sptree{font-family:var(--mono);font-size:12.5px;background:var(--surface2);border:1px solid var(--border);border-radius:9px;padding:14px 16px;line-height:1.9}
.sptree .dim{color:var(--muted)}
.sptree .new{color:var(--good)}

.notice{display:flex;gap:10px;background:var(--info-bg);border:1px solid var(--info);border-radius:9px;padding:10px 14px;font-size:12.5px;margin-bottom:14px}
.hidden{display:none!important}
@media(max-width:840px){.sidebar{width:64px}.nav-item span.txt,.nav-sep{display:none}.content{padding:14px}}

/* ---------- Touch-/iPad-modus (fokus: én slange om gangen) ---------- */
.touch .pmcard{padding:22px;border-radius:16px}
.touch .btn{padding:14px 24px;font-size:16px;border-radius:13px}
.touch .wsbtn{padding:16px 22px;font-size:16px;border-radius:13px}
.touch .tile{padding:18px 22px}
.focus-wrap{max-width:900px;margin:0 auto}
.focus-card{background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:26px 30px;
  animation:cardin .22s ease-out;box-shadow:0 10px 34px rgba(0,0,0,.35)}
@keyframes cardin{from{opacity:0;transform:translateX(26px)}to{opacity:1;transform:none}}
.focus-main{font-family:var(--head);font-weight:800;font-size:clamp(44px,9vw,84px);line-height:1.05;letter-spacing:1px}
.focus-sub{color:var(--muted);font-size:15px;margin-top:2px}
.focus-meta{display:flex;gap:26px;flex-wrap:wrap;margin:16px 0 6px}
.focus-meta .fm{min-width:110px}
.focus-meta .fm b{display:block;font-size:19px;font-family:var(--mono)}
.focus-meta .fm span{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px}
.bigbtn{width:100%;border:none;border-radius:16px;padding:24px;font-size:23px;font-weight:800;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:12px;margin-top:18px;min-height:84px;font-family:var(--font)}
.bigbtn:active{transform:scale(.985)}
.bigbtn.confirm{background:var(--good);color:#06281c}
[data-theme="light"] .bigbtn.confirm{color:#fff}
.bigbtn.next{background:var(--accent);color:#fff}
.bigbtn.ghostb{background:var(--surface2);color:var(--text);border:2px solid var(--border2)}
.bigbtn.undo{background:var(--warn-bg);color:var(--warn);border:2px solid var(--warn);min-height:60px;font-size:16px;padding:12px}
.focus-nav{display:flex;align-items:center;justify-content:space-between;gap:14px;margin:14px 0}
.navarrow{width:72px;height:72px;border-radius:50%;border:2px solid var(--border2);background:var(--surface);
  color:var(--text);font-size:26px;cursor:pointer;flex-shrink:0}
.navarrow:disabled{opacity:.25}
.dots{display:flex;gap:7px;justify-content:center;flex-wrap:wrap;flex:1}
.dot{width:15px;height:15px;border-radius:50%;background:var(--surface2);border:2px solid var(--border2);cursor:pointer;padding:0}
.dot.done{background:var(--good);border-color:var(--good)}
.dot.cur{outline:3px solid var(--accent);outline-offset:2px}
.donecard{text-align:center;padding:50px 30px}
.donecard .big{font-size:60px;margin-bottom:8px}

/* ---------- produktfoto (Parker-katalog) ---------- */
.photo{background:#fff;border-radius:10px;padding:6px 6px 3px;width:132px;text-align:center;border:1px solid var(--border2)}
.photo img{width:100%;height:92px;object-fit:contain;display:block}
.photo span{font-size:9.5px;color:#444;display:block;padding:2px 0;font-family:var(--mono)}
.photo.big{width:170px}
.photo.big img{height:120px}
.photo-mini{background:#fff;border-radius:6px;padding:2px;width:52px;height:40px;display:inline-block;vertical-align:middle}
.photo-mini img{width:100%;height:100%;object-fit:contain;display:block}

/* ---------- fotomontasje: C1 – slange – C2 ---------- */
.assembly{display:flex;align-items:stretch;background:#fff;border-radius:14px;padding:10px 12px;gap:6px;max-width:640px}
.assembly .asm-slot{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:4px}
.assembly .asm-slot.mid{flex:1.2;border-left:1px dashed #ccc;border-right:1px dashed #ccc}
.assembly .imgclip img{height:100%}
.assembly .asm-slot.mid .imgclip img{transform:scale(1.85)}
.assembly .asm-lab{font-family:var(--mono);font-size:11.5px;font-weight:700;color:#111;text-align:center;margin-top:4px}
.assembly .asm-geo{font-size:9.5px;color:#555;text-align:center}
.asm-fallback{display:none;height:110px;align-items:center;justify-content:center;background:#f3f4f6;border-radius:8px;width:100%;color:#555;font-family:var(--mono);font-size:11px;text-align:center;padding:6px}
.assembly.small .asm-fallback{height:72px}
.hpanel{background:#fff;border-radius:14px;padding:10px 14px;max-width:640px}
.hpanel .asm-lab{font-family:var(--mono);font-size:11.5px;font-weight:700;color:#111;text-align:center;margin-top:2px}
.hpanel .asm-geo{font-size:9.5px;color:#555;text-align:center}
/* Parker-fotoene er kvadratiske med mye luft rundt slangen – imgclip zoomer
   inn så motivet fyller rammen (motivet ligger sentrert i originalene). */
.imgclip{overflow:hidden;border-radius:8px;display:flex;align-items:center;justify-content:center;width:100%}
.imgclip img{height:100%;object-fit:contain;display:block}
.imgclip.zoomh img{transform:scale(2.05)}
.hpanel .imgclip{height:150px}
.hthumb{background:#fff;border-radius:10px;padding:4px;width:100%;max-width:230px;overflow:hidden}
.hthumb .imgclip{height:84px}
.assembly .asm-slot .imgclip{height:110px}
.assembly.small .asm-slot .imgclip{height:72px}
.photo-mini{overflow:hidden}

/* ---------- POS-referanse ---------- */
.posref{text-align:right}
.posref .p-label{font-size:10px;letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}
.posref .p-num{font-family:var(--mono);font-weight:800;font-size:40px;line-height:1.05;color:var(--accent2)}
.posref .p-num.missing{color:var(--warn);font-size:22px}
.posref .p-mach{font-size:14px;font-weight:700;margin-top:2px}
.posref .p-ctx{font-size:11.5px;color:var(--muted);margin-top:2px}
.touch .posref .p-num{font-size:52px}
td.pos-cell{font-family:var(--mono);font-weight:800;font-size:16px;color:var(--accent2)}

/* ---------- spot-check ---------- */
.st-qc{color:#c4b5fd;border-color:#8b5cf6;background:rgba(139,92,246,.12)}
[data-theme="light"] .st-qc{color:#6d28d9;border-color:#7c3aed;background:rgba(124,58,237,.08)}
.qc-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:18px 20px;margin-bottom:14px}
.qc-card.ok{border-color:var(--good)}
.qc-card.avvik{border-color:var(--bad)}
.qc-btn{border:2px solid var(--border2);background:var(--surface2);color:var(--text);border-radius:12px;
  padding:14px 26px;font-size:16px;font-weight:800;cursor:pointer}
.qc-btn.ok-on{background:var(--good);border-color:var(--good);color:#06281c}
[data-theme="light"] .qc-btn.ok-on{color:#fff}
.qc-btn.avvik-on{background:var(--bad);border-color:var(--bad);color:#fff}

/* Enkel likhetssøk for «mente du …?» */
function editDist(a,b){
  a=a.toUpperCase();b=b.toUpperCase();
  const m=[...Array(a.length+1)].map((_,i)=>[i,...Array(b.length).fill(0)]);
  for(let j=0;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++)
    m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]!==b[j-1]?1:0));
  return m[a.length][b.length];
}
function suggest(code,dict){
  // Kandidater med samme dimensjonssuffiks («-18-8») prioriteres – det er
  // nesten alltid serie-delen som er feiltastet, ikke dimensjonene.
  const dims=code.includes("-")?code.slice(code.indexOf("-")):null;
  let best=null,bd=99;
  for(const k of Object.keys(dict)){
    const d=editDist(code,k)-(dims&&k.toUpperCase().endsWith(dims.toUpperCase())?0.5:0);
    if(d<bd){bd=d;best=k}
  }
  return bd<=3?best:null;
}

/* ---------- Spot-check (annenhåndskontroll) ----------
   Deterministisk utvalg (samme prinsipp som SpotCheck-spørringen i Excel):
   minst én slange per slangetype, ca. 10 % totalt. Kontrollen skal utføres
   av en annen person enn den som trykktestet slangen. */
function stableHash(s){let h=17;for(const c of String(s))h=(h*31+c.charCodeAt(0))%2147483647;return h}
function buildSpotCheck(f){
  const byType={};
  f.lines.forEach((l,i)=>{(byType[l.hose]=byType[l.hose]||[]).push({l,i})});
  const items=[];
  Object.values(byType).forEach(arr=>{
    const k=Math.max(1,Math.ceil(arr.length*0.1));
    arr.slice().sort((a,b)=>stableHash(a.l.pts)-stableHash(b.l.pts)).slice(0,k)
      .forEach(x=>items.push({i:x.i,result:null,comment:"",by:null,at:null}));
  });
  items.sort((a,b)=>a.i-b.i);
  return {items,startedAt:now(),completedAt:null};
}
function spotDone(f){return f.spot&&f.spot.items.every(x=>x.result==="ok")}

  return {pts,pos,hose,len,c1,c2,qty:qty||1,wp,cut:cut.cut,cutErr:cut.err,st};
}
function wpFor(hose,c1,c2){
  const w=[MASTER.hoses[hose]?.wp,MASTER.couplings[c1]?.wp,MASTER.couplings[c2]?.wp].filter(x=>x>0);
  return w.length?Math.min(...w):null;
}
/* Kuttemål – samme formel som CUT-kolonnen i Excel-arket:
   CUT = Length − (B1 + B2 + S)
   B1/B2 = koblingenes B-mål (MasterTable[B]), S = slangens S-mål (HoseInfo[S-Mål]).
   Viktig forskjell fra Excel: mangler et B-/S-mål stopper vi og sier ifra,
   i stedet for å stille regne ut et for langt kutt. */
function cutFor(len,hose,c1,c2){
  const n=Number(len);
  if(!len||isNaN(n)||n<=0)return {cut:null,err:null};
  const miss=[];
  const b1=MASTER.couplings[c1]?.b, b2=MASTER.couplings[c2]?.b, s=MASTER.hoses[hose]?.s;
  if(b1==null&&MASTER.couplings[c1])miss.push(`B-mål mangler i master for ${c1}`);
  if(b2==null&&MASTER.couplings[c2])miss.push(`B-mål mangler i master for ${c2}`);
  if(s==null&&MASTER.hoses[hose])miss.push(`S-mål mangler i master for ${hose}`);
  if(b1==null||b2==null||s==null)return {cut:null,err:miss.length?miss.join("; "):null};
  const cut=n-(b1+b2+s);
  if(cut<=0)return {cut:null,err:`Lengden (${n} mm) er kortere enn koblingene + S-mål (${b1+b2+s} mm)`};
  return {cut,err:null};
}

/* ---------- Tidsestimat ----------
   Samme modell som TimeCalc-tabellen og TimeCalcEachHose-spørringen i Excel:
   timer per slange = Start tid + (Add. Ea m × lengde i meter)
                      + tillegg for under/over 10 m (per DIM = dash-størrelsen).
   Verdiene under er demoverdier – i drift leses de fra TimeCalc-tabellen i
   Database_Hose_&_fittings.xlsx (inkl. egne SAE-kolonner). */
const TIMECALC = {
  4:{start:0.35,eaM:0.010,u10:0.15,o10:0.30},
  6:{start:0.40,eaM:0.012,u10:0.20,o10:0.35},
  8:{start:0.45,eaM:0.014,u10:0.20,o10:0.40},
  12:{start:0.60,eaM:0.018,u10:0.30,o10:0.50},
  16:{start:0.75,eaM:0.022,u10:0.35,o10:0.60}
};
function estHoursLine(l){
  const dim=Number(String(l.hose||"").split("-").pop());
  const tc=TIMECALC[dim];
  const len=Number(l.len)||0;
  if(!tc||!len)return null;
  const base=tc.start+tc.eaM*len/1000;
  const add=len<10000?tc.u10:tc.o10;
  return Math.ceil((base+add)*100)/100;   // Number.RoundUp(…, 2) som i Excel
}
function estHoursFolder(f){
  let sum=0,unknown=0;
  f.lines.forEach(l=>{const h=estHoursLine(l);if(h==null)unknown++;else sum+=h});
  return {hours:Math.round(sum*10)/10,unknown};
}
/* Gjenstående timer: estimat × andel operasjoner som ikke er utført */
function remainingHours(f){
  const n=f.lines.length;if(!n)return 0;
  const doneFrac=STAGES.reduce((a,s)=>a+stageCount(f,s.key),0)/(4*n);
  return Math.round(estHoursFolder(f).hours*(1-doneFrac)*10)/10;
}
function fmtH(h){return (h==null?"–":h.toLocaleString("nb-NO",{maximumFractionDigits:1})+" t")}

/* =====================================================================
   PTS-register (simulert) – reserverer neste ledige ID-er.
   I drift: ett kall mot PTS-databasen som reserverer n ID-er atomisk.
   ===================================================================== */
function reservePtsIds(n){
  const CS="ABCDEFGHJKMNPQRSTVWXYZ23456789"; // registerets tegnsett (uten I/L/O/U/0/1)
  const ids=[];
  for(let k=0;k<n;k++){
    let x=(State.ptsSeq++)*2654435761 % 2147483647; if(x<0)x+=2147483647;
    let s="";
    for(let j=0;j<8;j++){s+=CS[x%CS.length];x=Math.floor(x/CS.length)+((j*7919)%CS.length)}
    ids.push(s);
  }
  return ids;
}
/* Tildel PTS-ID til alle rader/linjer som mangler. Returnerer antall tildelt. */
function assignPts(list){
  const missing=list.filter(r=>!r.pts);
  const ids=reservePtsIds(missing.length);
  missing.forEach((r,i)=>r.pts=ids[i]);
  return missing.length;
}
function ptsMissing(f){return f.lines.filter(l=>!l.pts).length}

/* =====================================================================
   Telaris (simulert) – oppretter slangepakken som vare med BOM.
   I drift: Telaris-API. Varenummerserier: 2004xx = slangepakke,
   118xxx = enkeltslange. Faste BOM-varer: 20001 timer, 23951 gul tag.
   ===================================================================== */
function buildTelaris(f){
  const pkgNo="2004"+String(State.telarisSeq%100).padStart(2,"0");
  const items=f.lines.map(l=>{
    const itemNo=String(++State.telarisSeq);
    const cut=l.cut||cutFor(l.len,l.hose,l.c1,l.c2).cut;
    return {itemNo,pts:l.pts,pos:l.pos,
      desc:`Slange ${l.hose} L=${l.len} POS ${l.pos||"–"}`,qty:l.qty||1,
      bom:[
        {no:"H-"+l.hose,desc:"Slange "+l.hose,qty:Math.round((cut||Number(l.len)||0))/1000,unit:"m"},
        {no:l.c1,desc:"Kobling "+l.c1,qty:1,unit:"stk"},
        {no:l.c2,desc:"Kobling "+l.c2,qty:1,unit:"stk"},
        {no:"20001",desc:"Montasje/timer",qty:estHoursLine(l),unit:"t"},
        {no:"23951",desc:"Gul tag m/gravering",qty:1,unit:"stk"}
      ]};
  });
  const totals={};
  items.forEach(it=>it.bom.forEach(b=>{
    const key=b.no;totals[key]=totals[key]||{no:b.no,desc:b.desc,qty:0,unit:b.unit};
    totals[key].qty=Math.round((totals[key].qty+b.qty*it.qty)*100)/100;
  }));
  return {pkg:pkgNo,createdAt:now(),by:State.user,items,totals:Object.values(totals)};
}

function fsEnter(){
  State.fs=true;
  try{const d=document.documentElement;const rf=d.requestFullscreen||d.webkitRequestFullscreen;if(rf)rf.call(d)}catch(e){}

function fsOff(){
  if(!State.fs)return;
  State.fs=false;
  try{

    if(ef&&(document.fullscreenElement||document.webkitFullscreenElement))ef.call(document);
  }catch(e){}
}

function wzCellG(i,field,el){
  const w=State.wizard,r=w.rows[i];
  r[field]=el.value.trim();

  const c=cutFor(r.len,r.hose,r.c1,r.c2);r.cut=c.cut;r.cutErr=c.err;

  if(wpc)wpc.textContent=r.wp?r.wp+" bar":"–";

  w.rows.forEach((_,k)=>{
    const tr=document.getElementById("gr-"+k);
    if(tr)tr.className=badRows.has(k)?"rowbad":warnRows.has(k)?"rowwarn":"";
  });

  const gf=document.getElementById("gridfoot");if(gf)gf.innerHTML=gridFootHTML();

/* Tåler både kundens format (POS først) og gammelt format med PTS-ID først */
function wzAppendRows(raw){
  const w=State.wizard;
  const lines=String(raw||"").split(/\r?\n/).filter(l=>l.trim()!=="");
  if(!lines.length)return;
  let rows=lines.map(l=>l.split("\t").map(c=>c.trim()));
  let hasPts=false;
  if(/pos|pts|hose/i.test(rows[0].join(" "))){hasPts=/pts/i.test(rows[0][0]);rows=rows.slice(1)}
  else hasPts=/^(?=.*[A-Z])[A-Z0-9]{6,}$/i.test(rows[0][0]||"");
  rows.forEach(r=>{
    const o=hasPts?{pts:r[0]||"",pos:r[1]||"",hose:r[2]||"",len:r[3]||"",c1:r[4]||"",c2:r[5]||"",qty:r[6]||"1",mach:r[7]||""}
                  :{pts:"",pos:r[0]||"",hose:r[1]||"",len:r[2]||"",c1:r[3]||"",c2:r[4]||"",qty:r[5]||"1",mach:r[6]||""};
    w.rows.push({...o,wp:null,cut:null});
  });
  wzValidate();render();
}

/* ---------- Validering ---------- */
function wzValidate(){
  const w=State.wizard;
  w.issues=validateRows(w.rows);
}
function validateRows(rows){
  const issues=[];
  const seen={};
  const lbl=(r,i)=>`Rad ${i+1}${r.pos?` (POS ${r.pos})`:r.pts?` (${r.pts})`:""}`;
  rows.forEach((r,i)=>{
    if(r.pts){ // PTS-ID er valgfri ved innlegging – hentes fra registeret
      if(seen[r.pts]!==undefined)issues.push({sev:"bad",row:i,msg:`${lbl(r,i)}: PTS-ID «${r.pts}» er duplikat av rad ${seen[r.pts]+1}. Hver slange må ha unik ID.`});
      seen[r.pts]=i;
    }
    if(!r.pos)issues.push({sev:"warn",row:i,msg:`${lbl(r,i)}: mangler POS – tillatt, men bør fylles ut før tags skrives ut.`});
    if(!r.hose)issues.push({sev:"bad",row:i,msg:`${lbl(r,i)}: mangler slangetype.`});
    else if(!MASTER.hoses[r.hose]){
      const s=suggest(r.hose,MASTER.hoses);
      issues.push({sev:"bad",row:i,field:"hose",fix:s,msg:`${lbl(r,i)}: slangetypen «${r.hose}» finnes ikke i masterdata.${s?` Mente du «${s}»?`:""}`});
    }
    ["c1","c2"].forEach(f=>{
      const code=r[f];
      if(!code)issues.push({sev:"bad",row:i,msg:`${lbl(r,i)}: mangler ${f==="c1"?"Coupling 1":"Coupling 2"}.`});
      else if(!MASTER.couplings[code]){
        const s=suggest(code,MASTER.couplings);
        issues.push({sev:"bad",row:i,field:f,fix:s,msg:`${lbl(r,i)}: koblingen «${code}» finnes ikke i masterdata.${s?` Mente du «${s}»?`:""}`});
      }
    });
    const len=Number(r.len);
    if(!r.len||isNaN(len)||len<=0)issues.push({sev:"bad",row:i,msg:`${lbl(r,i)}: lengde mangler eller er ugyldig («${r.len||"tom"}»).`});
    const q=Number(r.qty);
    if(!r.qty||isNaN(q)||q<1)issues.push({sev:"warn",row:i,msg:`${lbl(r,i)}: antall mangler – settes til 1.`});
  });
  rows.forEach((r,i)=>{
    r.wp=wpFor(r.hose,r.c1,r.c2);
    const c=cutFor(r.len,r.hose,r.c1,r.c2);
    r.cut=c.cut;r.cutErr=c.err;
    if(c.err)issues.push({sev:"bad",row:i,msg:`${lbl(r,i)}: kuttemål kan ikke beregnes – ${c.err}.`});
  });
  return issues;
}
function wzFix(idx){
  const w=State.wizard,it=w.issues[idx];
  if(it&&it.fix&&it.field!==undefined){w.rows[it.row][it.field]=it.fix;wzValidate();render()}
}

function folderActions(f){
  const btns=[];
  const miss=ptsMissing(f);
  if(["fsp","tilbud"].includes(f.status)){
    btns.push(`<button class="btn btn-primary" onclick="fResume('${f.id}')">✏️ Bearbeid slangelisten</button>`);
  }
  /* kjeden: bearbeid → hent PTS-ID-er → opprett i Telaris → tilbud fra Telaris → ordre → verksted */
  if(miss&&["fsp","tilbud","klar"].includes(f.status))
    btns.push(`<button class="btn btn-good" onclick="fFetchPts('${f.id}')">🔖 Hent PTS-ID-er til alle slangene (${miss} mangler)</button>`);
  if(!f.telaris&&f.lines.length&&!miss&&["fsp","tilbud","klar"].includes(f.status))
    btns.push(`<button class="btn btn-good" onclick="fCreateTelaris('${f.id}')">⚙️ Opprett slangepakke i Telaris</button>`);
  if(["fsp","tilbud"].includes(f.status)){
    if(f.status==="fsp"){
      btns.push(`<button class="btn btn-ghost" ${f.telaris?"":`disabled title="Slangepakken må opprettes i Telaris først – tilbudet sendes derfra"`} onclick="fMarkTilbud('${f.id}')">📤 Marker tilbud sendt fra Telaris</button>`);
      if(f.lines.length&&!f.telaris&&!miss)btns.push(`<span class="gatemsg" style="align-self:center">🔒 Tilbudet sendes fra Telaris – opprett slangepakken først</span>`);
    }
    btns.push(`<button class="btn btn-good" ${f.lines.length?"":"disabled title='Slangelisten er tom'"} onclick="State.poForm=State.poForm==='${f.id}'?null:'${f.id}';render()">📦 Registrer bestilling …</button>`);
  }
  if(!f.project&&!["ferdig","arkiv"].includes(f.status))btns.push(`<select style="background:var(--surface2);color:var(--text);border:1px solid var(--border2);border-radius:9px;padding:8px 10px;font-size:12.5px" onchange="fLinkProject('${f.id}',this.value)">
    <option value="">🔗 Koble til PMOTION-prosjekt …</option>${PMPROJECTS.map(p=>`<option>${p}</option>`).join("")}</select>`);
  if(f.status==="klar"){
    btns.push(`<button class="btn btn-primary" ${miss||!f.telaris?`disabled title="${miss?"Hent PTS-ID-er først – hver slange må ha ID for tags og sporing":"Opprett slangepakken i Telaris først – BOM-en styrer lagertrekk og kalkyle"}"`:""} onclick="fSend('${f.id}')">🏭 Send til verksted</button>`);
    if(miss)btns.push(`<span class="gatemsg" style="align-self:center">🔒 ${miss} slanger mangler PTS-ID – hent dem før produksjon</span>`);
    else if(!f.telaris)btns.push(`<span class="gatemsg" style="align-self:center">🔒 Opprett slangepakken i Telaris før produksjon</span>`);
  }
  if(["prod","test"].includes(f.status))btns.push(`<button class="btn btn-ghost" onclick="State.ws.folderId='${f.id}';State.ws.stage=null;State.ws.hoseType=null;App.nav('verksted')">🏭 Åpne i verkstedsmodus</button>`);
  if(f.status==="qc")btns.push(`<button class="btn btn-primary" onclick="State.ws.folderId='${f.id}';State.ws.stage='qc';App.nav('verksted')">🔍 Åpne spot-check</button>`);
  if(f.status==="ferdig"&&f.spot)btns.push(`<button class="btn btn-primary" onclick="State.ws.folderId='${f.id}';State.ws.stage='prints';App.nav('verksted')">🖨️ Utskrifter</button>`);
  if(f.status==="ferdig")btns.push(`<button class="btn btn-ghost" onclick="fArchive('${f.id}')">🗃️ Arkiver mappen</button>`);
  const poForm=State.poForm===f.id?`
  <div class="card" style="display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap">
    <div><label style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">Ordrenummer</label><br>
      <input id="pf-order" value="${esc(f.order||"")}" placeholder="f.eks. 26810" style="background:var(--surface2);border:1px solid var(--border2);border-radius:9px;color:var(--text);padding:9px 12px"></div>
    <div><label style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px">PO-nummer</label><br>
      <input id="pf-po" value="${esc(f.po||"")}" placeholder="kundens PO" style="background:var(--surface2);border:1px solid var(--border2);border-radius:9px;color:var(--text);padding:9px 12px"></div>
    <button class="btn btn-good" onclick="fRegisterPO('${f.id}',document.getElementById('pf-order').value,document.getElementById('pf-po').value)">✅ Registrer – mappen blir klar til produksjon</button>
  </div>`:"";
  return (btns.length?`<div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">${btns.join("")}</div>`:"")+poForm;
}
function fMarkTilbud(id){
  const f=folder(id);if(!f.lines.length)return;
  if(!f.telaris)return; // port: tilbudet sendes fra Telaris på pakkevaren
  f.status="tilbud";
  addLog(f,`Tilbud sendt til kunden fra Telaris på pakkevare ${f.telaris.pkg} – tilbudsunderlaget ligger i Dokumenter`);
  render();
}
function fRegisterPO(id,order,po){
  const f=folder(id);
  if(!order&&!po)return;
  f.order=(order||"").trim();f.po=(po||"").trim();f.status="klar";State.poForm=null;
  addLog(f,`Bestilling registrert (ordre ${f.order||"–"} / PO ${f.po||"–"}) – mappen er klar til produksjon og lagt i produksjonsplanen`);
  render();
}
function fLinkProject(id,proj){
  if(!proj)return;
  const f=folder(id);f.project=proj;
  addLog(f,`Mappen koblet til PMOTION-prosjektet «${proj}»`);
  render();
}
function fResume(id){
  const f=folder(id);
  App.startWizard();
  const w=State.wizard;
  w.editId=f.id;w.project=f.project||"";w.order=f.order||"";w.po=f.po||"";
  w.customer=f.customer||"";w.custRef=f.custRef||"";w.hub=f.hub||"Lillesand";
  w.rows=f.lines.map(l=>({pts:l.pts,pos:String(l.pos??""),hose:l.hose,len:String(l.len??""),
    c1:l.c1,c2:l.c2,qty:String(l.qty??"1"),mach:l.mach||"",wp:l.wp,cut:l.cut}));
  if(w.rows.length){wzValidate();w.step=2}
  render();
}
function fFetchPts(id){
  const f=folder(id);
  const n=assignPts(f.lines);
  if(n){f.docsStale=true;addLog(f,`${n} PTS-ID-er reservert fra PTS-registeret – tags og dokumenter må regenereres`)}
  render();
}
function fSend(id){
  const f=folder(id);
  if(ptsMissing(f)||!f.telaris)return; // port: PTS-ID-er hentet og Telaris-pakke opprettet før produksjon
  f.status="prod";
  addLog(f,"Status endret: Klar til produksjon → I produksjon (sendt til verksted)");
  render();
}
function fCreateTelaris(id){
  const f=folder(id);
  if(f.telaris)return;
  f.telaris=buildTelaris(f);
  addLog(f,`Slangepakke opprettet i Telaris (simulert): vare ${f.telaris.pkg} med ${f.telaris.items.length} slanger og komplett BOM`);
  render();
}
function fArchive(id){
  const f=folder(id);f.status="arkiv";
  addLog(f,"Mappen arkivert – historikk og dokumenter beholdes i SharePoint");
  render();
}

/* =====================================================================
   Verkstedsmodus – store flater for PC/skjerm på verkstedet.
   Slangene er gruppert per slangetype: montøren må aktivt velge typen
   (med tegning) før kuttelisten vises – det hindrer kapping av feil
   slange når flere typer ligger i samme mappe.
   ===================================================================== */

/* Visuell profil per serie: farge + antall lag. Fargen er en skjermkode
   for å skille typene – typenavnet står alltid påtrykt (aldri farge alene). */
const SERIES_STYLE={
  "187ST":{color:"#8a94a8",layers:1,desc:"1-flettet · WP 70 bar"},
  "387ST":{color:"#3b82f6",layers:2,desc:"2-flettet · WP 210 bar"},
  "487ST":{color:"#d64545",layers:4,desc:"4-spiral · WP 280 bar"},
  "787ST":{color:"#2f9e6e",layers:6,desc:"multispiral · WP 350 bar"},
  "462ST":{color:"#b07d2b",layers:2,desc:"2-flettet · WP 310 bar"},
  "2390N":{color:"#7c5cd6",layers:2,desc:"kompakt · WP 490 bar"}
};
function seriesOf(code){return (code||"").split("-")[0]}
function sizeOf(code){const p=(code||"").split("-");return Number(p[p.length-1])||8}

/* Skjematisk tegning av slangen: press-nippel i begge ender, hylse,
   slangekropp med spiralmønster og påtrykt kode ("lay line"). */
function hoseSVG(code,h){
  h=h||64;
  const st=SERIES_STYLE[seriesOf(code)]||{color:"#8892a4",layers:2,desc:""};
  const size=sizeOf(code);
  const bodyH=Math.min(12+size*1.5,36);           // tykkelse følger dimensjonen
  const W=440,cy=h/2,x1=78,x2=W-78;
  const pid="p"+code.replace(/[^a-zA-Z0-9]/g,"");
  const fitting=(x,dir)=>`
    <rect x="${x-14*dir-14}" y="${cy-bodyH/2-5}" width="28" height="${bodyH+10}" rx="3" fill="#9aa3b5"/>
    <rect x="${dir>0?x-52:x+24}" y="${cy-7}" width="28" height="14" rx="2" fill="#c2c9d6"/>
    <path d="M ${dir>0?x-66:x+66} ${cy} l ${10*dir} -9 v18 z" fill="#c2c9d6"/>`;
  return `<svg viewBox="0 0 ${W} ${h}" style="width:100%;max-width:${W}px;height:auto" role="img" aria-label="Tegning av ${esc(code)}">
    <defs><pattern id="${pid}" width="14" height="${bodyH}" patternUnits="userSpaceOnUse" patternTransform="rotate(0)">
      <rect width="14" height="${bodyH}" fill="${st.color}"/>
      <path d="M -2 ${bodyH+2} L 9 -2" stroke="rgba(0,0,0,.28)" stroke-width="${Math.max(2,6-st.layers)}"/>
      <path d="M 5 ${bodyH+2} L 16 -2" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
    </pattern></defs>
    <rect x="${x1}" y="${cy-bodyH/2}" width="${x2-x1}" height="${bodyH}" rx="${bodyH/2.6}" fill="url(#${pid})" stroke="rgba(0,0,0,.4)"/>
    <rect x="${x1}" y="${cy-bodyH/2+2}" width="${x2-x1}" height="4" rx="2" fill="rgba(255,255,255,.25)"/>
    ${fitting(x1,1)}${fitting(x2,-1)}
    <rect x="${(W-190)/2}" y="${cy-8}" width="190" height="16" rx="3" fill="rgba(0,0,0,.45)"/>
    <text x="${W/2}" y="${cy+4}" text-anchor="middle" font-family="monospace" font-size="12" font-weight="700" fill="#fff">${esc(code)} · ${MASTER.hoses[code]?MASTER.hoses[code].inch:""}</text>
  </svg>`;
}

/* =====================================================================
   Detaljerte tegninger: koblinger (riktig vinkel/system fra masterdata),
   komplett montasje, bar slange med målpil og UC-propper.
   ===================================================================== */
let svgSeq=0;
function metalDefs(tag){return `<defs>
  <linearGradient id="met${tag}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eef2f7"/><stop offset=".45" stop-color="#aeb8c6"/>
    <stop offset=".55" stop-color="#98a3b3"/><stop offset="1" stop-color="#5f6875"/>
  </linearGradient>
  <linearGradient id="metd${tag}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#cfd6df"/><stop offset="1" stop-color="#49515c"/>
  </linearGradient>
</defs>`}
function hosePattern(tag,hose,bodyH){
  const st=SERIES_STYLE[seriesOf(hose)]||{color:"#8892a4",layers:2};
  return `<defs><pattern id="hp${tag}" width="14" height="${bodyH}" patternUnits="userSpaceOnUse">
    <rect width="14" height="${bodyH}" fill="${st.color}"/>
    <path d="M -2 ${bodyH+2} L 9 -2" stroke="rgba(0,0,0,.28)" stroke-width="${Math.max(2,6-(st.layers||2))}"/>
    <path d="M 5 ${bodyH+2} L 16 -2" stroke="rgba(255,255,255,.16)" stroke-width="2"/>
  </pattern></defs>`;
}

/* Én kobling tegnet ut fra hylsa. dir=1: venstre ende, dir=-1: høyre ende. */
function couplingPart(code,dir,x,cy,bodyH,tag){
  const c=MASTER.couplings[code]||{};
  const ang=c.ang??0;
  const E="#3a414c";
  const fh=bodyH+14, fw=34;
  const fx=dir>0?x-fw:x;
  let g=`<rect x="${fx}" y="${cy-fh/2}" width="${fw}" height="${fh}" rx="4" fill="url(#met${tag})" stroke="${E}"/>`;
  for(let k=1;k<6;k++){const rx=fx+k*(fw/6);
    g+=`<line x1="${rx}" y1="${cy-fh/2+3}" x2="${rx}" y2="${cy+fh/2-3}" stroke="#525a66" stroke-width="1.4" opacity=".8"/>`}
  const stem=13, nutW=26, nutH=bodyH+18, nipW=15;
  let outer=`<rect x="0" y="${-bodyH/2-2}" width="${stem}" height="${bodyH+4}" fill="url(#metd${tag})" stroke="${E}"/>`;
  outer+=`<rect x="${stem}" y="${-nutH/2}" width="${nutW}" height="${nutH}" rx="3" fill="url(#met${tag})" stroke="${E}"/>`;
  outer+=`<line x1="${stem+2}" y1="${-nutH/6}" x2="${stem+nutW-2}" y2="${-nutH/6}" stroke="#6a7482" stroke-width="1.2"/>`;
  outer+=`<line x1="${stem+2}" y1="${nutH/6}" x2="${stem+nutW-2}" y2="${nutH/6}" stroke="#4d5560" stroke-width="1.2"/>`;
  outer+=`<rect x="${stem+nutW}" y="${-bodyH/2}" width="${nipW}" height="${bodyH}" fill="url(#metd${tag})" stroke="${E}"/>`;
  for(let k=2;k<nipW-1;k+=3)
    outer+=`<line x1="${stem+nutW+k}" y1="${-bodyH/2+1}" x2="${stem+nutW+k}" y2="${bodyH/2-1}" stroke="#e8edf3" stroke-width="1" opacity=".65"/>`;
  if(c.sys==="ORFS")outer+=`<rect x="${stem+nutW-3}" y="${-bodyH/2-3}" width="3" height="${bodyH+6}" fill="#20242b"/>`;
  const px=dir>0?fx:fx+fw;
  const rot=ang===0?0:(ang===45?-45:-90);
  const elbow=ang?`<rect x="-7" y="${-bodyH/2-5}" width="14" height="${bodyH+10}" rx="3" fill="url(#met${tag})" stroke="${E}"/>`:"";
  g+=`<g transform="translate(${px},${cy}) scale(${dir>0?-1:1},1)${ang?` rotate(${rot})`:""}">${elbow}${outer}</g>`;
  return g;
}
function cplLabel(code){
  const c=MASTER.couplings[code]||{};
  return c.sys?`${c.sys} ${c.dim} · ${c.ang??0}°`:"";
}

/* Komplett montasjetegning: C1 + slange + C2, med etiketter under hver ende */
function assemblySVG(l,H){
  H=H||150;svgSeq++;const tag="a"+svgSeq;
  const size=sizeOf(l.hose);const bodyH=Math.min(12+size*1.5,32);
  const W=540,cy=H-44,x1=122,x2=W-122;
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px;height:auto" role="img" aria-label="Montasje ${esc(l.hose)} med ${esc(l.c1)} og ${esc(l.c2)}">
    ${metalDefs(tag)}${hosePattern(tag,l.hose,bodyH)}
    <rect x="${x1}" y="${cy-bodyH/2}" width="${x2-x1}" height="${bodyH}" rx="${bodyH/2.6}" fill="url(#hp${tag})" stroke="rgba(0,0,0,.4)"/>

}

function wsTypes(f,stageKey){
  const g={};
  f.lines.forEach((l,i)=>{(g[l.hose]=g[l.hose]||[]).push({l,i})});
  return Object.entries(g).map(([hose,items])=>({hose,items,
    done:items.filter(x=>x.l.st[stageKey||"cut"]).length}));
}
/* Neste slangetype med gjenstående arbeid i valgt operasjon (wrap-around). */
function wsNextType(f,current,stageKey){
  const types=wsTypes(f,stageKey);
  const start=Math.max(0,types.findIndex(x=>x.hose===current));
  for(let k=1;k<=types.length;k++){
    const cand=types[(start+k)%types.length];
    if(cand.hose!==current&&cand.done<cand.items.length)return cand;
  }
  return null;
}
function stageDef(key){return STAGES.find(s=>s.key===key)}
function prevStage(key){const i=STAGES.findIndex(s=>s.key===key);return i>0?STAGES[i-1]:null}

function vVerksted(){
  const cands=State.folders.filter(f=>["prod","test","qc"].includes(f.status));
  const f=folder(State.ws.folderId);
  if(f&&State.ws.stage==="prints")return vPrints(f);
  if(f&&(f.status==="qc"||State.ws.stage==="qc")&&f.spot)return vQC(f);
  if(!f||!["prod","test","qc"].includes(f.status)){
    return `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h1>🏭 Verkstedsmodus</h1>
      <div style="display:flex;gap:8px;flex-wrap:wrap">${wsModeBtn()}</div>
    </div>
    <div class="sub">Velg produksjonsmappen dere jobber med. Kun mapper som er sendt til produksjon vises her.${State.fs?"":" På iPad: trykk <b>⛶ Fullskjerm</b> – menyen og topplinjen kollapses så hele skjermen brukes til arbeidet."}</div>
    ${cands.length?`<div class="pmgrid">${cands.map(x=>`<div class="pmcard" onclick="State.ws.folderId='${x.id}';State.ws.stage=null;State.ws.hoseType=null;render()">
      <div class="pm-id">${x.id}</div><div class="pm-title" style="font-size:17px">${esc(x.title)}</div>
      ${stBadge(x.status)}
      <div class="meter" style="margin-top:10px"><div style="width:${Math.round(100*x.lines.filter(l=>l.st.cut).length/x.lines.length)}%"></div></div>
      <div class="meter-label"><span>✂️ Kappet ${x.lines.filter(l=>l.st.cut).length}/${x.lines.length}</span><span>🧪 Testet ${x.lines.filter(l=>l.st.test).length}/${x.lines.length}</span></div>
    </div>`).join("")}</div>`
    :`<div class="notice">Ingen mapper i produksjon akkurat nå.</div>`}`;
  }
  if(!State.ws.stage)return wsStageSelect(f);
  if(State.ws.stage==="cut"){
    if(!(State.ws.hoseType&&f.lines.some(l=>l.hose===State.ws.hoseType)))return wsCutTypeSelect(f);
    return State.touch?wsFocus(f,"cut"):wsCutView(f);
  }
  return State.touch?wsFocus(f,State.ws.stage):wsStageList(f,State.ws.stage);
}

        <div style="display:flex;justify-content:space-between;align-items:center">
          <div class="pm-title" style="font-size:18px">${s.icon} ${i+1}. ${s.label}</div>
          ${done===n?`<span class="status st-ferdig">✅ Ferdig</span>`
            :avail>0?`<span class="status st-prod">${avail} klar${avail===1?"":"e"}</span>`
            :`<span class="status st-utkast">venter på ${prev?prev.label.toLowerCase():""}</span>`}

        <div class="meter ${s.key==="test"?"m-good":""}" style="margin-top:12px"><div style="width:${Math.round(100*done/n)}%"></div></div>
        <div class="meter-label"><span>${done}/${n} ${s.verb}</span>${prev&&done<n?`<span>${ready}/${n} klare fra ${prev.label.toLowerCase()}</span>`:"<span></span>"}</div>

/* --- RENS / PRESSING / TRYKKTEST: felles liste per operasjon --- */
function wsStageList(f,key){
  const s=stageDef(key), prev=prevStage(key);
  const eligible=f.lines.map((l,i)=>({l,i})).filter(x=>!prev||x.l.st[prev.key]);
  const waiting=f.lines.length-eligible.length;
  const done=eligible.filter(x=>x.l.st[key]).length;
  const todo=eligible.filter(x=>!x.l.st[key]);
  const rows=(State.ws.onlyRemaining?todo:eligible)
    .sort((a,b)=>key==="test"?(b.l.wp||0)-(a.l.wp||0):(key==="press"?(a.l.hose+"").localeCompare(b.l.hose):(b.l.cut||0)-(a.l.cut||0)));
  const grouped=key==="press";
  let lastHose=null;
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <h1 style="font-size:24px">${s.icon} ${s.label} – ${esc(f.title)}</h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">${wsModeBtn()}<button class="btn btn-ghost" onclick="State.ws.stage=null;render()">↩︎ Til operasjonene</button></div>
  </div>
  <div class="sub">${key==="clean"?"Rens innvendig og sett i UC-propper. Kun kappede slanger vises her."
      :key==="press"?"Press koblingene på. Listen er gruppert per slangetype – kontroller pressinnstillingene når typen skifter. Kun rensede slanger vises."
      :"Trykktest til testtrykk (1,5 × WP) med 10 min holdetid. Kun pressede slanger vises."} Innlogget: <b>${esc(State.user)}</b></div>
  <div class="cardrow">
    <div class="tile"><div class="t-label">${s.verb} </div><div class="t-value">${done} / ${eligible.length}</div><div class="meter ${key==="test"?"m-good":""}"><div style="width:${eligible.length?Math.round(100*done/eligible.length):0}%"></div></div>
      ${waiting?`<div class="t-note">+ ${waiting} venter på ${prev.label.toLowerCase()}</div>`:""}</div>
    <div class="tile" style="display:flex;flex-direction:column;justify-content:center;gap:8px">
      <label style="font-size:13.5px"><input type="checkbox" ${State.ws.onlyRemaining?"checked":""} onchange="State.ws.onlyRemaining=this.checked;render()"> Vis kun gjenstående</label>
      ${key==="clean"&&todo.length?`<button class="btn btn-primary" onclick="wsStageAll('${f.id}','clean')">🧼 Merk alle ${todo.length} som renset</button>`:""}
    </div>
  </div>
  ${done===eligible.length&&eligible.length===f.lines.length?`
  <div class="vitem v-good" style="align-items:center">✅ <div><b>Alle ${f.lines.length} slanger er ${s.verb}.</b>${key!=="test"?` Neste operasjon: ${STAGES[STAGES.findIndex(x=>x.key===key)+1].icon} ${STAGES[STAGES.findIndex(x=>x.key===key)+1].label}.`:" Mappen kan meldes ferdig fra operasjonsoversikten."}</div>
    <span class="fix">${key!=="test"?`<button class="btn btn-good" onclick="State.ws.stage='${STAGES[STAGES.findIndex(x=>x.key===key)+1].key}';render()">➡️ Gå videre</button>`:`<button class="btn btn-good" onclick="State.ws.stage=null;render()">➡️ Til oversikten</button>`}</span></div>`:""}
  <div class="tblwrap"><table>
    <tr><th>POS</th><th>Maskin</th><th>PTS ID</th><th>Hose</th><th>Kutt</th>${key==="press"?"<th>Coupling 1</th><th>Coupling 2</th>":""}${key==="test"?"<th>WP</th><th style='color:var(--info)'>Testtrykk</th>":""}<th>${s.label}</th></tr>
    ${rows.map(({l,i})=>{
      const hdr=grouped&&l.hose!==lastHose?`<tr><td colspan="8" style="background:var(--surface2);padding:10px 12px">
        <div style="display:flex;align-items:center;gap:14px"><div style="width:150px">${hoseThumb(l.hose)}</div>
        <b class="mono" style="font-size:15px">${l.hose}</b><span style="color:var(--muted);font-size:12px">${(SERIES_STYLE[seriesOf(l.hose)]||{}).desc||""}</span></div></td></tr>`:"";
      lastHose=l.hose;
      return hdr+`<tr class="wsrow">
      <td class="pos-cell">${esc(l.pos||"–")}</td>
      <td class="mono">${esc(l.mach||"–")}</td>
      <td class="mono" style="color:var(--muted)">${esc(l.pts)}</td>
      <td class="mono">${esc(l.hose)}</td>
      <td class="mono">${fmtCut(l)}</td>
      ${key==="press"?`<td><span class="photo-mini" style="width:64px;height:48px"><img src="${cplImgURL(l.c1)}" loading="lazy" alt="" style="transform:scaleX(${(MASTER.couplings[l.c1]||{}).imgHoseEnd==="right"?1:-1})" onerror="this.parentElement.style.display='none'"></span><div class="mono" style="font-size:11px">${esc(l.c1)}<span style="color:var(--muted)"> · ${cplLabel(l.c1)}</span></div></td>
      <td><span class="photo-mini" style="width:64px;height:48px"><img src="${cplImgURL(l.c2)}" loading="lazy" alt="" style="transform:scaleX(${(MASTER.couplings[l.c2]||{}).imgHoseEnd==="right"?-1:1})" onerror="this.parentElement.style.display='none'"></span><div class="mono" style="font-size:11px">${esc(l.c2)}<span style="color:var(--muted)"> · ${cplLabel(l.c2)}</span></div></td>`:""}
      ${key==="test"?`<td class="mono">${l.wp?l.wp+" bar":"–"}</td><td class="mono" style="font-weight:800;font-size:16px;color:var(--info)">${l.wp?Math.round(l.wp*1.5)+" bar":"–"}</td>`:""}
      <td><button class="wsbtn ${l.st[key]?(key==="test"?"on-test":"on-prod"):""}" onclick="wsStage('${f.id}',${i},'${key}')">${l.st[key]?"✅ "+esc(l.st[key].by)+" · "+l.st[key].at:"Bekreft "+s.verb}</button></td>
    </tr>`}).join("")}
  </table></div>
  ${waiting&&!State.ws.onlyRemaining?`<div class="notice" style="margin-top:12px">⏳ ${waiting} slange${waiting===1?" er":"r er"} ikke ${prev.verb} ennå og vises derfor ikke i denne listen.</div>`:""}`;
}

/* --- bekreftelser --- */
function wsStage(id,idx,key){
  const f=folder(id),l=f.lines[idx];
  const prev=prevStage(key);
  if(prev&&!l.st[prev.key])return;                 // rekkefølgen håndheves per slange
  const s=stageDef(key);
  if(l.st[key]){
    l.st[key]=null;
    // fjernes et steg, fjernes også stegene etter (kan ikke være testet uten å være presset)
    let after=false;
    STAGES.forEach(x=>{if(x.key===key)after=true;else if(after)l.st[x.key]=null});
    addLog(f,`${l.pts}: ${s.verb}-bekreftelse fjernet`);
  }else{
    l.st[key]={by:State.user.replace("Verksted – ",""),at:now()};
    addLog(f,`${l.pts} bekreftet ${s.verb}`);
  }
  if(f.status==="prod"&&stageCount(f,"press")===f.lines.length){f.status="test";addLog(f,"Alle slanger presset – status endret til Trykktest")}
  if(f.status==="test"&&stageCount(f,"press")<f.lines.length)f.status="prod";
  render();
}
function wsStageAll(id,key){
  const f=folder(id),prev=prevStage(key),s=stageDef(key);
  let c=0;
  f.lines.forEach(l=>{
    if((!prev||l.st[prev.key])&&!l.st[key]){l.st[key]={by:State.user.replace("Verksted – ",""),at:now()};c++}
  });
  addLog(f,`${c} slanger bekreftet ${s.verb} (samlet bekreftelse)`);
  render();
}
function wsStartQC(id){
  const f=folder(id);
  if(stageCount(f,"test")<f.lines.length)return;
  if(!f.spot)f.spot=buildSpotCheck(f);
  f.status="qc";
  State.ws.stage="qc";
  addLog(f,`Alle operasjoner utført – spot-check startet (${f.spot.items.length} slanger i utvalget)`);
  render();
}
function qcSet(id,idx,result){
  const f=folder(id),it=f.spot.items[idx],l=f.lines[it.i];
  const me=State.user.replace("Verksted – ","");
  if(l.st.test&&l.st.test.by===me){
    it.blockMsg=`Annenhåndskontroll: ${me} trykktestet denne slangen selv og kan ikke kontrollere den. Bytt bruker øverst.`;
    render();return;
  }
  it.blockMsg=null;
  if(it.result===result){it.result=null;it.by=null;it.at=null}
  else{it.result=result;it.by=State.user;it.at=now();
    addLog(f,`Spot-check ${l.pts}: ${result==="ok"?"OK":"AVVIK"}${result==="avvik"&&it.comment?" – "+it.comment:""}`);}
  render();
}
function qcComment(id,idx,val){folder(id).spot.items[idx].comment=val}
function wsCompleteQC(id){
  const f=folder(id);
  if(!spotDone(f))return;
  f.spot.completedAt=now();
  f.status="ferdig";
  State.ws.stage="prints";
  addLog(f,"Spot-check godkjent – mappen er fullført. Trykktestsertifikat, pallemerkelapp og spot-check-rapport er klare for utskrift.");
  render();
}

/* =====================================================================
   TOUCH-/iPad-FOKUS: én slange om gangen, store knapper, auto-videre
   ===================================================================== */
function wsFocusQueue(f,key){
  const prev=prevStage(key);
  let q=f.lines.map((l,i)=>({l,i})).filter(x=>!prev||x.l.st[prev.key]);
  if(key==="cut")q=q.filter(x=>x.l.hose===State.ws.hoseType).sort((a,b)=>(b.l.cut||0)-(a.l.cut||0));
  else if(key==="press")q.sort((a,b)=>(a.l.hose+"").localeCompare(b.l.hose)||(b.l.cut||0)-(a.l.cut||0));
  else if(key==="test")q.sort((a,b)=>(b.l.wp||0)-(a.l.wp||0));
  else q.sort((a,b)=>(b.l.cut||0)-(a.l.cut||0));
  return q;
}
function wsFocusAdvance(f,key,fromPos){
  const q=wsFocusQueue(f,key);
  for(let k=1;k<=q.length;k++){
    const p=(fromPos+k)%q.length;
    if(!q[p].l.st[key]){State.ws.focusPos=p;return}
  }
  State.ws.focusPos=fromPos; // ingen gjenstående – done-kortet vises
}
function wsFocusConfirm(id,idx,key,pos){
  const f=folder(id);
  const wasDone=!!f.lines[idx].st[key];
  wsStage(id,idx,key);
  if(!wasDone)wsFocusAdvance(f,key,pos);
  if(typeof navigator!=="undefined"&&navigator.vibrate)try{navigator.vibrate(30)}catch(e){}
  render();
}

function wsFocus(f,key){
  const s=stageDef(key), prev=prevStage(key);
  const q=wsFocusQueue(f,key);
  const total=q.length, done=q.filter(x=>x.l.st[key]).length;
  const waiting=prev?f.lines.filter(l=>!l.st[prev.key]).length:0;
  const header=`
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <h1 style="font-size:23px">${s.icon} ${s.label}${key==="cut"?` · <span class="mono">${esc(State.ws.hoseType)}</span>`:""} <span class="mono" style="font-size:12px;color:var(--muted)">${f.id}</span></h1>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      ${wsModeBtn()}
      ${key==="cut"?`<button class="btn btn-ghost" onclick="State.ws.hoseType=null;render()">↩︎ Slangetyper</button>`:""}
      <button class="btn btn-ghost" onclick="State.ws.stage=null;render()">↩︎ Operasjoner</button>
    </div>
  </div>`;

  if(total===0)return header+`<div class="focus-wrap"><div class="focus-card donecard">
    <div class="big">⏳</div><div style="font-size:19px">Ingen slanger er klare for ${s.label.toLowerCase()} ennå${prev?` – ${waiting} venter på ${prev.label.toLowerCase()}`:""}.</div>
    <button class="bigbtn next" onclick="State.ws.stage=${prev?`'${prev.key}'`:"null"};State.ws.focusPos=-1;render()">Gå til ${prev?prev.icon+" "+prev.label:"operasjonene"}</button>
  </div></div>`;

  /* alle i køen ferdig? -> done-kort med stor «videre»-knapp */
  if(done===total){
    let nextBtn="";
    if(key==="cut"){
      const next=wsNextType(f,State.ws.hoseType,"cut");
      nextBtn=next
        ?`<button class="bigbtn next" onclick="State.ws.hoseType='${esc(next.hose)}';State.ws.focusPos=-1;render()">➡️ Neste slangetype: ${esc(next.hose)} (${next.items.length-next.done} igjen)</button>
          <div style="margin-top:10px;display:flex;justify-content:center">${hoseThumb(next.hose)}</div>`
        :`<button class="bigbtn next" onclick="State.ws.stage='clean';State.ws.hoseType=null;State.ws.focusPos=-1;render()">➡️ Alt kappet – gå til 🧼 Rens (UC)</button>`;
    }else if(key!=="test"){
      const nx=STAGES[STAGES.findIndex(x=>x.key===key)+1];
      nextBtn=stageCount(f,key)===f.lines.length
        ?`<button class="bigbtn next" onclick="State.ws.stage='${nx.key}';State.ws.focusPos=-1;render()">➡️ Gå til ${nx.icon} ${nx.label}</button>`
        :`<button class="bigbtn ghostb" onclick="State.ws.stage=null;render()">${waiting} slanger venter fortsatt på ${prev.label.toLowerCase()} – til oversikten</button>`;
    }else{
      nextBtn=stageCount(f,"test")===f.lines.length
        ?`<button class="bigbtn confirm" onclick="wsStartQC('${f.id}')">🔍 Start spot-check (annenhåndskontroll)</button>`
        :`<button class="bigbtn ghostb" onclick="State.ws.stage=null;render()">Til operasjonene (${waiting} venter oppstrøms)</button>`;
    }
    return header+`<div class="focus-wrap"><div class="focus-card donecard">
      <div class="big">🎉</div>
      <div style="font-size:21px;font-weight:700">Alle ${total} ${key==="cut"?"av "+esc(State.ws.hoseType):"klare slanger"} er ${s.verb}!</div>
      ${nextBtn}
    </div></div>`;
  }

  let pos=State.ws.focusPos;
  if(pos<0||pos>=total||q[pos]===undefined)pos=Math.max(0,q.findIndex(x=>!x.l.st[key]));
  State.ws.focusPos=pos;
  const {l,i}=q[pos];
  const doneThis=!!l.st[key];
  const stStyle=SERIES_STYLE[seriesOf(l.hose)]||{color:"var(--border2)"};

  const main = key==="cut" ? `<div class="focus-main" style="color:var(--accent2)">${fmtCut(l)}</div><div class="focus-sub">KUTTEMÅL · kontroller mot tegningen over</div>`
    : key==="clean" ? `<div class="focus-main" style="font-size:clamp(34px,6vw,54px)">🧼 ${esc(l.pts)}</div><div class="focus-sub">Rens innvendig og sett UC-propper i begge ender</div>`
    : key==="press" ? `<div class="focus-main mono" style="font-size:clamp(30px,5vw,46px);line-height:1.25">${esc(l.c1)}<br>${esc(l.c2)}</div><div class="focus-sub">KOBLING 1 / KOBLING 2 · kontroller pressinnstilling for ${esc(l.hose)}</div>`
    : `<div class="focus-main" style="color:var(--info)">${l.wp?Math.round(l.wp*1.5)+" bar":"–"}</div><div class="focus-sub">TESTTRYKK (1,5 × WP ${l.wp||"–"} bar) · holdetid 10 min</div>`;

  return header+`
  <div class="focus-wrap">
    <div style="display:flex;justify-content:space-between;align-items:center;margin:6px 0 10px;gap:12px">
      <span style="font-size:15px;font-weight:700">${s.verb.charAt(0).toUpperCase()+s.verb.slice(1)}: ${done} av ${total}</span>
      <div class="meter" style="flex:1;max-width:340px"><div style="width:${Math.round(100*done/total)}%"></div></div>
      ${waiting?`<span style="font-size:12px;color:var(--muted)">+${waiting} venter oppstrøms</span>`:""}
    </div>
    <div class="focus-card" style="border-left:10px solid ${stStyle.color}">
      <div style="display:flex;justify-content:space-between;gap:14px;align-items:flex-start;flex-wrap:wrap">
        <div style="flex:1;min-width:300px">${key==="cut"?hosePhotoPanel(l,{arrow:true}):key==="clean"?hosePhotoPanel(l,{plugs:true}):photoAssembly(l)}</div>
        ${posBlock(l,f)}
      </div>
      <div style="margin-top:14px">${main}</div>
      <div class="focus-meta">
        <div class="fm"><b>${fmtCut(l)}</b><span>Kutt</span></div>
        <div class="fm"><b>${esc(l.len)} mm</b><span>Lengde (OAL)</span></div>
        <div class="fm"><b>${l.wp?l.wp+" bar":"–"}</b><span>WP</span></div>
        ${key!=="press"?`<div class="fm"><b class="mono" style="font-size:14px">${esc(l.c1)}<br>${esc(l.c2)}</b><span>Koblinger</span></div>`:""}
      </div>
      ${doneThis
        ?`<button class="bigbtn confirm" disabled style="opacity:.85">✅ ${s.verb.toUpperCase()} · ${esc(l.st[key].by)} · ${l.st[key].at}</button>
          <button class="bigbtn undo" onclick="wsFocusConfirm('${f.id}',${i},'${key}',${pos})">↩︎ Angre bekreftelsen</button>`
        :`<button class="bigbtn confirm" onclick="wsFocusConfirm('${f.id}',${i},'${key}',${pos})">${s.icon} BEKREFT ${s.verb.toUpperCase()}</button>`}
    </div>
    <div class="focus-nav">
      <button class="navarrow" ${pos===0?"disabled":""} onclick="State.ws.focusPos=${pos-1};render()">◀</button>
      <div class="dots">${total<=30?q.map((x,p)=>`<button class="dot ${x.l.st[key]?"done":""} ${p===pos?"cur":""}" title="POS ${esc(x.l.pos||"–")} · ${esc(x.l.pts)}" onclick="State.ws.focusPos=${p};render()"></button>`).join(""):`<span style="font-size:14px;color:var(--muted)">Slange ${pos+1} av ${total}</span>`}</div>
      <button class="navarrow" ${pos===total-1?"disabled":""} onclick="State.ws.focusPos=${pos+1};render()">▶</button>
    </div>
    ${key==="clean"&&total-done>1?`<button class="bigbtn ghostb" onclick="wsStageAll('${f.id}','clean')">🧼 Merk alle ${total-done} gjenstående som renset</button>`:""}
  </div>`;
}

/* =====================================================================
   SPOT-CHECK (annenhåndskontroll) + UTSKRIFTER
   ===================================================================== */
function vQC(f){
  const sp=f.spot;
  const answered=sp.items.filter(x=>x.result).length;
  const oks=sp.items.filter(x=>x.result==="ok").length;
  const avvik=sp.items.filter(x=>x.result==="avvik");
  return `
  <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
    <h1 style="font-size:23px">🔍 Spot-check – ${esc(f.title)} <span class="mono" style="font-size:12px;color:var(--muted)">${f.id}</span></h1>
    <button class="btn btn-ghost" onclick="State.ws.stage=null;State.ws.folderId=null;render()">↩︎ Verkstedsmodus</button>
  </div>
  <div class="notice">🔍 <div><b>Annenhåndskontroll:</b> ${sp.items.length} av ${f.lines.length} slanger er trukket ut (minst én per slangetype).
  Kontrollen må utføres av en <b>annen person</b> enn den som trykktestet slangen – systemet håndhever dette.
  Kontrollpunkter per slange: mål kuttlengde/OAL, riktige koblinger mot listen, merking/tag, renhet og UC-propper. Innlogget: <b>${esc(State.user)}</b></div></div>
  <div class="cardrow">
    <div class="tile"><div class="t-label">Kontrollert</div><div class="t-value">${answered} / ${sp.items.length}</div><div class="meter m-good"><div style="width:${Math.round(100*oks/sp.items.length)}%"></div></div></div>
    ${avvik.length?`<div class="tile" style="border-color:var(--bad)"><div class="t-label">⛔ Avvik</div><div class="t-value" style="color:var(--bad)">${avvik.length}</div><div class="t-note">må løses og re-kontrolleres</div></div>`:""}
  </div>
  ${sp.items.map((it,idx)=>{
    const l=f.lines[it.i];
    return `<div class="qc-card ${it.result==="ok"?"ok":it.result==="avvik"?"avvik":""}">
      <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap">
        <div style="width:380px;flex-shrink:0">${photoAssembly(l,true)}</div>
        <div style="flex:1;min-width:220px">
          <span class="mono" style="font-size:20px;font-weight:800;color:var(--accent2)">POS ${esc(l.pos||"–")}</span>
          <span style="font-size:13px;font-weight:700"> · Maskin ${esc(l.mach||"–")}</span>
          <span style="color:var(--muted);font-size:12.5px"> · PTS ${esc(l.pts)} · ${esc(l.hose)}</span><br>
          <span style="font-size:13px">Kutt <b class="mono">${fmtCut(l)}</b> · OAL <b class="mono">${esc(l.len)} mm</b> · <span class="mono">${esc(l.c1)} / ${esc(l.c2)}</span></span><br>
          <span style="font-size:11.5px;color:var(--muted)">Trykktestet av ${l.st.test?esc(l.st.test.by)+" · "+l.st.test.at:"–"}</span>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="qc-btn ${it.result==="ok"?"ok-on":""}" onclick="qcSet('${f.id}',${idx},'ok')">✔ OK</button>
          <button class="qc-btn ${it.result==="avvik"?"avvik-on":""}" onclick="qcSet('${f.id}',${idx},'avvik')">⚠ AVVIK</button>
        </div>
      </div>
      ${it.result?`<div style="margin-top:8px;font-size:12px;color:var(--muted)">Signert: ${esc(it.by)} · ${it.at}</div>`:""}
      ${it.result==="avvik"?`<div style="margin-top:8px"><input style="width:100%;background:var(--surface2);border:1px solid var(--bad);border-radius:8px;color:var(--text);padding:9px 12px" placeholder="Beskriv avviket (påkrevd) …" value="${esc(it.comment)}" onchange="qcComment('${f.id}',${idx},this.value)"></div>`:""}
      ${it.blockMsg?`<div class="vitem v-bad" style="margin-top:8px">⛔ <div>${esc(it.blockMsg)}</div></div>`:""}
    </div>`}).join("")}
  <div style="margin-top:16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    ${spotDone(f)?`<button class="btn btn-good btn-big wsbig" onclick="wsCompleteQC('${f.id}')">✅ Godkjenn spot-check og fullfør mappen</button>`
    :`<span class="gatemsg">🔒 Alle ${sp.items.length} kontrollene må være OK før mappen kan fullføres${avvik.length?" – løs avvikene og kontroller på nytt":""}</span>`}
  </div>`;
}

/* --- utskriftspanel når mappen er fullført --- */
function vPrints(f){
  return `
  <div class="focus-wrap">
    <div class="focus-card donecard">

/* =====================================================================
   PRODUKSJONSPLAN – kapasitet og kalender
   ===================================================================== */
function planDays(nDays){
  const days=[];const d=new Date();
  while(days.length<(nDays||15)){
    if(d.getDay()!==0&&d.getDay()!==6){
      days.push({date:new Date(d),key:d.toISOString().slice(0,10),
        label:["sø","ma","ti","on","to","fr","lø"][d.getDay()]+" "+String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")});
    }
    d.setDate(d.getDate()+1);
  }
  return days;
}
function planFolders(){
  return State.folders
    .filter(f=>["klar","prod","test","qc"].includes(f.status)&&f.lines.length)
    .sort((a,b)=>{
      const pri=x=>x.status==="klar"?1:0;                 // pågående først
      if(pri(a)!==pri(b))return pri(a)-pri(b);
      return (a.plannedStart||"9999")<(b.plannedStart||"9999")?-1:1;
    });
}
function planSchedule(){
  const days=planDays(15);
  const cap=State.plan.fitters*State.plan.hoursPerDay;
  const used=days.map(()=>0);
  const rowsAlloc=[];
  let cursor=0;
  planFolders().forEach(f=>{
    let rem=remainingHours(f);
    const alloc={};
    let d=f.plannedStart?Math.max(days.findIndex(x=>x.key>=f.plannedStart),0):cursor;
    if(f.plannedStart&&days.findIndex(x=>x.key>=f.plannedStart)<0)d=days.length; // starter etter horisonten
    let overflow=0;
    while(rem>0.049){
      if(d>=days.length){overflow=rem;break}
      const avail=cap-used[d];
      if(avail<=0.049){d++;continue}
      const take=Math.min(avail,rem);
      alloc[d]=Math.round(take*10)/10;
      used[d]+=take;rem-=take;
      if(rem>0.049)d++;
    }
    cursor=Math.max(cursor,Math.min(d,days.length));
    rowsAlloc.push({f,alloc,overflow,doneDay:d});
  });
  return {days,cap,used,rowsAlloc};
}
